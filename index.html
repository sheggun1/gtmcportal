<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Tomorrow Model College — Grade System</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f7f5f0;--card:#fff;--ink:#2b1d0e;--muted:#7a6a58;--line:#e5dccf;
    --brown:#6b4423;--brown-dark:#4a2f18;--gold:#e6b422;
    --blue:#1e3a8a;--blue-dark:#172d6b;
    --ok:#15803d;--err:#b91c1c;
  }
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#3a2413 0%,#6b4423 45%,#4a2f18 100%)}
  .login-card{background:#fff;padding:36px 32px;border-radius:16px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4);border-top:5px solid var(--gold)}
  .login-logo{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:var(--gold);font-family:Georgia,serif;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;border:3px solid var(--gold)}
  .login-card h1{text-align:center;font-size:18px;color:var(--brown);margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
  .login-card .motto{text-align:center;color:var(--blue);font-style:italic;font-size:12px;font-weight:700;margin-bottom:22px}
  .login-card label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;margin-top:10px}
  .login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .login-card input:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 3px rgba(107,68,35,.12)}
  .login-card button{width:100%;padding:12px;margin-top:18px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .login-card button:hover{background:linear-gradient(135deg,var(--blue-dark),#0f1f4a)}
  .login-card button:disabled{opacity:.5;cursor:not-allowed}
  .login-err{color:var(--err);font-size:13px;text-align:center;margin-top:12px;min-height:18px;font-weight:600}

  header.topbar{background:#fff;border-bottom:3px solid var(--gold);padding:0 22px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
  .brand{display:flex;align-items:center;gap:12px}
  .logo-mini{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:var(--gold);font-family:Georgia,serif;font-weight:800;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--gold)}
  .brand-text .name{font-size:12px;font-weight:800;color:var(--brown)}
  .brand-text .tag{font-size:10px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .user{display:flex;gap:12px;align-items:center;font-size:12px}
  .user .who{text-align:right;line-height:1.15}
  .user .uname{font-weight:700}
  .user .urole{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.06em}
  button.btn{font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border:1px solid transparent;border-radius:7px;background:var(--brown);color:#fff;cursor:pointer}
  button.btn:hover{background:var(--brown-dark)}
  button.btn.sec{background:#fff;color:var(--brown);border-color:var(--line)}
  button.btn.sec:hover{background:#faf7f2}
  button.btn.ok{background:var(--ok)}
  button.btn.ok:hover{background:#166534}
  button.btn.blue{background:var(--blue)}
  button.btn.blue:hover{background:var(--blue-dark)}
  button.btn.danger{background:var(--err)}
  button.btn.danger:hover{background:#991b1b}
  button.btn.sm{padding:5px 10px;font-size:12px}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  main{padding:22px;max-width:1400px;margin:0 auto;width:100%;flex:1}
  .page-head{margin-bottom:18px}
  .page-head h1{font-size:22px;font-weight:800;color:var(--brown);margin-bottom:4px}
  .page-head p{color:var(--muted);font-size:13px}

  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
  .tab{padding:10px 18px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab.active{color:var(--brown);border-bottom-color:var(--gold)}
  .section{display:none}.section.active{display:block}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(43,29,14,.06)}
  .card h2{font-size:15px;font-weight:800;color:var(--brown);margin-bottom:10px}
  .card .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  input,select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 3px rgba(107,68,35,.12)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fbf9f5}
  .check input{width:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{background:#faf7f2;font-size:11px;color:var(--brown);text-transform:uppercase;letter-spacing:.05em}
  .empty{text-align:center;padding:32px 20px;color:var(--muted);font-size:13px}
  .badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#e0e7ff;color:#1e3a8a}
  .badge.ok{background:#d1fae5;color:#065f46}
  .badge.warn{background:#fef3c7;color:#92400e}
  .badge.err{background:#fee2e2;color:#991b1b}
  .portal-note{padding:10px 14px;border-radius:8px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;margin:10px 0;font-size:12.5px}
  .score-input{width:64px;padding:4px 6px;text-align:center;font-size:13px}
  .dmn-select{width:100%;min-width:110px;padding:4px 6px;font-size:12px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .dmn-select:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 2px rgba(107,68,35,.12)}

  .report{position:relative;overflow:hidden;padding:20px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .report .watermark{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:55% auto;opacity:.06;pointer-events:none;z-index:0}
  .report > *:not(.watermark){position:relative;z-index:1}
  .report-head{text-align:center;padding:12px 10px;border-bottom:2px solid var(--gold);margin-bottom:14px}
  .report-head img{max-width:80px;max-height:80px;object-fit:contain;margin-bottom:6px}
  .report-head h2{font-size:18px;font-weight:800}
  .report-head .motto{color:var(--muted);font-size:12px;margin-top:2px}
  .report-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px;font-size:13px}
  .report-meta label{margin-bottom:2px}
  .report-meta strong{display:block;font-size:14px;color:var(--ink)}
  .domain-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px;padding:10px;background:#fbf9f5;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
  .domain-row div{text-align:center}
  .domain-row strong{display:block;font-size:11px;color:var(--brown);text-transform:uppercase;margin-bottom:3px}
  .principal-block{margin-top:16px;padding-top:14px;border-top:2px solid #2d3748}
  .principal-block h5{font-size:12px;color:#2d3748;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .principal-block p{font-size:13px;line-height:1.5;margin-bottom:14px}
  .sig-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
  .sig-cell{text-align:center;flex:1}
  .sig-cell .img{min-height:50px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}
  .sig-cell .img img{max-height:60px;max-width:160px;object-fit:contain}
  .sig-cell .line{border-top:1px solid #2d3748;padding-top:4px;font-weight:700;font-size:13px}
  .sig-cell .label{font-size:11px;color:var(--muted);margin-top:2px}

  .chat-message{padding:10px 14px;border-radius:8px;margin:8px 0;font-size:13px;white-space:pre-wrap}
  .chat-message.user{background:#eff6ff;margin-left:20px}
  .chat-message.ai{background:#f0fdf4;margin-right:20px}

  .toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;background:#2b1d0e;color:#fff;font-weight:600;font-size:13px;opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;z-index:1000;max-width:340px}
  .toast.on{opacity:1;transform:translateY(0)}
  .toast.ok{background:var(--ok)}.toast.err{background:var(--err)}

  @media print{
    body{background:#fff}
    header,button,.toolbar-tab,.card.toolbar,h1,p.page-sub{display:none!important}
    main{padding:0;max-width:none}
    .report{border:none;padding:0;box-shadow:none}
    .report .watermark{opacity:.08!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .principal-block,.domain-row,.sig-row{page-break-inside:avoid}
  }
  @media(max-width:640px){
    header{padding:0 12px}
    .brand-text .tag{display:none}
    .user .who{display:none}
    main{padding:14px}
    .card{padding:14px}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">G</div>
    <h1>Greater Tomorrow Model College</h1>
    <div class="motto">“Jesus, Our Teacher”</div>
    <label>Email or Student ID</label>
    <input id="loginEmail" placeholder="you@school.com" autocomplete="username">
    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" onclick="doLogin()">Sign In</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView" style="display:none;min-height:100vh;flex-direction:column">
  <header class="topbar">
    <div class="brand">
      <div class="logo-mini">G</div>
      <div class="brand-text">
        <div class="name">GREATER TOMORROW MODEL COLLEGE</div>
        <div class="tag" id="roleTag">Jesus, Our Teacher</div>
      </div>
    </div>
    <div class="user">
      <div class="who">
        <div class="uname" id="userLabel"></div>
        <div class="urole" id="userRole"></div>
      </div>
      <button class="btn sec sm" onclick="logout()">Logout</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="toast" class="toast"></div>

<script>
/* ================= CONFIG ================= */
const API = 'https://script.google.com/macros/s/AKfycbwLPGtBMs9BqxqRIOge5qiGTX_Vha1VxOxXfdKz0SDX62Nru5cdKzNNkipii9zpiayN/exec';

/* ================= SESSION ================= */
const S = {
  token: localStorage.getItem('gs_token') || '',
  user: JSON.parse(localStorage.getItem('gs_user') || 'null'),
  cache: { classes: null, subjectsByClass: {} }
};

async function api(action, payload = {}) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, token: S.token }, payload)),
    redirect: 'follow'
  });
  const raw = await res.text();
  let json;
  try { json = JSON.parse(raw); } catch (e) {
    throw new Error('Non-JSON (' + res.status + '): ' + raw.slice(0, 180));
  }
  if (!json || json.success !== true) {
    if (/session/i.test((json && json.error) || '')) logout();
    if (/^unknown action/i.test((json && json.error) || '')) {
      throw new Error('Deployment is stale. Redeploy. Detail: ' + json.error);
    }
    throw new Error((json && json.error) || 'Request failed');
  }
  return json.data;
}

function saveSession(token, user) {
  S.token = token; S.user = user;
  localStorage.setItem('gs_token', token);
  localStorage.setItem('gs_user', JSON.stringify(user));
}
function logout() {
  localStorage.removeItem('gs_token');
  localStorage.removeItem('gs_user');
  S.token = ''; S.user = null;
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('appView').style.display = 'none';
}

/* ================= HELPERS ================= */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function q(id) { return document.getElementById(id); }
function toast(msg, kind) {
  const el = q('toast');
  el.textContent = msg;
  el.className = 'toast on' + (kind ? ' ' + kind : '');
  setTimeout(() => el.className = 'toast', 2600);
}
function roleList() {
  if (!S.user) return [];
  return String(S.user.role || '').split(',').map(s => s.trim()).filter(Boolean);
}
function hasRole(r) { return roleList().indexOf(r) !== -1; }

async function loadClasses() {
  if (S.cache.classes) return S.cache.classes;
  const list = await api('getClasses');
  S.cache.classes = list.map(c => c.class);
  return S.cache.classes;
}
async function loadSubjects(className) {
  if (S.cache.subjectsByClass[className]) return S.cache.subjectsByClass[className];
  const subs = await api('getSubjectsForClass', { className });
  S.cache.subjectsByClass[className] = subs;
  return subs;
}

/* ================= LOGIN ================= */
async function doLogin() {
  const email = q('loginEmail').value.trim();
  const password = q('loginPassword').value;
  const btn = q('loginBtn'), err = q('loginErr');
  err.textContent = '';
  if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  let staffErr = null;
  try {
    try {
      const r = await api('login', { email, password });
      saveSession(r.token, r.user);
      boot();
      return;
    } catch (e) { staffErr = e; }
    try {
      const r = await api('parentLogin', { email, password });
      saveSession(r.token, r.user);
      boot();
      return;
    } catch (e2) {
      err.textContent = (staffErr && staffErr.message) || e2.message;
    }
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

/* ================= BOOT ================= */
function boot() {
  if (!S.token || !S.user) { logout(); return; }
  q('loginView').style.display = 'none';
  const av = q('appView');
  av.style.display = 'flex';
  q('userLabel').textContent = S.user.name || S.user.email;
  q('userRole').textContent = roleList().map(r => ({
    admin:'Administrator', class_teacher:'Class Teacher',
    subject_teacher:'Subject Teacher', student:'Student', parent:'Parent'
  })[r] || r).join(' · ');

  if (hasRole('admin')) renderAdmin();
  else if (hasRole('class_teacher')) renderClassTeacher();
  else if (hasRole('subject_teacher')) renderSubjectTeacher();
  else if (hasRole('student')) renderStudent();
  else if (hasRole('parent')) renderParent();
  else toast('Unknown role: ' + S.user.role, 'err');
}

/* ================= DOMAIN ITEM DEFINITIONS ================= */
const AFFECTIVE_ITEMS = [
  ['punctuality', 'Punctuality'],
  ['attendance', 'Attendance'],
  ['honesty', 'Honesty'],
  ['cooperation', 'Cooperation'],
  ['leadership', 'Leadership'],
  ['club_participation', 'Club participation'],
  ['obedience', 'Obedience'],
  ['neatness', 'Neatness'],
  ['responsibility', 'Responsibility'],
  ['self_control', 'Self-control']
];
const PSYCHOMOTOR_ITEMS = [
  ['handwriting', 'Handwriting'],
  ['drawing', 'Drawing and painting'],
  ['handwork', 'Handwork / practical skills'],
  ['sports', 'Sports and physical activities'],
  ['coordination', 'Coordination and dexterity'],
  ['tools', 'Use of tools and equipment']
];
const DMN_RATINGS = { 5: 'Excellent', 4: 'Very Good', 3: 'Good', 2: 'Fair', 1: 'Needs Improvement' };

/* ================= DOMAIN EDITOR (shared by admin & class teacher) ================= */
let DMN_KIND = 'affective';

function domainEditorHtml() {
  return `
    <div class="card">
      <h2>Affective &amp; Psychomotor Domains</h2>
      <div class="sub">Rate every item 1–5 per student, per term, per academic year. Ratings save as you change them.</div>
      <div class="grid">
        <div><label>Class</label><select id="dmnClass"></select></div>
        <div><label>Term</label><select id="dmnTerm"><option>Term1</option><option>Term2</option><option>Term3</option></select></div>
        <div><label>Academic Year</label><input id="dmnYear" value="2026/2027"></div>
        <div style="display:flex;align-items:flex-end"><button class="btn blue" onclick="reloadDomainEditor()">Load</button></div>
      </div>
    </div>
    <div class="card">
      <div class="tabs" id="dmnKindTabs" style="margin-bottom:12px">
        <div class="tab active" data-kind="affective" onclick="switchDomainKind('affective')">Affective Domain</div>
        <div class="tab" data-kind="psychomotor" onclick="switchDomainKind('psychomotor')">Psychomotor Domain</div>
      </div>
      <div id="domainEditorBox"><div class="empty">Load a class and term.</div></div>
    </div>`;
}

function switchDomainKind(kind) {
  DMN_KIND = kind;
  document.querySelectorAll('#dmnKindTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.kind === kind));
  reloadDomainEditor();
}

async function initDomainSelector() {
  const classes = await loadClasses();
  const sel = q('dmnClass');
  if (!sel.dataset.filled) {
    sel.innerHTML = classes.map(c => `<option>${esc(c)}</option>`).join('');
    sel.dataset.filled = '1';
    // Class teachers are locked to their own class
    if (!hasRole('admin') && S.user.class) {
      sel.value = S.user.class;
      sel.disabled = true;
    }
  }
}

async function reloadDomainEditor() {
  await initDomainSelector();
  const className = hasRole('admin') ? q('dmnClass').value : S.user.class;
  const term = q('dmnTerm').value;
  const academicYear = q('dmnYear').value.trim();
  const box = q('domainEditorBox');
  if (!className || !term || !academicYear) { box.innerHTML = '<div class="empty">Fill class, term and year.</div>'; return; }
  box.innerHTML = '<div class="empty">Loading…</div>';

  try {
    const [students, existing] = await Promise.all([
      api('getStudents', { className }),
      api('getDomainAssessments', { kind: DMN_KIND, className, term, academicYear })
    ]);
    if (!students.length) { box.innerHTML = '<div class="empty">No students in this class.</div>'; return; }

    const byStudent = {};
    (existing || []).forEach(r => { byStudent[r.student_id] = r; });

    const items = DMN_KIND === 'affective' ? AFFECTIVE_ITEMS : PSYCHOMOTOR_ITEMS;

    const headerHtml = `<th style="min-width:170px">Student</th>` +
      items.map(([key, label]) => `<th style="text-align:center;min-width:120px">${esc(label)}</th>`).join('');

    const rowsHtml = students.map(st => {
      const row = byStudent[st.student_id] || {};
      const cells = items.map(([key]) => {
        const val = row[key];
        const opts = ['',1,2,3,4,5].map(n =>
          `<option value="${n}" ${String(val || '') === String(n) ? 'selected' : ''}>${n === '' ? '—' : n + ' · ' + DMN_RATINGS[n]}</option>`
        ).join('');
        return `<td style="text-align:center">
          <select class="dmn-select" data-student="${esc(st.student_id)}" data-item="${key}">${opts}</select>
        </td>`;
      }).join('');
      return `<tr>
        <td><strong>${esc(st.name)}</strong><br>
          <small style="color:var(--muted);font-size:11px;font-family:ui-monospace,monospace">${esc(st.student_id)}</small>
        </td>${cells}</tr>`;
    }).join('');

    box.innerHTML = `
      <div style="overflow-x:auto">
        <table>
          <thead><tr>${headerHtml}</tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <p class="portal-note" style="margin-top:12px">
        Ratings: <strong>5</strong> Excellent · <strong>4</strong> Very Good · <strong>3</strong> Good · <strong>2</strong> Fair · <strong>1</strong> Needs Improvement.
        Each change saves immediately.
      </p>`;

    box.querySelectorAll('select.dmn-select').forEach(sel => {
      sel.addEventListener('change', () => saveDomainRating(sel, className, term, academicYear));
    });
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function saveDomainRating(sel, className, term, academicYear) {
  const studentId = sel.dataset.student;
  const item = sel.dataset.item;
  const value = sel.value;
  sel.style.background = '#fffbea';
  try {
    await api('saveDomainAssessment', { kind: DMN_KIND, className, term, academicYear, studentId, item, value });
    sel.style.background = '#f0fdf4';
    setTimeout(() => { sel.style.background = ''; }, 800);
  } catch (e) {
    sel.style.background = '#fef2f2';
    toast('Save failed: ' + e.message, 'err');
  }
}

/* ================= ADMIN ================= */
async function renderAdmin() {
  q('roleTag').textContent = 'Administrator · Jesus, Our Teacher';
  const c = q('main');
  c.innerHTML = `

function showTab(groupId, tabId) {
  const group = q(groupId);
  if (!group) return;
  group.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
  const main = group.parentElement;
  main.querySelectorAll(':scope > .section').forEach(s => s.classList.toggle('active', s.dataset.tab === tabId));
}

/* ---- admin: teachers ---- */
async function createTeacher() {
  const name = q('tName').value.trim();
  const email = q('tEmail').value.trim();
  const password = q('tPass').value;
  const cls = q('tClass').value;
  const roles = [];
  if (q('roleCT').checked) roles.push('class_teacher');
  if (q('roleST').checked) roles.push('subject_teacher');
  if (q('roleAD').checked) roles.push('admin');
  if (!name || !email || !password) return toast('Name, email, password required', 'err');
  if (!roles.length) return toast('Pick at least one role', 'err');
  const subjects = roles.indexOf('subject_teacher') !== -1
    ? Array.from(q('tSubjects').selectedOptions).map(o => o.value).join(',')
    : '';
  try {
    await api('createTeacher', { name, email, password, role: roles.join(','), class: cls, subjects });
    toast('Teacher created', 'ok');
    q('tName').value = ''; q('tEmail').value = ''; q('tPass').value = '';
    loadTeachers();
  } catch (e) { toast(e.message, 'err'); }
}

async function loadTeachers() {
  const box = q('teachersBox');
  try {
    const rows = await api('getTeachers');
    if (!rows.length) { box.innerHTML = '<div class="empty">No teachers yet.</div>'; return; }
    box.innerHTML = `<table><thead><tr><th>Name</th><th>Email</th><th>Roles</th><th>Class</th><th></th></tr></thead>
      <tbody>${rows.map(t => `
        <tr>
          <td><strong>${esc(t.name)}</strong></td>
          <td>${esc(t.email)}</td>
          <td>${(t.roles && t.roles.length ? t.roles : String(t.role).split(',')).map(r => `<span class="badge">${esc(r)}</span>`).join(' ')}</td>
          <td>${esc(t.class || '—')}</td>
          <td>${t.active === false ? '' : `<button class="btn danger sm" onclick="deleteTeacher('${esc(t.email)}')">Disable</button>`}</td>
        </tr>`).join('')}</tbody></table>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function deleteTeacher(email) {
  if (!confirm('Disable this teacher?')) return;
  try { await api('deleteTeacher', { email }); toast('Disabled', 'ok'); loadTeachers(); }
  catch (e) { toast(e.message, 'err'); }
}

/* ---- admin: publish ---- */
async function publishClass(publish) {
  const className = q('pubClass').value, term = q('pubTerm').value;
  const academicYear = q('pubYear').value.trim();
  if (!confirm(`${publish ? 'Publish' : 'Unpublish'} the whole of ${className} / ${term} / ${academicYear}?`)) return;
  try {
    const r = publish
      ? await api('adminPublishClass', { className, term, academicYear })
      : await api('adminUnpublishClass', { className, term, academicYear });
    q('pubStatus').textContent = publish
      ? `Published: ${r.created} new, ${r.updated} updated, ${r.already} already (of ${r.total}).`
      : `Unpublished: ${r.changed} result(s).`;
    toast(publish ? 'Published' : 'Unpublished', 'ok');
  } catch (e) { q('pubStatus').textContent = 'Error: ' + e.message; toast(e.message, 'err'); }
}

/* ---- admin: principal remarks ---- */
async function loadRemarksList() {
  const className = q('remClass').value, term = q('remTerm').value;
  const academicYear = q('remYear').value.trim();
  const box = q('remCard');
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const students = await api('getStudents', { className });
    if (!students.length) { box.innerHTML = '<div class="empty">No students.</div>'; return; }
    const info = await Promise.all(students.map(s =>
      api('adminPreviewPrincipalRemark', { className, studentId: s.student_id, term, academicYear })
        .catch(err => ({ error: err.message }))
    ));
    box.innerHTML = `<table><thead><tr><th>Student</th><th>Overall %</th><th>Source</th><th>Remark</th></tr></thead>
      <tbody>${info.map((r, i) => `
        <tr data-student="${esc(students[i].student_id)}">
          <td><strong>${esc(students[i].name)}</strong></td>
          <td>${r.error ? '—' : (r.overallPercent != null ? r.overallPercent + '%' : '—')}</td>
          <td>${r.error ? `<span class="badge err">${esc(r.error)}</span>` : `<span class="badge ${r.source === 'override' ? 'warn' : ''}">${esc(r.source)}</span>`}</td>
          <td><textarea rows="2" style="width:100%">${esc(r.remark || '')}</textarea></td>
        </tr>`).join('')}</tbody></table>
      <div class="row" style="margin-top:12px"><button class="btn ok" onclick="saveAllRemarks()">Save All</button></div>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function saveAllRemarks() {
  const rows = document.querySelectorAll('#remCard tbody tr');
  const className = q('remClass').value, term = q('remTerm').value;
  const academicYear = q('remYear').value.trim();
  let ok = 0, fail = 0;
  for (const tr of rows) {
    const studentId = tr.dataset.student;
    const remark = tr.querySelector('textarea').value.trim();
    try { await api('adminSetPrincipalRemark', { className, studentId, term, academicYear, remark }); ok++; }
    catch (e) { fail++; }
  }
  toast(`Saved ${ok}${fail ? ' · failed ' + fail : ''}`, fail ? 'err' : 'ok');
  loadRemarksList();
}

  const className = q('remClass').value, term = q('remTerm').value;

      api('getScores', { className: S.user.class, subject, term })
    ]);
    if (!students.length) { box.innerHTML = '<div class="empty">No students.</div>'; return; }
    const map = {}; scores.forEach(s => map[s.student_id] = s);
    box.innerHTML = `
      <h2>${esc(subject)} · ${esc(term)}</h2>
      <table><thead><tr><th>Student</th><th>T1</th><th>T2</th><th>T3</th><th>Exam</th><th>Total</th></tr></thead>
      <tbody>${students.map(st => {
        const sc = map[st.student_id] || {};
        const total = (Number(sc.T1)||0)+(Number(sc.T2)||0)+(Number(sc.T3)||0)+(Number(sc.Exam)||0);
        return `<tr data-student="${esc(st.student_id)}">
          <td><strong>${esc(st.name)}</strong></td>
          ${['T1','T2','T3','Exam'].map(f => `<td><input class="score-input" type="number" min="0" max="${f==='Exam'?70:10}" data-f="${f}" value="${sc[f] ?? ''}"></td>`).join('')}
          <td style="font-weight:700;color:var(--blue)" class="total">${total || ''}</td>
        </tr>`;
      }).join('')}</tbody></table>
      <div class="row" style="margin-top:12px"><button class="btn ok" onclick="ctSubmit('${esc(subject)}','${esc(term)}')">Submit &amp; Lock</button></div>`;
    box.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => ctSaveCell(inp, subject, term)));
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function ctSaveCell(inp, subject, term) {
  const tr = inp.closest('tr');
  try {
    await api('saveScore', { className: S.user.class, subject, term, field: inp.dataset.f, studentId: tr.dataset.student, value: inp.value });
    inp.style.background = '#f0fdf4';
    setTimeout(() => { inp.style.background = ''; }, 800);
    const total = Array.from(tr.querySelectorAll('input')).reduce((a, i) => a + (Number(i.value) || 0), 0);
    tr.querySelector('.total').textContent = total || '';
  } catch (e) { toast('Save failed: ' + e.message, 'err'); inp.style.background = '#fef2f2'; }
}

async function ctSubmit(subject, term) {
  if (!confirm(`Submit & lock ${subject} / ${term}?`)) return;
  try { await api('submitScores', { className: S.user.class, subject, term }); toast('Locked', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}

async function stFillSubjects() {
  const cls = q('stClass').value;
  const subs = await loadSubjects(cls);
  const mine = String(S.user.subjects || '').split(',').map(s => s.trim()).filter(Boolean);
  const filtered = mine.length ? subs.filter(s => mine.indexOf(s) !== -1) : subs;
  q('stSubject').innerHTML = filtered.length
    ? filtered.map(s => `<option>${esc(s)}</option>`).join('')
    : '<option value="">No assigned subjects</option>';
}

async function stLoadScores() {
  const className = q('stClass').value, subject = q('stSubject').value, term = q('stTerm').value;
  if (!subject) return toast('No subject', 'err');
  const box = q('stScoreCard');
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const [students, scores] = await Promise.all([
      api('getStudents', { className }),
      api('getScores', { className, subject, term })
    ]);
    if (!students.length) { box.innerHTML = '<div class="empty">No students.</div>'; return; }
    const map = {}; scores.forEach(s => map[s.student_id] = s);
    box.innerHTML = `
      <h2>${esc(subject)} · ${esc(className)} · ${esc(term)}</h2>
      <table><thead><tr><th>Student</th><th>T1</th><th>T2</th><th>T3</th><th>Exam</th><th>Total</th></tr></thead>
      <tbody>${students.map(st => {
        const sc = map[st.student_id] || {};
        const total = (Number(sc.T1)||0)+(Number(sc.T2)||0)+(Number(sc.T3)||0)+(Number(sc.Exam)||0);
        return `<tr data-student="${esc(st.student_id)}">
          <td><strong>${esc(st.name)}</strong></td>
          ${['T1','T2','T3','Exam'].map(f => `<td><input class="score-input" type="number" min="0" max="${f==='Exam'?70:10}" data-f="${f}" value="${sc[f] ?? ''}"></td>`).join('')}
          <td style="font-weight:700;color:var(--blue)" class="total">${total || ''}</td>
        </tr>`;
      }).join('')}</tbody></table>
      <div class="row" style="margin-top:12px"><button class="btn ok" onclick="stSubmit('${esc(className)}','${esc(subject)}','${esc(term)}')">Submit &amp; Lock</button></div>`;
    box.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => stSaveCell(inp, className, subject, term)));
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function stSaveCell(inp, className, subject, term) {
  const tr = inp.closest('tr');
  try {
    await api('saveScore', { className, subject, term, field: inp.dataset.f, studentId: tr.dataset.student, value: inp.value });
    inp.style.background = '#f0fdf4';
    setTimeout(() => { inp.style.background = ''; }, 800);
    const total = Array.from(tr.querySelectorAll('input')).reduce((a, i) => a + (Number(i.value) || 0), 0);
    tr.querySelector('.total').textContent = total || '';
  } catch (e) { toast('Save failed: ' + e.message, 'err'); inp.style.background = '#fef2f2'; }
}

async function stSubmit(className, subject, term) {
  if (!confirm(`Submit & lock ${subject} / ${className} / ${term}?`)) return;
  try { await api('submitScores', { className, subject, term }); toast('Locked', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}

async function stLoadHistory() {
  const box = q('stHistory');
  try {
    const rows = await api('getSubmissions');
    if (!rows.length) { box.innerHTML = '<div class="empty">No submissions.</div>'; return; }
    box.innerHTML = `<table><thead><tr><th>Class</th><th>Subject</th><th>Term</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.class)}</td><td>${esc(r.subject)}</td><td>${esc(r.term)}</td><td><span class="badge">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table>`;

/* ================= PARENT ================= */
async function renderParent() {
  q('roleTag').textContent = 'Parent Portal · Jesus, Our Teacher';
  q('main').innerHTML = `
    <div class="page-head"><h1>Parent Portal</h1><p>View published results for your ward.</p></div>
    <div class="card toolbar">
      <div class="grid">
        <div><label>Ward</label><select id="pWard"></select></div>
        <div><label>Term</label><select id="pTerm"><option>Term1</option><option>Term2</option><option>Term3</option></select></div>
        <div><label>Academic Year</label><input id="pYear" value="2026/2027"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn blue" onclick="parentLoad()">Load Result</button>
        <button class="btn sec" onclick="window.print()">Print</button>
      </div>
      <div id="pStatus" class="portal-note">Choose ward, term and year.</div>
    </div>
    <div id="pReportBox"></div>
    <div class="card">
      <h2>Ask Academic Assistant</h2>
      <div id="pChat"><div class="empty">Load a result first.</div></div>
      <textarea id="pQuestion" style="margin-top:10px;min-height:70px" placeholder="Which subjects should my child focus on?"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" onclick="parentAsk()">Ask</button></div>
    </div>`;

  try {
    const wards = await api('parentGetWards');
    window.__WARDS = wards;
    const sel = q('pWard');
    if (!wards.length) {
      sel.innerHTML = '<option value="">No wards linked</option>';
      q('pStatus').textContent = 'No student is linked to this account. Contact the school.';
      return;
    }
    sel.innerHTML = wards.map((w, i) => `<option value="${i}">${esc(w.studentName)} · ${esc(w.className)}</option>`).join('');
  } catch (e) { q('pStatus').textContent = e.message; }
}

async function parentLoad() {
  const idx = q('pWard').value;
  if (idx === '') return;
  const ward = window.__WARDS[Number(idx)];
  const term = q('pTerm').value, academicYear = q('pYear').value.trim();
  q('pStatus').textContent = 'Loading…';
  try {
    const r = await api('parentGetResult', { className: ward.className, studentId: ward.studentId, term, academicYear });
    window.__CURRENT_RESULT = r;
    q('pStatus').textContent = 'Loaded.';
    renderParentReport(r);
  } catch (e) { q('pStatus').textContent = e.message; q('pReportBox').innerHTML = ''; toast(e.message, 'err'); }
}

function domainTable(title, kind, data, show) {
  if (!show) return '';
  const items = kind === 'affective' ? AFFECTIVE_ITEMS : PSYCHOMOTOR_ITEMS;
  if (!data) return `
    <div class="card" style="margin-top:14px">
      <h2 style="font-size:13px;color:var(--brown);text-transform:uppercase;letter-spacing:.05em">${esc(title)}</h2>
      <div class="empty" style="padding:14px">Not recorded for this term.</div>
    </div>`;
  const rows = items.map(([key, label]) => {
    const v = Number(data[key]);
    const has = v >= 1 && v <= 5;
    return `<tr><td>${esc(label)}</td>
      <td style="text-align:center;font-weight:700">${has ? v : '—'}</td>
      <td>${has ? esc(DMN_RATINGS[v]) : '—'}</td></tr>`;
  }).join('');
  return `
    <div class="card" style="margin-top:14px">
      <h2 style="font-size:13px;color:var(--brown);text-transform:uppercase;letter-spacing:.05em">${esc(title)}</h2>
      <table style="margin-top:8px">
        <thead><tr><th>Item</th><th style="text-align:center;width:70px">Score</th><th>Rating</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderParentReport(r) {
  const t = r.template || {};
  const primary = /^#[0-9a-f]{6}$/i.test(t.primaryColor || '') ? t.primaryColor : '#1e3a8a';
  const logo = t.logoUrl ? `<img src="${esc(t.logoUrl)}" alt="">` : '';
  const watermark = t.logoUrl ? `<div class="watermark" style="background-image:url('${esc(t.logoUrl)}')"></div>` : '';
  const showTests = t.showTests !== false, showExam = t.showExam !== false;
  const showTotals = t.showSubjectTotals !== false, showGrade = t.showGrade !== false;

  const cols = ['<th>Subject</th>'];
  if (showTests) cols.push('<th style="text-align:center">T1</th><th style="text-align:center">T2</th><th style="text-align:center">T3</th>');
  if (showExam) cols.push('<th style="text-align:center">Exam</th>');
  if (showTotals) cols.push('<th style="text-align:center">Total</th>');
  if (showGrade) cols.push('<th style="text-align:center">Grade</th>');

  const rows = (r.subjects || []).map(s => {
    let h = `<td><strong>${esc(s.subject)}</strong></td>`;
    if (showTests) h += `<td style="text-align:center">${s.T1 ?? '—'}</td><td style="text-align:center">${s.T2 ?? '—'}</td><td style="text-align:center">${s.T3 ?? '—'}</td>`;
    if (showExam) h += `<td style="text-align:center">${s.Exam ?? '—'}</td>`;
    if (showTotals) h += `<td style="text-align:center;font-weight:700;color:var(--blue)">${s.total ?? '—'}</td>`;
    if (showGrade) h += `<td style="text-align:center">${esc(s.grade || '—')}</td>`;
    return `<tr>${h}</tr>`;
  }).join('');

  const d = r.domains || {};
  const domainBlock = (t.showAffective !== false || t.showPsychomotor !== false || t.showAttendance !== false) ? `
    <div class="domain-row">
      ${t.showAttendance !== false ? `<div><strong>Days Opened</strong>${d.days_opened ?? '—'}</div><div><strong>Days Present</strong>${d.days_present ?? '—'}</div>` : ''}
      ${t.showAffective !== false ? `<div><strong>Affective</strong>${esc(d.affective || '—')}</div>` : ''}
      ${t.showPsychomotor !== false ? `<div><strong>Psychomotor</strong>${esc(d.psychomotor || '—')}</div>` : ''}
    </div>` : '';

  const affectiveTable = domainTable('Affective Domain', 'affective', r.affective, t.showAffective !== false);
  const psychomotorTable = domainTable('Psychomotor Domain', 'psychomotor', r.psychomotor, t.showPsychomotor !== false);

  const principal = t.showPrincipalRemark !== false ? `
    <div class="principal-block">
      <h5>Principal's Report</h5>
      <p>${esc(r.principalRemark || '')}</p>
      <div class="sig-row">
        <div class="sig-cell">
          <div class="img">${t.principalSignatureUrl ? `<img src="${esc(t.principalSignatureUrl)}" alt="">` : ''}</div>
          <div class="line">${esc(t.principalName || 'The Principal')}</div>
          <div class="label">Principal's Signature</div>
        </div>
        <div class="sig-cell">
          <div class="img">${t.schoolStampUrl ? `<img src="${esc(t.schoolStampUrl)}" alt="">` : ''}</div>
          <div class="line">School Stamp</div>
          <div class="label">Official Stamp</div>
        </div>
        <div class="sig-cell">
          <div class="line">${new Date().toLocaleDateString('en-GB')}</div>
          <div class="label">Date</div>
        </div>
      </div>
    </div>` : '';

  q('pReportBox').innerHTML = `
    <div class="report">
      ${watermark}
      <div class="report-head" style="border-color:${esc(primary)}">
        ${logo}
        <h2 style="color:${esc(primary)}">${esc(t.schoolName || 'Greater Tomorrow Model Schools')}</h2>
        <div class="motto">${esc(t.schoolMotto || 'Jesus, our Teacher')}</div>
      </div>
      <div class="report-meta">
        <div><label>Student</label><strong>${esc(r.student.name)}</strong></div>
        <div><label>ID</label><strong>${esc(r.student.studentId)}</strong></div>
        <div><label>Class</label><strong>${esc(r.student.className)}</strong></div>
        <div><label>Term</label><strong>${esc(r.term)}</strong></div>
        <div><label>Year</label><strong>${esc(r.academicYear)}</strong></div>
        ${t.showAnnualAverage !== false ? `<div><label>Overall</label><strong>${r.overallAverage == null ? '—' : r.overallAverage + '%'}</strong></div>` : ''}
      </div>
      <table><thead><tr>${cols.join('')}</tr></thead><tbody>${rows}</tbody></table>
      ${domainBlock}
      ${affectiveTable}
      ${psychomotorTable}
      ${principal}
    </div>`;
}

async function parentAsk() {
  const question = q('pQuestion').value.trim();
  if (!question) return toast('Type a question', 'err');
  const idx = q('pWard').value;
  if (idx === '') return toast('No ward', 'err');
  const ward = window.__WARDS[Number(idx)];
  const r = window.__CURRENT_RESULT;
  if (!r) return toast('Load a result first', 'err');
  const chat = q('pChat');
  chat.innerHTML = `<div class="chat-message user"><strong>You:</strong>\n${esc(question)}</div><div class="chat-message ai">Thinking…</div>`;
  try {
    const resp = await api('parentAskResultAI', {
      className: ward.className, studentId: ward.studentId,
      term: r.term, academicYear: r.academicYear, question
    });
    chat.innerHTML = `<div class="chat-message user"><strong>You:</strong>\n${esc(question)}</div>
      <div class="chat-message ai"><strong>Assistant:</strong>\n${esc(resp.answer)}</div>`;
    q('pQuestion').value = '';
  } catch (e) { chat.innerHTML = `<div class="chat-message ai">${esc(e.message)}</div>`; }
}

if (S.token && S.user) boot();
</script>
