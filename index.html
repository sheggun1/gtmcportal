<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Tomorrow Model College — Grade System</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --login-bg-image: url('school.jpg');
    --login-logo-image: url('school-crest.png');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f5f3ee; --surface:#fff; --surface-2:#faf9f6;
    --ink:#1a1410; --muted:#7a6a58; --line:#e8e1d4; --line-strong:#d8cdb9;
    --brown:#6b4423; --brown-dark:#4a2f18; --brown-light:#8b5e34;
    --gold:#e6b422; --gold-dark:#c9981a; --gold-light:#f5d76e;
    --blue:#1e3a8a; --blue-dark:#172d6b;
    --ok:#15803d; --warn:#b45309; --err:#b91c1c;
    --radius-sm:6px; --radius:10px; --radius-lg:14px;
    --shadow-sm:0 1px 2px rgba(26,20,16,.06);
    --shadow:0 2px 8px rgba(26,20,16,.06),0 1px 2px rgba(26,20,16,.04);
    --shadow-lg:0 12px 32px rgba(26,20,16,.12);
  }
  html,body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.5; color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; }
  button { font-family:inherit; font-size:13.5px; font-weight:600; padding:9px 16px;
    border:1px solid transparent; border-radius:var(--radius-sm);
    background:var(--brown); color:#fff; cursor:pointer;
    transition:background .15s,transform .05s; white-space:nowrap; }
  button:hover { background:var(--brown-dark); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  button.sec { background:#fff; color:var(--brown); border-color:var(--line-strong); }
  button.sec:hover { background:var(--surface-2); }
  button.ok { background:var(--ok); } button.ok:hover { background:#166534; }
  button.blue { background:var(--blue); } button.blue:hover { background:var(--blue-dark); }
  button.danger { background:var(--err); } button.danger:hover { background:#991b1b; }
  button.sm { padding:5px 10px; font-size:12.5px; }
  input,select,textarea { font-family:inherit; font-size:13.5px; padding:9px 12px;
    border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--ink); width:100%; }
  input:focus,select:focus,textarea:focus {
    outline:none; border-color:var(--brown); box-shadow:0 0 0 3px rgba(107,68,35,.12); }
  label { font-size:11.5px; color:var(--muted); font-weight:700;
    display:block; margin-bottom:5px; letter-spacing:.04em; text-transform:uppercase; }

  /* LOGIN */
  .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:20px;
    position:relative; overflow:hidden;
    background: var(--login-bg-image, none) center/cover no-repeat,
      linear-gradient(135deg,#2c1a0d 0%,#6b4423 45%,#3a2413 100%); }
  .login-wrap::before { content:''; position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(230,180,34,.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(30,58,138,.32) 0%, transparent 55%),
      rgba(20,12,5,.55); pointer-events:none; }
  .login-card { position:relative; z-index:1; width:100%; max-width:440px;
    background:#fff; border-radius:var(--radius-lg); padding:40px 36px 32px;
    box-shadow:var(--shadow-lg),0 30px 80px rgba(0,0,0,.35); border-top:5px solid var(--gold); }
  .login-logo { width:86px; height:86px; margin:0 auto 18px; border-radius:50%;
    background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-family:Georgia,serif; font-size:36px; font-weight:800;
    border:3px solid var(--gold); overflow:hidden;
    background-image:var(--login-logo-image, none);
    background-size:cover; background-position:center;
    box-shadow:0 10px 26px rgba(30,58,138,.35); }
  .login-logo span { display:block; }
  .login-logo.has-image span { display:none; }
  .login-card h1 { text-align:center; font-size:19px; color:var(--brown);
    letter-spacing:.02em; line-height:1.25; margin-bottom:8px; text-transform:uppercase; font-weight:800; }
  .login-card .motto { text-align:center; color:var(--blue); font-style:italic;
    font-size:12px; font-weight:700; letter-spacing:.04em; margin-bottom:4px; }
  .login-card .tag { text-align:center; font-size:10.5px; color:var(--muted);
    margin-bottom:24px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; }
  .login-divider { height:1px; background:var(--line); margin:0 0 20px; position:relative; }
  .login-divider::after { content:'Sign in to your account'; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); background:#fff; padding:0 12px;
    font-size:10px; color:var(--muted); font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
  .login-card input { margin-bottom:12px; }
  .login-card button.primary-btn { width:100%; margin-top:6px; padding:12px; font-size:15px; font-weight:700;
    background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%); letter-spacing:.03em; }
  .login-card button.primary-btn:hover { background:linear-gradient(135deg,var(--blue-dark) 0%,#0f1f4a 100%); }
  .login-err { color:var(--err); font-size:13px; margin-top:12px;
    min-height:18px; text-align:center; font-weight:600; }
  .login-footer { text-align:center; margin-top:22px; padding-top:16px;
    border-top:1px solid var(--line); font-size:10px; color:var(--muted);
    letter-spacing:.12em; text-transform:uppercase; font-weight:700; }
  .login-footer .credit { display:block; margin-top:6px; color:var(--brown-light);
    letter-spacing:.08em; font-size:10px; }

  .app-layout { flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .topbar { background:#fff; border-bottom:3px solid var(--gold);
    height:64px; padding:0 24px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:40; box-shadow:var(--shadow-sm); }
  .topbar .brand { display:flex; align-items:center; gap:14px; }
  .topbar .brand-logo { width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    color:var(--gold); font-family:Georgia,serif; font-weight:800; font-size:17px;
    display:flex; align-items:center; justify-content:center;
    border:2.5px solid var(--gold); overflow:hidden;
    background-image:var(--login-logo-image, none);
    background-size:cover; background-position:center; }
  .topbar .brand-logo span { display:block; }
  .topbar .brand-logo.has-image span { display:none; }
  .topbar .brand-text .name { font-size:13px; font-weight:800; color:var(--brown); letter-spacing:.02em; }
  .topbar .brand-text .tag { font-size:10px; color:var(--blue);
    letter-spacing:.12em; text-transform:uppercase; font-weight:700; margin-top:2px; }
  .topbar .user { display:flex; align-items:center; gap:14px; }
  .topbar .user .who { text-align:right; line-height:1.15; }
  .topbar .user .who .uname { font-size:13px; font-weight:700; color:var(--ink); }
  .topbar .user .who .urole { font-size:10.5px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-top:1px; }

  .body-layout { flex:1; display:grid; grid-template-columns:240px 1fr; min-height:0; }
  .sidebar { background:#fff; border-right:1px solid var(--line); padding:20px 12px; overflow-y:auto; }
  .sidebar .group { margin-bottom:22px; }
  .sidebar .group-title { font-size:10.5px; color:var(--muted); font-weight:800;
    text-transform:uppercase; letter-spacing:.1em; padding:0 12px 6px; }
  .nav-item { display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; color:var(--ink);
    cursor:pointer; user-select:none; border:1px solid transparent; margin-bottom:2px;
    transition:background .12s,color .12s; }
  .nav-item:hover { background:var(--surface-2); }
  .nav-item.active { background:#fff8e6; color:var(--brown); border-color:var(--gold-light);
    box-shadow:inset 3px 0 0 var(--gold); }
  .nav-item .dot { width:6px; height:6px; border-radius:50%;
    background:var(--line-strong); flex-shrink:0; }
  .nav-item.active .dot { background:var(--gold-dark); }
  .nav-item .count-badge { margin-left:auto; background:var(--err); color:#fff;
    font-size:10px; font-weight:800; padding:1px 7px; border-radius:20px; }

  main.content { padding:26px; overflow-y:auto; }
  .page-head { margin-bottom:22px; }
  .page-head h1 { font-size:22px; font-weight:800; color:var(--brown); letter-spacing:-.01em; margin-bottom:4px; }
  .page-head p { color:var(--muted); font-size:13px; }
  .panel { display:none; } .panel.active { display:block; }

  .card { background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-sm); margin-bottom:18px; }
  .card h2 { font-size:15px; font-weight:800; color:var(--brown); margin-bottom:6px; }
  .card .sub { color:var(--muted); font-size:12.5px; margin-bottom:14px; }

  .grid { display:grid; gap:12px; }
  .grid.cols-2 { grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .grid.cols-3 { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .grid.cols-4 { grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .check { display:flex; align-items:center; gap:8px;
    padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
    font-size:12.5px; background:var(--surface-2); cursor:pointer; }
  .check input { width:auto; }

  .table-wrap { border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; }
  th,td { padding:11px 12px; text-align:left; border-bottom:1px solid var(--line); }
  th { background:var(--surface-2); font-weight:700; color:var(--brown);
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#fbfaf7; }

  .badge { display:inline-block; padding:3px 10px; border-radius:20px;
    font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
  .badge.info { background:#e0e7ff; color:#1e3a8a; }
  .badge.ok   { background:#d1fae5; color:#065f46; }
  .badge.warn { background:#fef3c7; color:#92400e; }
  .badge.err  { background:#fee2e2; color:#991b1b; }

  .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; font-style:italic; }
  .portal-note { padding:12px 14px; border-radius:var(--radius-sm);
    background:#eff6ff; border:1px solid #bfdbfe; color:#1e3a8a; margin:10px 0; font-size:12.5px; }

  .score-input { width:64px; padding:5px 6px; text-align:center; font-size:13px; }
  .dmn-select { width:100%; min-width:110px; padding:5px 6px; font-size:12px; }

  .debt-banner { background:#fef2f2; border:1px solid #fecaca; color:#991b1b;
    padding:12px 14px; border-radius:var(--radius-sm); margin-bottom:14px;
    font-weight:600; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  .debt-banner strong { color:#7f1d1d; }

  .ann-card { background:#fffdf5; border:1px solid var(--gold-light); border-radius:var(--radius-sm);
    padding:12px 14px; margin-bottom:10px; }
  .ann-card .msg { font-size:13.5px; color:var(--ink); margin-bottom:6px; line-height:1.55; }
  .ann-card .meta { font-size:11px; color:var(--muted); }

  .chat-message { padding:10px 14px; border-radius:var(--radius-sm); margin:8px 0;
    font-size:13px; white-space:pre-wrap; line-height:1.55; }
  .chat-message.user { background:#eff6ff; margin-left:22px; }
  .chat-message.ai { background:#f0fdf4; margin-right:22px; }

  .toast { position:fixed; bottom:22px; right:22px; background:var(--brown-dark); color:#fff;
    padding:13px 20px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; max-width:340px;
    opacity:0; transform:translateY(12px); transition:opacity .2s,transform .2s;
    pointer-events:none; z-index:1000; box-shadow:var(--shadow-lg); border-left:4px solid var(--gold); }
  .toast.on { opacity:1; transform:translateY(0); }
  .toast.ok { background:var(--ok); border-left-color:var(--gold); }
  .toast.err { background:var(--err); border-left-color:#fca5a5; }

  @media (max-width:900px) {
    .body-layout { grid-template-columns:1fr; }
    .sidebar { display:flex; overflow-x:auto; padding:8px 12px;
      border-right:none; border-bottom:1px solid var(--line); gap:4px; }
    .sidebar .group { display:flex; gap:4px; margin:0; }
    .sidebar .group-title { display:none; }
    .nav-item { white-space:nowrap; padding:8px 12px; margin:0; }
    .nav-item.active { box-shadow:inset 0 -3px 0 var(--gold); }
  }
  @media (max-width:640px) {
    main.content { padding:16px; }
    .topbar { padding:0 14px; height:58px; }
    .topbar .brand-text .tag { display:none; }
    .topbar .user .who { display:none; }
    .card { padding:16px; }
  }
  @media print {
    body { background:#fff; }
    header, .sidebar, button, .card.toolbar, h1, .page-head { display:none !important; }
    main.content { padding:0; }
    #reportCard { border:none !important; padding:0 !important; max-width:100% !important;
      box-shadow:none !important; font-size:10px; }
    #reportCard tr { page-break-inside:avoid; }
  }
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-logo" id="loginLogo"><span>G</span></div>
    <h1>Greater Tomorrow<br>Model College</h1>
    <div class="motto">“Jesus, Our Teacher”</div>
    <div class="tag">Known for Moral and Academic Excellence</div>
    <div class="login-divider"></div>
    <label>Email or Student ID</label>
    <input id="loginEmail" autocomplete="username" placeholder="you@school.com">
    <label>Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password"
      placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="primary-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    <div id="loginErr" class="login-err"></div>
    <div class="login-footer">
      Greater Tomorrow Model College Ado
      <span class="credit">Created and designed by Veehicee</span>
    </div>
  </div>
</div>

<div id="appView" class="app-layout" style="display:none">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" id="topLogo"><span>G</span></div>
      <div class="brand-text">
        <div class="name">GREATER TOMORROW MODEL COLLEGE</div>
        <div class="tag" id="roleTag">Jesus, Our Teacher</div>
      </div>
    </div>
    <div class="user">
      <div class="who">
        <div class="uname" id="userLabel"></div>
        <div class="urole" id="userRole"></div>
      </div>
      <button class="sec sm" onclick="logout()">Logout</button>
    </div>
  </header>
  <div class="body-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="main"></main>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API = 'https://script.google.com/macros/s/AKfycbxOSpS1uDm5zgNi1LCGQvYtYH62OeCCgZGKw43otolFi8e1OvAv_hqJj9cDpM98g2B2/exec';

const S = {
  token: localStorage.getItem('gs_token') || '',
  user: JSON.parse(localStorage.getItem('gs_user') || 'null'),
  cache: { classes: null, subjectsByClass: {} }
};

async function api(action, payload = {}) {
  let res;
  try {
    res = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ action, token: S.token }, payload)),
      redirect:'follow'
    });
  } catch (e) { throw new Error('Network error — check internet or API URL'); }
  const raw = await res.text();
  let json;
  try { json = JSON.parse(raw); }
  catch (e) { throw new Error('Non-JSON (' + res.status + '): ' + raw.slice(0,180)); }
  if (!json || json.success !== true) {
    const msg = (json && json.error) || 'Request failed';
    if (/session/i.test(msg)) logout();
    if (/^unknown action/i.test(msg))
      throw new Error('Deployment is stale. Redeploy Apps Script and confirm API URL.');
    throw new Error(msg);
  }
  return json.data;
}
function saveSession(t,u){ S.token=t; S.user=u;
  localStorage.setItem('gs_token',t); localStorage.setItem('gs_user',JSON.stringify(u)); }
function logout(){
  localStorage.removeItem('gs_token'); localStorage.removeItem('gs_user');
  S.token=''; S.user=null;
  document.getElementById('loginView').style.display='flex';
  document.getElementById('appView').style.display='none';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function q(id){ return document.getElementById(id); }
function toast(msg,kind){
  const el = q('toast');
  el.textContent = msg;
  el.className = 'toast on' + (kind ? ' ' + kind : '');
  setTimeout(() => el.className = 'toast', 2600);
}
function roleList(){ return S.user ? String(S.user.role || '').split(',').map(s=>s.trim()).filter(Boolean) : []; }
function hasRole(r){ return roleList().indexOf(r) !== -1; }

async function loadClasses() {
  if (S.cache.classes) return S.cache.classes;
  const list = await api('getClasses');
  S.cache.classes = list.map(c => c.class);
  return S.cache.classes;
}
async function loadSubjects(className) {
  if (S.cache.subjectsByClass[className]) return S.cache.subjectsByClass[className];
  const subs = await api('getSubjectsForClass', { className });
  S.cache.subjectsByClass[className] = subs;
  return subs;
}

function applyLogoFallback() {
  const cssBg = getComputedStyle(document.documentElement).getPropertyValue('--login-logo-image').trim();
  if (!cssBg || cssBg === 'none') return;
  ['loginLogo','topLogo'].forEach(id => {
    const el = q(id); if (!el) return;
    const probe = new Image();
    const url = cssBg.replace(/^url\(['"]?/,'').replace(/['"]?\)$/,'');
    probe.onload = () => el.classList.add('has-image');
    probe.onerror = () => el.classList.remove('has-image');
    probe.src = url;
  });
}

async function doLogin() {
  const email = q('loginEmail').value.trim();
  const password = q('loginPassword').value;
  const btn = q('loginBtn'), err = q('loginErr');
  err.textContent = '';
  if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  let staffErr = null;
  try {
    try {
      const r = await api('login', { email, password });
      saveSession(r.token, r.user); boot(); return;
    } catch (e) { staffErr = e; }
    try {
      const r = await api('parentLogin', { email, password });
      saveSession(r.token, r.user); boot(); return;
    } catch (e2) { err.textContent = (staffErr && staffErr.message) || e2.message; }
  } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

function boot() {
  if (!S.token || !S.user) { logout(); return; }
  q('loginView').style.display = 'none';
  q('appView').style.display = 'flex';
  q('userLabel').textContent = S.user.name || S.user.email;
  q('userRole').textContent = roleList().map(r => ({
    admin:'Administrator', class_teacher:'Class Teacher', subject_teacher:'Subject Teacher',
    student:'Student', parent:'Parent'
  })[r] || r).join(' · ');
  applyLogoFallback();

  if (hasRole('admin')) renderAdmin();
  else if (hasRole('class_teacher')) renderClassTeacher();
  else if (hasRole('subject_teacher')) renderSubjectTeacher();
  else if (hasRole('student')) renderStudent();
  else if (hasRole('parent')) renderParent();
  else toast('Unknown role: ' + S.user.role, 'err');
}

function buildNav(items, defaultTab) {
  const sidebar = q('sidebar');
  sidebar.innerHTML = items.map(g => `
    <div class="group">
      ${g.title ? `<div class="group-title">${esc(g.title)}</div>` : ''}
      ${g.tabs.map(t => `<div class="nav-item" data-tab="${t.id}" onclick="setNav('${t.id}')">
        <span class="dot"></span><span>${esc(t.label)}</span>
        ${t.badge ? `<span class="count-badge">${t.badge}</span>` : ''}
      </div>`).join('')}
    </div>`).join('');
  setNav(defaultTab);
}
function setNav(tabId) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tabId));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tabId));
  const nav = document.querySelector('.nav-item[data-tab="' + tabId + '"]');
  if (nav && nav.dataset.onload) try { window[nav.dataset.onload](); } catch (e) {}
}

/* ===================== ADMIN ===================== */
async function renderAdmin() {
  q('roleTag').textContent = 'Administrator · Jesus, Our Teacher';

  q('main').innerHTML = `
    <div class="page-head"><h1>Admin Dashboard</h1><p>Manage teachers, results, debtors, announcements, and report cards.</p></div>

    <div class="panel active" data-panel="teachers">
      <div class="card">
        <h2>Create Teacher</h2>
        <div class="sub">A teacher may hold multiple roles (e.g. Class Teacher + Subject Teacher).</div>

async function createTeacher() {
  const name = q('tName').value.trim();
  const email = q('tEmail').value.trim();
  const password = q('tPass').value;
  const cls = q('tClass').value;
  const roles = [];
  if (q('roleCT').checked) roles.push('class_teacher');
  if (q('roleST').checked) roles.push('subject_teacher');
  if (q('roleAD').checked) roles.push('admin');
  if (!name || !email || !password) return toast('Name, email, password required', 'err');
  if (!roles.length) return toast('Pick at least one role', 'err');
  const subjects = roles.indexOf('subject_teacher') !== -1
    ? Array.from(q('tSubjects').selectedOptions).map(o => o.value).join(',') : '';
  try {
    await api('createTeacher', { name, email, password, role: roles.join(','), class: cls, subjects });
    toast('Teacher created', 'ok');
    q('tName').value = ''; q('tEmail').value = ''; q('tPass').value = '';
    loadTeachers();
  } catch (e) { toast(e.message, 'err'); }
}
async function loadTeachers() {
  const box = q('teachersBox'); if (!box) return;
  try {
    const rows = await api('getTeachers');
    if (!rows.length) { box.innerHTML = '<div class="empty">No teachers yet.</div>'; return; }
    box.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Name</th><th>Email</th><th>Roles</th><th>Class</th><th></th></tr></thead>
      <tbody>${rows.map(t => `
        <tr><td><strong>${esc(t.name)}</strong></td><td>${esc(t.email)}</td>
        <td>${(t.roles||String(t.role).split(',')).map(r=>`<span class="badge info">${esc(r)}</span>`).join(' ')}</td>
        <td>${esc(t.class||'—')}</td>
        <td>${t.active===false?'':`<button class="danger sm" onclick="deleteTeacher('${esc(t.email)}')">Disable</button>`}</td></tr>`).join('')}
      </tbody></table></div>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function deleteTeacher(email) {
  if (!confirm('Disable this teacher?')) return;
  try { await api('deleteTeacher', { email }); toast('Disabled', 'ok'); loadTeachers(); }
  catch (e) { toast(e.message, 'err'); }
}

async function loadSubmissions() {
  const box = q('submissionsBox'); if (!box) return;
  const status = q('subFilter').value;
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const rows = await api('getSubmissions', status ? { status } : {});
    if (!rows.length) { box.innerHTML = '<div class="empty">No submissions.</div>'; return; }
    box.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Teacher</th><th>Class</th><th>Subject</th><th>Term</th><th>Status</th><th>When</th><th></th></tr></thead>
      <tbody>${rows.map(r => {
        const when = r.timestamp ? new Date(r.timestamp).toLocaleString() : '—';
        const locked = r.status === 'locked';
        const isDomains = r.subject === '__DOMAINS__';
        return `<tr>
          <td>${esc(r.teacher_email)}</td><td>${esc(r.class)}</td>
          <td><strong>${esc(isDomains ? 'Domains' : r.subject)}</strong></td>
          <td>${esc(r.term)}</td>
          <td><span class="badge ${locked?'warn':'ok'}">${esc(r.status)}</span></td>
          <td style="font-size:12px;color:var(--muted)">${esc(when)}</td>
          <td>${locked ? `<button class="blue sm" onclick="unlockSubmission('${esc(r.teacher_email)}','${esc(r.class)}','${esc(r.subject)}','${esc(r.term)}',${isDomains})">Unlock</button>` : ''}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function unlockSubmission(teacherEmail, className, subject, term, isDomains) {
  if (!confirm('Unlock this submission?')) return;
  try {
    if (isDomains) await api('unlockDomains', { teacherEmail, className, term });
    else await api('unlockScores', { teacherEmail, className, subject, term });
    toast('Unlocked', 'ok'); loadSubmissions();
  } catch (e) { toast(e.message, 'err'); }
}

let DMN_KIND = 'affective';
const AFFECTIVE_ITEMS = [
  ['punctuality','Punctuality'],['attendance','Attendance'],['honesty','Honesty'],
  ['cooperation','Cooperation'],['leadership','Leadership'],['club_participation','Club participation'],
  ['obedience','Obedience'],['neatness','Neatness'],['responsibility','Responsibility'],['self_control','Self-control']
];
const PSYCHOMOTOR_ITEMS = [
  ['handwriting','Handwriting'],['drawing','Drawing and painting'],
  ['handwork','Handwork / practical'],['sports','Sports & physical'],
  ['coordination','Coordination & dexterity'],['tools','Use of tools & equipment']
];
const DMN_RATINGS = { 5:'Excellent',4:'Very Good',3:'Good',2:'Fair',1:'Needs Improvement' };

function switchDomainKind(kind) {
  DMN_KIND = kind;
  q('tabAffBtn').className = 'sm ' + (kind === 'affective' ? 'blue' : 'sec');
  q('tabPsyBtn').className = 'sm ' + (kind === 'psychomotor' ? 'blue' : 'sec');
  reloadDomainEditor();
}
async function reloadDomainEditor() {
  const className = hasRole('admin') ? q('dmnClass').value : S.user.class;
  const term = q('dmnTerm').value;
  const year = q('dmnYear').value.trim();
  const box = q('domainEditorBox');
  if (!className || !term || !year) { box.innerHTML = '<div class="empty">Fill class, term and year.</div>'; return; }
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const [students, existing] = await Promise.all([
      api('getStudents', { className }),
      api('getDomainAssessments', { kind: DMN_KIND, className, term, academicYear: year })
    ]);
    if (!students.length) { box.innerHTML = '<div class="empty">No students.</div>'; return; }
    const byStudent = {}; (existing || []).forEach(r => { byStudent[r.student_id] = r; });
    const items = DMN_KIND === 'affective' ? AFFECTIVE_ITEMS : PSYCHOMOTOR_ITEMS;
    const head = `<th style="min-width:170px">Student</th>` +
      items.map(([k, l]) => `<th style="text-align:center;min-width:110px">${esc(l)}</th>`).join('');
    const rows = students.map(st => {
      const row = byStudent[st.student_id] || {};
      const cells = items.map(([k]) => {
        const v = row[k];
        const opts = ['',1,2,3,4,5].map(n =>
          `<option value="${n}" ${String(v || '') === String(n) ? 'selected' : ''}>${n === '' ? '—' : n + ' · ' + DMN_RATINGS[n]}</option>`
        ).join('');
        return `<td style="text-align:center"><select class="dmn-select" data-student="${esc(st.student_id)}" data-item="${k}">${opts}</select></td>`;
      }).join('');
      return `<tr><td><strong>${esc(st.name)}</strong><br><small style="color:var(--muted);font-size:11px">${esc(st.student_id)}</small></td>${cells}</tr>`;
    }).join('');
    box.innerHTML = `<div style="overflow-x:auto"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="portal-note" style="margin-top:14px">Each change saves immediately.</p>`;
    box.querySelectorAll('select.dmn-select').forEach(sel => {
      sel.addEventListener('change', () => saveDomainRating(sel, className, term, year));
    });
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function saveDomainRating(sel, className, term, year) {
  const studentId = sel.dataset.student, item = sel.dataset.item, value = sel.value;
  sel.style.background = '#fffbea';
  try {
    await api('saveDomainAssessment', { kind: DMN_KIND, className, term, academicYear: year, studentId, item, value });
    sel.style.background = '#f0fdf4';
    setTimeout(() => { sel.style.background = ''; }, 800);
  } catch (e) { sel.style.background = '#fef2f2'; toast(e.message, 'err'); }
}

async function publishClass(publish) {
  const className = q('pubClass').value, term = q('pubTerm').value, year = q('pubYear').value.trim();
  if (!confirm(`${publish ? 'Publish' : 'Unpublish'} ${className} / ${term} / ${year}?`)) return;
  try {
    const r = publish
      ? await api('adminPublishClass', { className, term, academicYear: year })
      : await api('adminUnpublishClass', { className, term, academicYear: year });
    q('pubStatus').textContent = publish
      ? `Published: ${r.created} new, ${r.updated} updated, ${r.already} already (of ${r.total}).`
      : `Unpublished: ${r.changed}.`;
    toast(publish ? 'Published' : 'Unpublished', 'ok');
  } catch (e) { q('pubStatus').textContent = 'Error: ' + e.message; toast(e.message, 'err'); }
}

function initReportCards() {}

const _bulkCache = {};

async function loadBulkForClass(className, term, academicYear) {
  const cacheKey = className + '|' + term + '|' + academicYear;
  if (_bulkCache[cacheKey]) return _bulkCache[cacheKey];
  const [scores, domains, remarks, template] = await Promise.all([
    api('getClassScores', { className, term }),
    api('getClassDomains', { className, term, academicYear }),
    api('getClassTeacherRemarks', { className, term, academicYear }),
    api('adminGetReportTemplate')
  ]);
  const bundle = { scores, domains, remarks, template };
  _bulkCache[cacheKey] = bundle;
  return bundle;
}

async function buildReportPayload(className, studentId, studentName, term, academicYear) {
  const [bundle, pr] = await Promise.all([
    loadBulkForClass(className, term, academicYear),
    api('adminPreviewPrincipalRemark', { className, studentId, term, academicYear }).catch(() => null)
  ]);
  const declaredSubjects = await loadSubjects(className);
  const template = bundle.template;

  const subjectResults = declaredSubjects.map(function (subj) {
    const row = (bundle.scores[studentId] || {})[subj] || {};
    const t1 = Number(row.T1) || 0, t2 = Number(row.T2) || 0, t3 = Number(row.T3) || 0, ex = Number(row.Exam) || 0;
    const complete = [row.T1, row.T2, row.T3, row.Exam].every(v => v !== '' && v !== null && v !== undefined);
    const total = complete ? (t1 + t2 + t3 + ex) : null;
    return {
      subject: subj,
      T1: row.T1, T2: row.T2, T3: row.T3, Exam: row.Exam,
      total, complete,
      grade: total === null ? '' : gradeFor(total, template.gradeScale),
      term1Total: null, term2Total: null, term3Total: null, cumulative: null
    };
  });
  const completeTotals = subjectResults.filter(r => r.total !== null);
  const overallAverage = (completeTotals.length === subjectResults.length && subjectResults.length)
    ? Math.round(completeTotals.reduce((a, r) => a + r.total, 0) / subjectResults.length * 100) / 100
    : null;

  const dom = (bundle.domains[studentId] || { affective: {}, psychomotor: {}, days: {} });

  const termAverages = { Term1: null, Term2: null, Term3: null };
  let enrolledFrom = null;
  for (const t of ['Term1','Term2','Term3']) {
    try {
      const tb = await loadBulkForClass(className, t, academicYear);
      const rowFor = tb.scores[studentId] || {};
      const totalsT = [];
      declaredSubjects.forEach(function (subj) {
        const row = rowFor[subj];
        if (!row) return;
        const nums = [row.T1, row.T2, row.T3, row.Exam].map(v => v === '' || v === null ? null : Number(v));
        if (nums.every(n => n !== null && isFinite(n))) totalsT.push(nums.reduce((a,b)=>a+b,0));
      });
      if (totalsT.length) {
        termAverages[t] = Math.round(totalsT.reduce((a,b)=>a+b,0) / totalsT.length * 100) / 100;
        if (enrolledFrom === null) enrolledFrom = t;
      }
    } catch (e) {}
  }
  const presentTerms = ['Term1','Term2','Term3'].filter(t => termAverages[t] !== null);
  const cumulativeAverage = presentTerms.length
    ? Math.round(presentTerms.reduce((a,t)=>a+termAverages[t],0) / presentTerms.length * 100) / 100
    : null;

  return {
    student: { studentId, name: studentName, className },
    term, academicYear,
    subjects: subjectResults,
    overallAverage,
    complete: completeTotals.length === subjectResults.length,
    domains: {
      days_opened: dom.days ? dom.days.days_opened : null,
      days_present: dom.days ? dom.days.days_present : null,
      affective: dom.days ? dom.days.affective_letter : '',
      psychomotor: dom.days ? dom.days.psychomotor_letter : ''
    },
    principalRemark: pr ? pr.remark : '',
    affective: dom.affective || {},
    psychomotor: dom.psychomotor || {},
    teacherRemark: (bundle.remarks || {})[studentId] || '',
    daysPresent: dom.days ? dom.days.days_present : null,
    calendar: null,
    debtTotal: 0,
    announcements: [],
    term1Average: termAverages.Term1,
    term2Average: termAverages.Term2,
    term3Average: termAverages.Term3,
    cumulativeAverage: cumulativeAverage,
    enrolledFrom: enrolledFrom,
    template
  };
}

function gradeFor(score, scale) {
  if (!Array.isArray(scale)) return '';
  const item = scale.find(g => Number(score) >= Number(g.min) && Number(score) <= Number(g.max));
  return item ? String(item.grade || '') : '';
}

function ratingLabel(data, key) {
  const v = Number(data && data[key]);
  if (!(v >= 1 && v <= 5)) return '—';
  return v + ' (' + DMN_RATINGS[v] + ')';
}
function remarkForGrade(g) {
  return ({ A:'Excellent', B:'Very Good', C:'Good', D:'Fair', E:'Pass', F:'Needs Improvement' })[g] || '';
}

function pdfRenderPage(doc, r) {
  const t = r.template || {};
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 20;
  let y = margin;

  function hasAnyScore(s) {
    return ['T1','T2','T3','Exam'].some(function (f) {
      const v = s[f];
      return v !== '' && v !== null && v !== undefined && isFinite(Number(v));
    });
  }
  const visibleSubjects = (r.subjects || []).filter(hasAnyScore);

  const completeVisible = visibleSubjects.filter(s => s.total !== null);
  const totalObtainedVisible = completeVisible.reduce((a, s) => a + (Number(s.total) || 0), 0);
  const totalObtainableVisible = visibleSubjects.length * 100;
  const overallPctVisible = (completeVisible.length === visibleSubjects.length && visibleSubjects.length)
    ? Math.round(totalObtainedVisible / totalObtainableVisible * 100 * 100) / 100
    : null;

  const showCumulativeColsPdf = (r.term === 'Term2' || r.term === 'Term3');
  const showTerm3ColPdf       = (r.term === 'Term3');

  const primary = t.primaryColor || '#1e3a8a';
  doc.setFontSize(16); doc.setTextColor(primary);
  doc.text(t.schoolName || 'GREATER TOMORROW MODEL SCHOOLS', pageW/2, y, { align: 'center' });
  y += 16;
  doc.setFontSize(9); doc.setTextColor(60, 60, 60);
  doc.text(t.schoolAddress || 'Embassy Island, Moferere Area, Ado-Ekiti', pageW/2, y, { align: 'center' });
  y += 12;
  doc.setFontSize(11); doc.setTextColor(0,0,0);
  doc.setFont(undefined, 'bold');
  doc.text('TERMINAL REPORT SHEET', pageW/2, y, { align: 'center' });
  y += 12;
  doc.setFontSize(10); doc.setFont(undefined, 'normal');
  doc.text(`${r.term} — ${r.academicYear} SESSION`, pageW/2, y, { align: 'center' });
  y += 8;
  if (t.schoolMotto) {
    doc.setFontSize(9); doc.setTextColor(107,68,35);
    doc.text('Motto: ' + t.schoolMotto, pageW/2, y, { align: 'center' });
    y += 6;
  }

  const bio = [
    ['NAME', r.student.name, 'CLASS', r.student.className],
    ['ADM. NO', r.student.studentId, 'TERM', r.term],
    ['SESSION', r.academicYear, 'OVERALL', overallPctVisible != null ? overallPctVisible + '%' : '—']
  ];
  doc.setFontSize(8.5);
  bio.forEach(row => {
    doc.setTextColor(0,0,0); doc.setFont(undefined, 'bold');
    doc.text(row[0], margin, y); doc.text(row[2], pageW/2 + 10, y);
    doc.setFont(undefined, 'normal');
    doc.text(String(row[1] || ''), margin + 40, y);
    doc.text(String(row[3] || ''), pageW/2 + 50, y);
    y += 12;
  });

  const baseHead = ['SN','Subject','1st','2nd','3rd','Exam','Total','Grade','Remark'];
  const cumHead = [];
  if (showCumulativeColsPdf) {
    cumHead.push('Term1');
    cumHead.push('Term2');
    if (showTerm3ColPdf) cumHead.push('Term3');
    cumHead.push('Cumul.');
  }

  const subjectRows = visibleSubjects.map((s, i) => {
    const row = [
      i + 1, s.subject, s.T1 ?? '—', s.T2 ?? '—', s.T3 ?? '—', s.Exam ?? '—',
      s.total != null ? s.total : '—', s.grade || '—', remarkForGrade(s.grade)
    ];
    if (showCumulativeColsPdf) {
      row.push(s.term1Total != null ? s.term1Total : '—');
      row.push(s.term2Total != null ? s.term2Total : '—');
      if (showTerm3ColPdf) row.push(s.term3Total != null ? s.term3Total : '—');
      row.push(s.cumulative != null ? s.cumulative : '—');
    }
    return row;
  });
  if (subjectRows.length && doc.autoTable) {
    doc.autoTable({
      startY: y,
      head: [baseHead.concat(cumHead)],
      body: subjectRows,
      styles: { fontSize: 7.5, cellPadding: 1.5 },
      headStyles: { fillColor: [45,55,72], textColor: 255, fontSize: 7.5 },
      columnStyles: { 0:{cellWidth:14}, 1:{cellWidth:100}, 7:{cellWidth:20} }
    });
    y = doc.lastAutoTable.finalY + 10;
  } else if (!subjectRows.length) {
    doc.setFontSize(10); doc.setTextColor(150,150,150);
    doc.text('No scores have been entered for any subject this term.', pageW/2, y, { align: 'center' });
    y += 14;
  }

  const affItems = AFFECTIVE_ITEMS.map(([k,l]) => [l, ratingLabel(r.affective, k)]);
  const psyItems = PSYCHOMOTOR_ITEMS.map(([k,l]) => [l, ratingLabel(r.psychomotor, k)]);

  if (doc.autoTable) {
    doc.autoTable({
      startY: y,
      head: [['Affective Domain','Rating','Psychomotor Domain','Rating']],
      body: affItems.map((a, i) => [a[0], a[1], psyItems[i] ? psyItems[i][0] : '', psyItems[i] ? psyItems[i][1] : '']),
      styles: { fontSize: 8, cellPadding: 1.5 },
      headStyles: { fillColor: [45,55,72], textColor: 255, fontSize: 8 },
      columnStyles: { 0:{cellWidth:110}, 1:{cellWidth:40}, 2:{cellWidth:110}, 3:{cellWidth:40} }
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  const cLine = [];
  if (r.term1Average != null) cLine.push('Term 1: ' + r.term1Average + '%');
  if (r.term2Average != null) cLine.push('Term 2: ' + r.term2Average + '%');
  if (r.term3Average != null) cLine.push('Term 3: ' + r.term3Average + '%');
  if (r.cumulativeAverage != null) cLine.push('Cumulative: ' + r.cumulativeAverage + '%');
  if (r.term !== 'Term1' && cLine.length) {
    doc.setFontSize(9); doc.setTextColor(60,60,60);
    doc.text(cLine.join('   ·   '), pageW/2, y, { align: 'center' });
    y += 14;
  }

  doc.setFontSize(9); doc.setTextColor(0,0,0); doc.setFont(undefined, 'bold');
  doc.text("CLASS TEACHER'S REMARK:", margin, y);
  doc.setFont(undefined, 'normal');
  const trLines = doc.splitTextToSize(r.teacherRemark || '—', pageW - margin*2 - 110);
  doc.text(trLines, margin + 105, y);
  y += Math.max(14, trLines.length * 10 + 4);

  doc.setFont(undefined, 'bold');
  doc.text("PRINCIPAL'S REMARK:", margin, y);
  doc.setFont(undefined, 'normal');
  const prLines = doc.splitTextToSize(r.principalRemark || '—', pageW - margin*2 - 110);
  doc.text(prLines, margin + 105, y);
  y += Math.max(14, prLines.length * 10 + 4);

  const baseY = Math.min(y + 20, doc.internal.pageSize.getHeight() - 60);
  const half = pageW / 2;
  doc.setDrawColor(80,80,80); doc.setLineWidth(0.3);
  doc.line(margin, baseY + 30, half - 20, baseY + 30);
  doc.line(half + 20, baseY + 30, pageW - margin, baseY + 30);
  doc.setFontSize(8);
  doc.text('CLASS TEACHER SIGNATURE', (margin + half - 20)/2, baseY + 40, { align:'center' });
  doc.text((t.principalName || 'PRINCIPAL') + ' (SIGNATURE)', (half + 20 + pageW - margin)/2, baseY + 40, { align:'center' });
}

async function addStudentsWithDetection(className, lines) {
  const preChecks = [];
  for (const line of lines) {
    const parts = line.split(',');
    const typedId = parts.length > 1 ? parts[0].trim() : '';
    const typedName = parts.length > 1 ? parts.slice(1).join(',').trim() : line.trim();
    if (!typedName) continue;
    try {
      const check = await api('checkNewStudent', { className, studentId: typedId, name: typedName });
      preChecks.push({ line, typedId, typedName, check });
    } catch (e) {
      toast('Pre-check failed: ' + e.message, 'err');
      return;
    }
  }

  const warnings = [];
  for (const p of preChecks) {
    if (p.check.idInThisClass) {
      warnings.push(`ID "${p.typedId}" already exists in ${className}. Skipped.`);
    }
    if (p.check.sameNameInOtherClasses && p.check.sameNameInOtherClasses.length) {
      const m = p.check.sameNameInOtherClasses[0];
      const ok = confirm(
        `"${p.typedName}" matches "${m.name}" (${m.studentId}) in ${m.className}.\n\n` +
        `Same student? Click OK to copy their previous scores into ${className}. ` +
        `Click Cancel to add as a NEW student with no previous scores.`
      );
      p.willCopyFrom = ok ? m : null;
    }
  }

  if (warnings.length) {
    const proceed = confirm(warnings.join('\n\n') + '\n\nContinue adding the rest?');
    if (!proceed) return;
  }

  const filtered = preChecks.filter(p => !p.check.idInThisClass).map(p => p.line);
  if (!filtered.length) {
    toast('Nothing to add — all had duplicate IDs', 'err');
    return;
  }

  const r = await api('addStudentsBulk', { className, lines: filtered });
  toast(`Added ${r.count}${r.skipped && r.skipped.length ? ' · skipped ' + r.skipped.length : ''}`, 'ok');

  const toCopy = preChecks.filter(p => p.willCopyFrom && !p.check.idInThisClass);
  if (toCopy.length) {
    const students = await api('getStudents', { className });
    for (const c of toCopy) {
      const row = students.find(s => s.name.trim().toLowerCase() === c.typedName.toLowerCase());
      if (!row) continue;
      try {
        await api('copyStudentFromClass', {
          fromClass: c.willCopyFrom.className,
          fromId: c.willCopyFrom.studentId,
          toClass: className,
          toId: row.student_id
        });
      } catch (e) { toast('Copy failed for ' + c.typedName + ': ' + e.message, 'err'); }
    }
    toast(`Copied previous scores for ${toCopy.length} student(s)`, 'ok');
  }

  if (hasRole('admin')) loadTeachers();
  else if (typeof ctLoadStudents === 'function') ctLoadStudents();
}

          <div><label>Term</label><select id="pTerm"><option>Term1</option><option>Term2</option><option>Term3</option></select></div>
          <div><label>Academic Year</label><input id="pYear" value="2026/2027"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="blue" onclick="parentLoad()">Load Result</button>
          <button class="sec" onclick="window.print()">Print</button>
        </div>
        <div id="pStatus" class="portal-note">Choose ward, term and year.</div>
      </div>
      <div id="pReportBox"></div>
    </div>

    <div class="panel" data-panel="announcements">
      <div class="card">
        <h2>Announcements</h2>
        <div id="pAnnBox"><div class="empty">Loading…</div></div>
      </div>
    </div>

    <div class="panel" data-panel="chat">
      <div class="card">
        <h2>Ask Academic Assistant</h2>
        <div id="pChat"><div class="empty">Load a result first.</div></div>
        <textarea id="pQuestion" style="margin-top:10px;min-height:70px" placeholder="Which subjects should my child focus on?"></textarea>
        <div class="row" style="margin-top:8px"><button onclick="parentAsk()">Ask</button></div>
      </div>
    </div>
  `;

  buildNav([
    { title: 'Results', tabs: [
      { id: 'report', label: 'Report Card' },
      { id: 'announcements', label: 'Announcements' },
      { id: 'chat', label: 'Ask Assistant' },
    ]},
  ], 'report');

  document.querySelector('.nav-item[data-tab="announcements"]').dataset.onload = 'parentLoadAnnouncements';

  try {
    const wards = await api('parentGetWards');
    window.__WARDS = wards;
    const sel = q('pWard');
    if (!wards.length) {
      sel.innerHTML = '<option value="">No wards linked</option>';
      q('pStatus').textContent = 'No student is linked to this account. Contact the school.';
      return;
    }
    sel.innerHTML = wards.map((w, i) => `<option value="${i}">${esc(w.studentName)} · ${esc(w.className)}</option>`).join('');
  } catch (e) { q('pStatus').textContent = e.message; }
}

async function parentLoad() {
  const idx = q('pWard').value;
  if (idx === '') return;
  const ward = window.__WARDS[Number(idx)];
  const term = q('pTerm').value, year = q('pYear').value.trim();
  q('pStatus').textContent = 'Loading…';
  try {
    const r = await api('parentGetResult', { className: ward.className, studentId: ward.studentId, term, academicYear: year });
    window.__CURRENT_RESULT = r;
    window.__CURRENT_WARD = ward;
    q('pStatus').textContent = 'Loaded.';
    renderParentReport(r);
  } catch (e) {
    q('pStatus').textContent = e.message;
    q('pReportBox').innerHTML = '';
    toast(e.message, 'err');
  }
}

async function parentLoadAnnouncements() {
  const box = q('pAnnBox'); if (!box) return;
  const idx = q('pWard').value;
  if (idx === '') { box.innerHTML = '<div class="empty">No ward linked.</div>'; return; }
  const ward = window.__WARDS[Number(idx)];
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const list = await api('parentGetAnnouncements', { className: ward.className, studentId: ward.studentId });
    if (!list.length) { box.innerHTML = '<div class="empty">No announcements.</div>'; return; }
    box.innerHTML = list.map(a => `<div class="ann-card">
      <div class="msg">${esc(a.message)}</div>
      <div class="meta">${a.createdAt ? new Date(a.createdAt).toLocaleString() : ''}</div>
    </div>`).join('');
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function renderParentReport(r) {
  const t = r.template || {};
  const d = r.domains || {};
  const cal = r.calendar || {};

  const schoolName = esc(t.schoolName || 'GREATER TOMORROW MODEL COLLEGE');
  const schoolAddr = esc(t.schoolAddress || 'Embassy Island, Moferere Area, Ado-Ekiti');
  const motto      = esc(t.schoolMotto || 'Jesus, Our Teacher');
  const logo = t.logoUrl
    ? `<img src="${esc(t.logoUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:6px" alt="">`
    : `<div style="font-family:Georgia,serif;font-size:30px;color:#1e3a8a;font-weight:900">G</div>`;

  function hasAnyScoreInCurrentTerm(s) {
    return ['T1','T2','T3','Exam'].some(function (f) {
      const v = s[f];
      return v !== '' && v !== null && v !== undefined && isFinite(Number(v));
    });
  }
  const visibleSubjects = (r.subjects || []).filter(hasAnyScoreInCurrentTerm);

  const completeVisible = visibleSubjects.filter(s => s.total !== null);
  const totalObtainedVisible = completeVisible.reduce((a, s) => a + (Number(s.total) || 0), 0);
  const totalObtainableVisible = visibleSubjects.length * 100;
  const overallPctVisible = (completeVisible.length === visibleSubjects.length && visibleSubjects.length)
    ? Math.round(totalObtainedVisible / totalObtainableVisible * 100 * 100) / 100
    : null;

  const showTests = t.showTests !== false;
  const showExam  = t.showExam !== false;
  const showTotals = t.showSubjectTotals !== false;
  const showGrade  = t.showGrade !== false;
  const showCumulativeCols = (r.term === 'Term2' || r.term === 'Term3');
  const showTerm3Col       = (r.term === 'Term3');

  const cols = ['<th>Subject</th>'];
  if (showTests) cols.push('<th style="text-align:center">T1</th><th style="text-align:center">T2</th><th style="text-align:center">T3</th>');
  if (showExam) cols.push('<th style="text-align:center">Exam</th>');
  if (showTotals) cols.push('<th style="text-align:center">Total</th>');
  if (showGrade) cols.push('<th style="text-align:center">Grade</th>');
  if (showCumulativeCols) {
    cols.push('<th style="text-align:center">Term 1 Total</th>');
    cols.push('<th style="text-align:center">Term 2 Total</th>');
    if (showTerm3Col) cols.push('<th style="text-align:center">Term 3 Total</th>');
    cols.push('<th style="text-align:center">Cumulative</th>');
  }

  const rows = visibleSubjects.map(s => {
    let h = `<td><strong>${esc(s.subject)}</strong></td>`;
    if (showTests) h += `<td style="text-align:center">${s.T1 ?? '—'}</td><td style="text-align:center">${s.T2 ?? '—'}</td><td style="text-align:center">${s.T3 ?? '—'}</td>`;
    if (showExam) h += `<td style="text-align:center">${s.Exam ?? '—'}</td>`;
    if (showTotals) h += `<td style="text-align:center;font-weight:700;color:#1e3a8a">${s.total != null ? s.total : '—'}</td>`;
    if (showGrade) h += `<td style="text-align:center">${esc(s.grade || '—')}</td>`;
    if (showCumulativeCols) {
      h += `<td style="text-align:center">${s.term1Total != null ? s.term1Total : '—'}</td>`;
      h += `<td style="text-align:center">${s.term2Total != null ? s.term2Total : '—'}</td>`;
      if (showTerm3Col) h += `<td style="text-align:center">${s.term3Total != null ? s.term3Total : '—'}</td>`;
      h += `<td style="text-align:center;font-weight:700;color:#1e3a8a">${s.cumulative != null ? s.cumulative : '—'}</td>`;
    }
    return `<tr>${h}</tr>`;
  }).join('');

  const domainCol = (data, key) => {
    const v = Number(data && data[key]);
    if (!(v >= 1 && v <= 5)) return '<span style="color:#999">—</span>';
    return `<strong>${({5:'A',4:'B',3:'C',2:'D',1:'E'})[v]}</strong> <span style="font-size:8.5px;color:#555">${DMN_RATINGS[v]}</span>`;
  };
  const affRows = AFFECTIVE_ITEMS.map(([k, l]) =>
    `<tr><td style="border:1px solid #999;padding:2px 4px;text-align:left;font-size:9.5px">${esc(l)}</td>
     <td style="border:1px solid #999;padding:2px 4px;text-align:center">${domainCol(r.affective, k)}</td></tr>`).join('');
  const psyRows = PSYCHOMOTOR_ITEMS.map(([k, l]) =>
    `<tr><td style="border:1px solid #999;padding:2px 4px;text-align:left;font-size:9.5px">${esc(l)}</td>
     <td style="border:1px solid #999;padding:2px 4px;text-align:center">${domainCol(r.psychomotor, k)}</td></tr>`).join('');

  const scale = (t.gradeScale || []).slice().sort((a, b) => Number(b.min) - Number(a.min));
  const gradeRows = scale.map(g =>
    `<tr><td style="border:1px solid #999;padding:2px 4px;text-align:center">${Number(g.min)}–${Number(g.max) === 100 ? 100 : Number(g.max)}</td>
      <td style="border:1px solid #999;padding:2px 4px;text-align:center;font-weight:700">${esc(g.grade)}</td>
      <td style="border:1px solid #999;padding:2px 4px;text-align:left;font-size:9px">${esc(g.remark || '')}</td></tr>`).join('');

  const daysOpen    = cal.days_school_opened || d.days_opened || '—';
  const daysPresent = r.daysPresent ?? d.days_present ?? '—';
  const daysAbsent  = (Number(daysOpen) && Number(daysPresent)) ? (Number(daysOpen) - Number(daysPresent)) : '—';
  const tRemark = r.teacherRemark || '';
  const nextTerm = cal.next_term_begins || '';
  const vacates  = cal.school_vacates || '';

  const chartItems = visibleSubjects.slice(0, 8);
  const chart = chartItems.map(s => {
    const score = Number(s.total) || 0;
    const pct = Math.max(0, Math.min(100, score));
    const color = score >= 70 ? '#15803d' : score >= 50 ? '#1e3a8a' : score >= 40 ? '#b45309' : '#b91c1c';
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0">
      <div style="font-size:8px;font-weight:700;color:#333;margin-bottom:2px">${score}</div>
      <div style="width:60%;height:${Math.max(6, pct * 0.9)}px;background:${color};border-radius:2px 2px 0 0"></div>
      <div style="font-size:8px;margin-top:3px;text-align:center;line-height:1.1;color:#333;word-break:break-all">${esc(s.subject.substring(0, 8))}</div>
    </div>`;
  }).join('');

  const cParts = [];
  if (r.term1Average != null) cParts.push(['Term 1', r.term1Average]);
  if (r.term2Average != null) cParts.push(['Term 2', r.term2Average]);
  if (r.term3Average != null) cParts.push(['Term 3', r.term3Average]);
  if (r.cumulativeAverage != null) cParts.push(['Cumulative', r.cumulativeAverage]);
  const showCumulativeLine = r.term !== 'Term1' && cParts.length > 1;
  const cumulativeRow = showCumulativeLine ? `
    <div style="display:grid;grid-template-columns:repeat(${cParts.length},1fr);gap:6px;margin:10px 0;
                padding:10px;background:#faf7f2;border:1px solid #e5dccf;border-radius:6px">
      ${cParts.map(([label, val]) => `
        <div style="text-align:center">
          <div style="font-size:9px;color:#6b4423;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${label}</div>
          <div style="font-size:14px;font-weight:800;color:#1e3a8a">${val}%</div>
        </div>`).join('')}
    </div>` : '';

  const debtTotal = Number(r.debtTotal) || 0;
  const debtBanner = debtTotal > 0 ? `
    <div class="debt-banner">
      <span>⚠ Outstanding balance: <strong>₦${debtTotal.toLocaleString()}</strong> — kindly settle at the school bursary.</span>
    </div>` : '';

  const sigImg = t.principalSignatureUrl
    ? `<img src="${esc(t.principalSignatureUrl)}" alt="Signature" style="max-height:60px;max-width:160px;object-fit:contain"
        onerror="this.style.display='none'">` : '';
  const stampImg = t.schoolStampUrl
    ? `<img src="${esc(t.schoolStampUrl)}" alt="Stamp" style="max-height:70px;max-width:100px;object-fit:contain"
        onerror="this.style.display='none'">` : '';

  const emptySubjectsMsg = visibleSubjects.length === 0
    ? `<div style="padding:16px;text-align:center;color:#7a6a58;font-style:italic;border:1px dashed #e5dccf;border-radius:6px;margin-bottom:10px">
         No scores have been entered for any subject this term.
       </div>`
    : '';

  q('pReportBox').innerHTML = `
    ${debtBanner}
    <div id="reportCard" style="background:#fff;color:#111;padding:16px 18px;font-family:'Inter','Segoe UI',Arial,sans-serif;
      font-size:11px;line-height:1.35;border:1px solid #333;max-width:1000px;margin:0 auto">

      <div style="display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;
        border-bottom:3px solid #f5b800;padding-bottom:10px;margin-bottom:10px">
        <div style="width:110px;height:110px;border-radius:8px;border:2px solid #f5b800;
          background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden">${logo}</div>
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:900;letter-spacing:.5px;color:#111;text-transform:uppercase;line-height:1.1">${schoolName}</div>
          <div style="font-size:11px;color:#333;margin-top:3px">${schoolAddr}</div>
          <div style="font-size:11px;color:#333;font-weight:700">TERMINAL REPORT SHEET</div>
          <div style="font-size:11px;color:#333;font-weight:600">${esc(r.term)} &mdash; ${esc(r.academicYear)} SESSION</div>
          <div style="font-size:11px;font-style:italic;color:#6b4423;margin-top:2px">Motto: ${motto}</div>
        </div>
      </div>

      <table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10.5px">
        <tr>
          <td style="border:1px solid #333;padding:3px 8px;background:#f2f2f2;font-weight:700;width:80px">NAME</td>
          <td style="border:1px solid #333;padding:3px 8px">${esc(r.student.name)}</td>
          <td style="border:1px solid #333;padding:3px 8px;background:#f2f2f2;font-weight:700;width:60px">CLASS</td>
          <td style="border:1px solid #333;padding:3px 8px">${esc(r.student.className)}</td>
        </tr>
        <tr>
          <td style="border:1px solid #333;padding:3px 8px;background:#f2f2f2;font-weight:700">ADM. NO</td>
          <td style="border:1px solid #333;padding:3px 8px">${esc(r.student.studentId)}</td>
          <td style="border:1px solid #333;padding:3px 8px;background:#f2f2f2;font-weight:700">TERM</td>
          <td style="border:1px solid #333;padding:3px 8px">${esc(r.term)}</td>
        </tr>
        <tr>
          <td style="border:1px solid #333;padding:3px 8px;background:#f2f2f2;font-weight:700">SESSION</td>
          <td style="border:1px solid #333;padding:3px 8px">${esc(r.academicYear)}</td>
          <td style="border:1px solid #333;padding:3px 8px;background:#f2f2f2;font-weight:700">OVERALL</td>
          <td style="border:1px solid #333;padding:3px 8px;font-weight:700">${overallPctVisible == null ? '—' : overallPctVisible + '%'}</td>
        </tr>
      </table>

      ${cumulativeRow}
      ${emptySubjectsMsg}

      <div style="display:grid;grid-template-columns:1fr 230px;gap:10px;margin-bottom:10px">
        <div>
          <div style="font-weight:900;text-align:center;background:#2d3748;color:#fff;padding:3px;font-size:10.5px;
            text-transform:uppercase;letter-spacing:.5px">Subject Performance</div>
          <table style="width:100%;border-collapse:collapse;font-size:10px">
            <thead><tr style="background:#f2f2f2">${cols.join('')}</tr></thead>
            <tbody>
              ${rows || '<tr><td colspan="20" style="text-align:center;padding:10px;color:#999">No subjects</td></tr>'}
              <tr style="background:#f2f2f2;font-weight:800">
                <td colspan="${showCumulativeCols ? (showTerm3Col ? 10 : 9) : 7}" style="border:1px solid #333;padding:3px;text-align:right">TOTAL</td>
                <td style="border:1px solid #333;padding:3px;text-align:center">${totalObtainedVisible}</td>
                <td style="border:1px solid #333;padding:3px;text-align:center">${overallPctVisible == null ? '—' : overallPctVisible + '%'}</td>
                <td style="border:1px solid #333;padding:3px"></td>
                ${showCumulativeCols ? `<td colspan="${showTerm3Col ? 4 : 3}" style="border:1px solid #333;padding:3px"></td>` : ''}
              </tr>
            </tbody>
          </table>
        </div>

        <div>
          <div style="border:2px solid #2d3748;margin-bottom:8px">
            <div style="background:#2d3748;color:#fff;padding:3px;text-align:center;font-weight:800;font-size:10px;
              text-transform:uppercase;letter-spacing:.5px">Affective Domain</div>
            <table style="width:100%;border-collapse:collapse">${affRows}</table>
          </div>
          <div style="border:2px solid #2d3748;margin-bottom:8px">
            <div style="background:#2d3748;color:#fff;padding:3px;text-align:center;font-weight:800;font-size:10px;
              text-transform:uppercase;letter-spacing:.5px">Psychomotor Domain</div>
            <table style="width:100%;border-collapse:collapse">${psyRows}</table>
          </div>
          <div style="border:2px solid #2d3748">
            <div style="background:#2d3748;color:#fff;padding:3px;text-align:center;font-weight:800;font-size:10px;
              text-transform:uppercase;letter-spacing:.5px">Grading Scale</div>
            <table style="width:100%;border-collapse:collapse">
              <thead><tr style="background:#f2f2f2">
                <th style="border:1px solid #999;padding:2px;font-size:9px">Range</th>
                <th style="border:1px solid #999;padding:2px;font-size:9px">Grade</th>
                <th style="border:1px solid #999;padding:2px;font-size:9px;text-align:left">Remark</th>
              </tr></thead>
              <tbody>${gradeRows}</tbody>
            </table>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 230px;gap:10px;margin-bottom:10px">
        <div style="border:2px solid #2d3748">
          <div style="background:#2d3748;color:#fff;padding:3px;text-align:center;font-weight:800;font-size:10px;
            text-transform:uppercase;letter-spacing:.5px">Performance in Subjects (%)</div>
          <div style="display:flex;align-items:flex-end;gap:6px;height:130px;padding:8px 6px 4px;border-bottom:1px solid #ccc">
            ${chart}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="border:2px solid #2d3748;flex:1">
            <div style="background:#2d3748;color:#fff;padding:3px;text-align:center;font-weight:800;font-size:10px;
              text-transform:uppercase;letter-spacing:.5px">Attendance</div>
            <table style="width:100%;border-collapse:collapse;font-size:9.5px">
              <tr><td style="padding:3px 6px">Times School Opened</td><td style="text-align:right;padding:3px 6px;font-weight:700">${daysOpen}</td></tr>
              <tr><td style="padding:3px 6px">Times Present</td><td style="text-align:right;padding:3px 6px;font-weight:700">${daysPresent}</td></tr>
              <tr><td style="padding:3px 6px">Times Absent</td><td style="text-align:right;padding:3px 6px;font-weight:700">${daysAbsent}</td></tr>
            </table>
          </div>
          <div style="border:2px solid #2d3748;flex:1">
            <div style="background:#2d3748;color:#fff;padding:3px;text-align:center;font-weight:800;font-size:10px;
              text-transform:uppercase;letter-spacing:.5px">Next Term</div>
            <table style="width:100%;border-collapse:collapse;font-size:9.5px">
              <tr><td style="padding:3px 6px">Next term begins</td><td style="text-align:right;padding:3px 6px;font-weight:700">${esc(nextTerm || '—')}</td></tr>
              <tr><td style="padding:3px 6px">School vacates</td><td style="text-align:right;padding:3px 6px;font-weight:700">${esc(vacates || '—')}</td></tr>
            </table>
          </div>
        </div>
      </div>

      <table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10.5px">
        <tr>
          <td style="border:1px solid #333;padding:4px 8px;background:#f2f2f2;font-weight:700;width:150px">CLASS TEACHER'S REMARK</td>
          <td style="border:1px solid #333;padding:6px 8px;height:28px">${esc(tRemark || '—')}</td>
        </tr>
        <tr>
          <td style="border:1px solid #333;padding:4px 8px;background:#f2f2f2;font-weight:700">PRINCIPAL'S REMARK</td>
          <td style="border:1px solid #333;padding:6px 8px;height:28px">${esc(r.principalRemark || '')}</td>
        </tr>
      </table>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px;align-items:flex-end">
        <div style="text-align:center;padding-top:36px;border-top:1px solid #333;font-size:10px;font-weight:700">
          CLASS TEACHER'S SIGNATURE
        </div>
        <div style="text-align:center;padding-top:36px;border-top:1px solid #333;font-size:10px;font-weight:700">
          ${sigImg ? `<div style="margin-bottom:4px">${sigImg}</div>` : ''}
          ${esc(t.principalName || 'PRINCIPAL')} <br><span style="font-weight:400;font-size:9px">PRINCIPAL'S SIGNATURE</span>
        </div>
        <div style="text-align:center;padding-top:36px;border-top:1px solid #333;font-size:10px;font-weight:700">
          ${stampImg ? `<div style="margin-bottom:4px">${stampImg}</div>` : ''}
          SCHOOL STAMP
        </div>
      </div>

      <div style="text-align:center;font-size:9px;color:#666;margin-top:12px;font-style:italic">
        Report generated on ${new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' })}.
        Please contact the school if you notice any discrepancy.
      </div>
    </div>
  `;
}

async function parentAsk() {
  const question = q('pQuestion').value.trim();
  if (!question) return toast('Type a question', 'err');
  const idx = q('pWard').value; if (idx === '') return toast('No ward', 'err');
  const ward = window.__WARDS[Number(idx)];
  const r = window.__CURRENT_RESULT;
  if (!r) return toast('Load a result first', 'err');
  const chat = q('pChat');
  chat.innerHTML = `<div class="chat-message user"><strong>You:</strong>\n${esc(question)}</div><div class="chat-message ai">Thinking…</div>`;
  try {
    const resp = await api('parentAskResultAI', {
      className: ward.className, studentId: ward.studentId,
      term: r.term, academicYear: r.academicYear, question
    });
    chat.innerHTML = `<div class="chat-message user"><strong>You:</strong>\n${esc(question)}</div>
      <div class="chat-message ai"><strong>Assistant:</strong>\n${esc(resp.answer)}</div>`;
    q('pQuestion').value = '';
  } catch (e) { chat.innerHTML = `<div class="chat-message ai">${esc(e.message)}</div>`; }
}

/* START */
applyLogoFallback();
if (S.token && S.user) boot();
</script>
