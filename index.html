<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Tomorrow Model College — Grade System</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --login-bg-image: url('school.jpg');
    --login-logo-image: url('school-crest.png');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f1f6fc; --surface:#fff; --surface-2:#f7faff;
    --ink:#18324a; --muted:#63778d; --line:#dce6f1; --line-strong:#c6d5e5;
    --brown:#0756a8; --brown-dark:#043e7a; --brown-light:#0b68c2;
    --gold:#d9ad43; --gold-dark:#b88a1e; --gold-light:#f2dfaa;
    --blue:#0756a8; --blue-dark:#043e7a;
    --ok:#15803d; --warn:#b45309; --err:#b91c1c;
    --radius-sm:6px; --radius:10px; --radius-lg:14px;
    --shadow-sm:0 1px 2px rgba(26,20,16,.06);
    --shadow:0 2px 8px rgba(26,20,16,.06),0 1px 2px rgba(26,20,16,.04);
    --shadow-lg:0 12px 32px rgba(26,20,16,.12);
  }
  html,body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.5; color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; }
  button { font-family:inherit; font-size:13.5px; font-weight:600; padding:9px 16px;
    border:1px solid transparent; border-radius:var(--radius-sm);
    background:var(--brown); color:#fff; cursor:pointer;
    transition:background .15s,transform .05s; white-space:nowrap; }
  button:hover { background:var(--brown-dark); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  button.sec { background:#fff; color:var(--brown); border-color:var(--line-strong); }
  button.sec:hover { background:var(--surface-2); }
  button.ok { background:var(--ok); } button.ok:hover { background:#166534; }
  button.blue { background:var(--blue); } button.blue:hover { background:var(--blue-dark); }
  button.danger { background:var(--err); } button.danger:hover { background:#991b1b; }
  button.sm { padding:5px 10px; font-size:12.5px; }
  input,select,textarea { font-family:inherit; font-size:13.5px; padding:9px 12px;
    border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--ink); width:100%; }
  input:focus,select:focus,textarea:focus {
    outline:none; border-color:var(--brown); box-shadow:0 0 0 3px rgba(107,68,35,.12); }
  label { font-size:11.5px; color:var(--muted); font-weight:700;
    display:block; margin-bottom:5px; letter-spacing:.04em; text-transform:uppercase; }

  .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:20px;
    position:relative; overflow:hidden;
    background: var(--login-bg-image, none) center/cover no-repeat,
      linear-gradient(135deg,#2c1a0d 0%,#6b4423 45%,#3a2413 100%); }
  .login-wrap::before { content:''; position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(230,180,34,.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(30,58,138,.32) 0%, transparent 55%),
      rgba(20,12,5,.55); pointer-events:none; }
  .login-card { position:relative; z-index:1; width:100%; max-width:440px;
    background:#fff; border-radius:var(--radius-lg); padding:40px 36px 32px;
    box-shadow:var(--shadow-lg),0 30px 80px rgba(0,0,0,.35); border-top:5px solid var(--gold); }
  .login-logo { width:86px; height:86px; margin:0 auto 18px; border-radius:50%;
    background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-family:Georgia,serif; font-size:36px; font-weight:800;
    border:3px solid var(--gold); overflow:hidden;
    background-image:var(--login-logo-image, none);
    background-size:cover; background-position:center;
    box-shadow:0 10px 26px rgba(30,58,138,.35); }
  .login-logo span { display:block; }
  .login-logo.has-image span { display:none; }
  .login-card h1 { text-align:center; font-size:19px; color:var(--brown);
    letter-spacing:.02em; line-height:1.25; margin-bottom:8px; text-transform:uppercase; font-weight:800; }
  .login-card .motto { text-align:center; color:var(--blue); font-style:italic;
    font-size:12px; font-weight:700; letter-spacing:.04em; margin-bottom:4px; }
  .login-card .tag { text-align:center; font-size:10.5px; color:var(--muted);
    margin-bottom:24px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; }
  .login-divider { height:1px; background:var(--line); margin:0 0 20px; position:relative; }
  .login-divider::after { content:'Sign in to your account'; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); background:#fff; padding:0 12px;
    font-size:10px; color:var(--muted); font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
  .login-card input { margin-bottom:12px; }
  .login-card button.primary-btn { width:100%; margin-top:6px; padding:12px; font-size:15px; font-weight:700;
    background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%); letter-spacing:.03em; }
  .login-card button.primary-btn:hover { background:linear-gradient(135deg,var(--blue-dark) 0%,#0f1f4a 100%); }
  .login-err { color:var(--err); font-size:13px; margin-top:12px;
    min-height:18px; text-align:center; font-weight:600; }
  .login-footer { text-align:center; margin-top:22px; padding-top:16px;
    border-top:1px solid var(--line); font-size:10px; color:var(--muted);
    letter-spacing:.12em; text-transform:uppercase; font-weight:700; }
  .login-footer .credit { display:block; margin-top:6px; color:var(--brown-light);
    letter-spacing:.08em; font-size:10px; }

  .app-layout { flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .topbar { background:#fff; border-bottom:3px solid var(--blue);
    height:64px; padding:0 24px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:40; box-shadow:var(--shadow-sm); }
  .topbar .brand { display:flex; align-items:center; gap:14px; }
  .topbar .brand-logo { width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    color:var(--gold); font-family:Georgia,serif; font-weight:800; font-size:17px;
    display:flex; align-items:center; justify-content:center;
    border:2.5px solid var(--gold); overflow:hidden;
    background-image:var(--login-logo-image, none);
    background-size:cover; background-position:center; }
  .topbar .brand-logo span { display:block; }
  .topbar .brand-logo.has-image span { display:none; }
  .topbar .brand-text .name { font-size:13px; font-weight:800; color:var(--brown); letter-spacing:.02em; }
  .topbar .brand-text .tag { font-size:10px; color:var(--blue);
    letter-spacing:.12em; text-transform:uppercase; font-weight:700; margin-top:2px; }
  .topbar .user { display:flex; align-items:center; gap:14px; }
  .topbar .user .who { text-align:right; line-height:1.15; }
  .topbar .user .who .uname { font-size:13px; font-weight:700; color:var(--ink); }
  .topbar .user .who .urole { font-size:10.5px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-top:1px; }

  .body-layout { flex:1; display:grid; grid-template-columns:240px 1fr; min-height:0; }
  .sidebar { background:#fff; border-right:1px solid var(--line); padding:20px 12px; overflow-y:auto; }
  .sidebar .group { margin-bottom:22px; }
  .sidebar .group-title { font-size:10.5px; color:var(--muted); font-weight:800;
    text-transform:uppercase; letter-spacing:.1em; padding:0 12px 6px; }
  .nav-item { display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; color:var(--ink);
    cursor:pointer; user-select:none; border:1px solid transparent; margin-bottom:2px;
    transition:background .12s,color .12s; }
  .nav-item:hover { background:var(--surface-2); }
  .nav-item.active { background:#edf5ff; color:var(--brown); border-color:#c6ddf7;
    box-shadow:inset 3px 0 0 var(--blue); }
  .nav-item .dot { width:6px; height:6px; border-radius:50%;
    background:var(--line-strong); flex-shrink:0; }
  .nav-item.active .dot { background:var(--gold-dark); }
  .nav-item .count-badge { margin-left:auto; background:var(--err); color:#fff;
    font-size:10px; font-weight:800; padding:1px 7px; border-radius:20px; }

  main.content { padding:26px; overflow-y:auto; }
  .page-head { margin-bottom:22px; }
  .page-head h1 { font-size:22px; font-weight:800; color:var(--brown); letter-spacing:-.01em; margin-bottom:4px; }
  .page-head p { color:var(--muted); font-size:13px; }
  .panel { display:none; } .panel.active { display:block; }

  .card { background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-sm); margin-bottom:18px; }
  .card h2 { font-size:15px; font-weight:800; color:var(--brown); margin-bottom:6px; }
  .stat-card { margin-bottom:0; padding:18px; border-top:3px solid var(--blue); }
  .stat-number { font-size:30px; line-height:1.15; font-weight:850; color:var(--blue-dark); letter-spacing:-.03em; }
  .template-preview { border:1px solid var(--line-strong); border-top:5px solid var(--preview-primary, #0756a8); background:var(--preview-secondary,#fff); padding:18px; border-radius:8px; color:var(--ink); }
  .template-preview .preview-head { display:flex; align-items:center; gap:14px; padding-bottom:12px; border-bottom:2px solid var(--preview-primary,#0756a8); }
  .template-preview .preview-logo { width:62px;height:62px;object-fit:contain;border:1px solid var(--line);border-radius:6px; }
  .template-preview h3 { color:var(--preview-primary,#0756a8);font-size:17px;line-height:1.2; }
  .template-preview .preview-motto { font-style:italic;font-weight:700;margin-top:4px; }
  @media(max-width:700px){ .stat-number{font-size:25px} }
  .card .sub { color:var(--muted); font-size:12.5px; margin-bottom:14px; }

  .grid { display:grid; gap:12px; }
  .grid.cols-2 { grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .grid.cols-3 { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .grid.cols-4 { grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .check { display:flex; align-items:center; gap:8px;
    padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
    font-size:12.5px; background:var(--surface-2); cursor:pointer; }
  .check input { width:auto; }

  .table-wrap { border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; }
  th,td { padding:11px 12px; text-align:left; border-bottom:1px solid var(--line); }
  th { background:var(--surface-2); font-weight:700; color:var(--brown);
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#fbfaf7; }

  .badge { display:inline-block; padding:3px 10px; border-radius:20px;
    font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
  .badge.info { background:#e0e7ff; color:#0756a8; }
  .badge.ok   { background:#d1fae5; color:#065f46; }
  .badge.warn { background:#fef3c7; color:#92400e; }
  .badge.err  { background:#fee2e2; color:#991b1b; }

  .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; font-style:italic; }
  .portal-note { padding:12px 14px; border-radius:var(--radius-sm);
    background:#eff6ff; border:1px solid #bfdbfe; color:#0756a8; margin:10px 0; font-size:12.5px; }

  .score-input { width:64px; padding:5px 6px; text-align:center; font-size:13px; }
  .dmn-select { width:100%; min-width:110px; padding:5px 6px; font-size:12px; }

  .debt-banner { background:#fef2f2; border:1px solid #fecaca; color:#991b1b;
    padding:12px 14px; border-radius:var(--radius-sm); margin-bottom:14px;
    font-weight:600; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  .debt-banner strong { color:#7f1d1d; }

  .ann-card { background:#fffdf5; border:1px solid var(--gold-light); border-radius:var(--radius-sm);
    padding:12px 14px; margin-bottom:10px; }
  .ann-card .msg { font-size:13.5px; color:var(--ink); margin-bottom:6px; line-height:1.55; }
  .ann-card .meta { font-size:11px; color:var(--muted); }

  .chat-message { padding:10px 14px; border-radius:var(--radius-sm); margin:8px 0;
    font-size:13px; white-space:pre-wrap; line-height:1.55; }
  .chat-message.user { background:#eff6ff; margin-left:22px; }
  .chat-message.ai { background:#f0fdf4; margin-right:22px; }

  .toast { position:fixed; bottom:22px; right:22px; background:var(--brown-dark); color:#fff;
    padding:13px 20px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; max-width:340px;
    opacity:0; transform:translateY(12px); transition:opacity .2s,transform .2s;
    pointer-events:none; z-index:1000; box-shadow:var(--shadow-lg); border-left:4px solid var(--gold); }
  .toast.on { opacity:1; transform:translateY(0); }
  .toast.ok { background:var(--ok); border-left-color:var(--gold); }
  .toast.err { background:var(--err); border-left-color:#fca5a5; }

  .stat-box { text-align:center; padding:10px; border-radius:6px; }
  .stat-box .label { font-size:10px; text-transform:uppercase; font-weight:700; letter-spacing:.04em; }
  .stat-box .value { font-size:22px; font-weight:800; }

  @media (max-width:900px) {
    .body-layout { grid-template-columns:1fr; }
    .sidebar { display:flex; overflow-x:auto; padding:8px 12px;
      border-right:none; border-bottom:1px solid var(--line); gap:4px; }
    .sidebar .group { display:flex; gap:4px; margin:0; }
    .sidebar .group-title { display:none; }
    .nav-item { white-space:nowrap; padding:8px 12px; margin:0; }
    .nav-item.active { box-shadow:inset 0 -3px 0 var(--gold); }
  }
  @media (max-width:640px) {
    main.content { padding:16px; }
    .topbar { padding:0 14px; height:58px; }
    .topbar .brand-text .tag { display:none; }
    .topbar .user .who { display:none; }
    .card { padding:16px; }
  }
  @media print {
    body { background:#fff; }
    header, .sidebar, button, .card.toolbar, h1, .page-head { display:none !important; }
    main.content { padding:0; }
    #reportCard { border:none !important; padding:0 !important; max-width:100% !important;
      box-shadow:none !important; font-size:10px; }
    #reportCard tr { page-break-inside:avoid; }
    body * { visibility:hidden !important; }
    #reportCard, #reportCard * { visibility:visible !important; }
    #reportCard { position:absolute!important;left:0!important;top:0!important;width:100%!important; }
    #studentBox { display:block!important; position:absolute!important;left:0!important;top:0!important;width:100%!important;padding:0!important;border:0!important;box-shadow:none!important }
    #studentBox .result-summary,#studentBox .portal-toolbar { display:none!important }
    #studentBox .table-wrap { overflow:visible!important }
    #studentBox table { width:100%!important;font-size:10px!important }
    #studentBox th,#studentBox td { padding:4px!important;border:1px solid #777!important }
    #reportCard .gtmc-result-columns { grid-template-columns:minmax(0,1fr) 165px!important;gap:4px!important; }
    #reportCard .gtmc-report-header { grid-template-columns:54px 1fr!important; }
    #reportCard .gtmc-report-logo { width:50px!important;height:50px!important; }
    #reportCard table { font-size:7px!important; }
    #reportCard td,#reportCard th { padding:1px 2px!important; }
  }

  /* Additional frontend workflow improvements */
  .score-input{min-width:58px;max-width:78px;text-align:center;font-weight:700;padding:7px 5px;font-variant-numeric:tabular-nums}
  .score-input:focus{outline:2px solid #0756a8;outline-offset:1px;background:#eff6ff}
  .score-input.score-invalid{border-color:#b91c1c!important;background:#fef2f2!important;color:#991b1b}
  .score-input.score-saved{border-color:#15803d!important;background:#f0fdf4!important}
  .table-search{max-width:320px;min-width:180px}
  .portal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .portal-toolbar .hint{font-size:12px;color:var(--muted)}
  .result-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .result-summary>div{background:#f1f7fd;border:1px solid #dce6f1;border-radius:8px;padding:12px}
  .result-summary strong{display:block;font-size:20px;color:#043e7a}
  @media(max-width:640px){.result-summary{grid-template-columns:1fr}.table-search{max-width:none;width:100%}}

  /* GTMC professional frontend refresh */
  body{background:#f1f6fc;color:#18324a}
  .topbar{border-bottom:3px solid #0756a8;box-shadow:0 4px 18px rgba(4,62,122,.07)}
  .topbar .brand-text .name{color:#043e7a;font-size:13px;letter-spacing:.035em}
  .sidebar{background:#fff}
  .nav-item{border-radius:8px;min-height:38px}
  .nav-item.active{background:#edf5ff;color:#043e7a;border-color:#c6ddf7;box-shadow:inset 3px 0 0 #0756a8}
  main.content{padding:22px}
  .page-head h1,.card h2{color:#043e7a}
  .card{border-color:#dce6f1;border-radius:12px;box-shadow:0 3px 14px rgba(4,62,122,.045)}
  button{background:#0756a8;border-radius:7px}
  button:hover{background:#043e7a}
  button.sec{color:#0756a8;border-color:#c6d5e5}
  button.blue{background:#0756a8}
  input:focus,select:focus,textarea:focus{border-color:#0756a8;box-shadow:0 0 0 3px rgba(7,86,168,.12)}
  .stat-box{border:1px solid #dce6f1;background:#f7faff}
  #reportCard{width:100%;max-width:100%!important;border:1px solid #dce6f1!important;border-radius:8px;box-shadow:0 5px 24px rgba(4,62,122,.07)}
  #reportCard table{table-layout:auto}
  #reportCard th{font-weight:800}
  #reportCard td,#reportCard th{vertical-align:middle}
  @media(max-width:900px){main.content{padding:15px}.body-layout{grid-template-columns:1fr}}
  @media print{
    @page{size:A4 landscape;margin:5mm}
    body{background:#fff!important;font-size:10px}
    .app-layout{min-height:0}
    main.content{padding:0!important;overflow:visible!important}
    #reportCard{width:100%!important;max-width:none!important;height:auto!important;max-height:none!important;overflow:visible!important;border:0!important;border-radius:0!important;box-shadow:none!important;padding:1mm!important;font-size:7.5px!important;line-height:1.08!important}
    #reportCard .gtmc-report-header{grid-template-columns:48px 1fr!important;gap:5px!important;padding-bottom:3px!important;margin-bottom:3px!important}
    #reportCard .gtmc-report-logo{width:44px!important;height:44px!important}
    #reportCard .gtmc-school-name{font-size:13px!important}
    #reportCard .gtmc-student-details{margin-bottom:3px!important;font-size:6.8px!important}
    #reportCard .gtmc-student-details td{padding:2px 5px!important}
    #reportCard .gtmc-result-columns{grid-template-columns:minmax(0,1fr) 145px!important;gap:3px!important;margin-bottom:3px!important}
    #reportCard table{font-size:6.2px!important}
    #reportCard .gtmc-result-columns{grid-template-columns:minmax(0,1fr) 110px!important}
    #reportCard .report-vertical-head{height:58px!important;font-size:5.5px!important}
    #reportCard .gtmc-subject-performance{font-size:5.5px!important}
    #reportCard td,#reportCard th{padding:1px 2px!important}
    #reportCard .gtmc-section-title{padding:3px!important;font-size:8px!important}
    #reportCard .gtmc-bottom-row{margin-bottom:5px!important}
    #reportCard .gtmc-signatures{margin-top:3px!important;gap:5px!important}
    #reportCard .gtmc-signatures>div{padding-top:8px!important;font-size:6.5px!important}
    #reportCard .gtmc-footer{margin-top:2px!important;font-size:6px!important}
  }


  /* GTMC complete academic-analysis extension */
  .report-vertical-head{writing-mode:vertical-rl;transform:rotate(180deg);height:78px;min-width:18px;max-width:24px;white-space:normal!important;text-align:left!important;vertical-align:bottom!important;padding:3px!important;font-size:7px!important}
  .gtmc-subject-performance{table-layout:fixed!important;width:100%!important;font-size:7px!important}
  .gtmc-subject-performance th,.gtmc-subject-performance td{padding:2px!important;overflow-wrap:anywhere}
  .gtmc-subject-performance td:first-child,.gtmc-subject-performance th:first-child{width:25%!important;text-align:left}
  .compact-broadsheet{font-size:11px;min-width:max-content;border-collapse:collapse}
  .compact-broadsheet th,.compact-broadsheet td{padding:5px 6px;text-align:center;white-space:nowrap}
  .compact-broadsheet th{background:#eaf3ff;color:#073b72}
  .compact-broadsheet .br-name,.br-name{text-align:left;font-weight:800;min-width:180px}

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API = 'https://script.google.com/macros/s/AKfycbxd2V9A7GK2qpbdNRCeUwVRKqRlFQro1nVeHQr3j9QeP8G2RSBn38ixQkeYZ_xlew4-/exec';
const ATTENDANCE_API = 'https://script.google.com/macros/s/AKfycbyxsohckjH29QFwbgUdVuP9A-Y-OMJa9ve7nkbwB0qKxtFmK2vM0C1huublkBZrD35X/exec';

const S = {
  token: localStorage.getItem('gs_token') || '',
  user: JSON.parse(localStorage.getItem('gs_user') || 'null'),
  cache: { classes: null, subjectsByClass: {} }
};

async function api(action, payload = {}) {
  let res;
  try {
    res = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ action, token: S.token }, payload)),
      redirect:'follow'
    });
  } catch (e) { throw new Error('Network error — check internet or API URL'); }
  const raw = await res.text();
  let json;
  try { json = JSON.parse(raw); }
  catch (e) { throw new Error('Non-JSON (' + res.status + '): ' + raw.slice(0,180)); }
  if (!json || json.success !== true) {
    const msg = (json && json.error) || 'Request failed';
    if (/session/i.test(msg)) logout();
    if (/^unknown action/i.test(msg))
      throw new Error('Deployment is stale. Redeploy Apps Script and confirm API URL.');
    throw new Error(msg);
  }
  return json.data;
}

/* Attendance backend helper (returns { ok:true, ... } instead of { success:true, data:... }) */
async function attendanceApi(action, payload = {}) {
  let res;
  try {
    res = await fetch(ATTENDANCE_API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ action }, payload || {})),
      redirect:'follow'
    });
  } catch (e) { throw new Error('Attendance network error — check internet'); }
  const raw = await res.text();
  let json;
  try { json = JSON.parse(raw); }
  catch (e) { throw new Error('Attendance non-JSON (' + res.status + '): ' + raw.slice(0,180)); }
  if (!json || json.ok !== true) throw new Error((json && json.error) || 'Attendance request failed');
  return json;
}

function saveSession(t,u){ S.token=t; S.user=u;
  localStorage.setItem('gs_token',t); localStorage.setItem('gs_user',JSON.stringify(u)); }
function logout(){
  localStorage.removeItem('gs_token'); localStorage.removeItem('gs_user');
  S.token=''; S.user=null;
  document.getElementById('loginView').style.display='flex';
  document.getElementById('appView').style.display='none';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function q(id){ return document.getElementById(id); }
function toast(msg,kind){
  const el = q('toast');
  el.textContent = msg;
  el.className = 'toast on' + (kind ? ' ' + kind : '');
  setTimeout(() => el.className = 'toast', 2600);
}
function roleList(){ return S.user ? String(S.user.role || '').split(',').map(s=>s.trim()).filter(Boolean) : []; }
function hasRole(r){ return roleList().indexOf(r) !== -1; }
function fmtMin_(m) {
  m = Number(m) || 0;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function normAidClient_(v) { return String(v == null ? '' : v).trim().replace(/^0+/, '') || '0'; }

async function loadClasses() {
  if (S.cache.classes) return S.cache.classes;
  const response = await api('getClasses');
  const list = Array.isArray(response) ? response : (response && Array.isArray(response.classes) ? response.classes : []);
  S.cache.classes = list.map(c => typeof c === 'string' ? c : c && (c.class || c.className || c.name)).filter(Boolean).map(c => String(c).trim()).filter(Boolean);
  if (!S.cache.classes.length) throw new Error('No active classes were returned by the backend. Check the Classes sheet and redeploy the Apps Script if needed.');
  return S.cache.classes;
}
async function loadSubjects(className) {
  if (S.cache.subjectsByClass[className]) return S.cache.subjectsByClass[className];
  const subs = await api('getSubjectsForClass', { className });
  S.cache.subjectsByClass[className] = subs;
  return subs;
}

function applyLogoFallback() {
  const cssBg = getComputedStyle(document.documentElement).getPropertyValue('--login-logo-image').trim();
  if (!cssBg || cssBg === 'none') return;
  ['loginLogo','topLogo'].forEach(id => {
    const el = q(id); if (!el) return;
    const probe = new Image();
    const url = cssBg.replace(/^url\(['"]?/,'').replace(/['"]?\)$/,'');
    probe.onload = () => el.classList.add('has-image');
    probe.onerror = () => el.classList.remove('has-image');
    probe.src = url;
  });
}

async function doLogin() {
  const email = q('loginEmail').value.trim();
  const password = q('loginPassword').value;
  const btn = q('loginBtn'), err = q('loginErr');
  err.textContent = '';
  if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  let staffErr = null;
  try {
    try {
      const r = await api('login', { email, password });
      saveSession(r.token, r.user); boot(); return;
    } catch (e) { staffErr = e; }
    try {
      const r = await api('parentLogin', { email, password });
      saveSession(r.token, r.user); boot(); return;
    } catch (e2) { err.textContent = (staffErr && staffErr.message) || e2.message; }
  } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

/* Resolve officer status from the attendance backend (cached per session) */
let OFFICERS_CACHE = null;
async function loadOfficers() {
  if (OFFICERS_CACHE) return OFFICERS_CACHE;
  try {
    const r = await attendanceApi('getOfficers');
    OFFICERS_CACHE = (r.officers || []).map(o => String(o.email || '').toLowerCase());
  } catch (e) {
    OFFICERS_CACHE = [];
  }
  return OFFICERS_CACHE;
}
async function isOfficer() {
  const list = await loadOfficers();
  const me = String((S.user && S.user.email) || '').toLowerCase();
  return list.indexOf(me) !== -1;
}

async function boot() {
  if (!S.token || !S.user) { logout(); return; }
  q('loginView').style.display = 'none';
  q('appView').style.display = 'flex';
  q('userLabel').textContent = S.user.name || S.user.email;
  q('userRole').textContent = roleList().map(r => ({
    admin:'Administrator', class_teacher:'Class Teacher', subject_teacher:'Subject Teacher',
    student:'Student', parent:'Parent'
  })[r] || r).join(' · ');
  const portalSwitch = q('portalSwitchBtn');
  if (portalSwitch) {
    const dualStaff = hasRole('class_teacher') && hasRole('subject_teacher');
    portalSwitch.style.display = dualStaff ? 'inline-flex' : 'none';
    portalSwitch.textContent = 'Switch to Subject Teacher';
  }
  applyLogoFallback();

  /* Officer flag is only relevant for staff */
  if (hasRole('admin') || hasRole('class_teacher') || hasRole('subject_teacher')) {
    S.user.isOfficer = await isOfficer();
  } else {
    S.user.isOfficer = false;
  }

  if (hasRole('admin')) renderAdmin();
  else if (hasRole('class_teacher')) renderClassTeacher();
  else if (hasRole('subject_teacher')) renderSubjectTeacher();
  else if (hasRole('student')) renderStudent();
  else if (hasRole('parent')) renderParent();
  else toast('Unknown role: ' + S.user.role, 'err');
}

async function switchStaffPortal() {
  if (!(hasRole('class_teacher') && hasRole('subject_teacher'))) return;
  const tag = q('roleTag')?.textContent || '';
  if (tag.startsWith('Class Teacher')) {
    await renderSubjectTeacher();
    if (q('portalSwitchBtn')) q('portalSwitchBtn').textContent = 'Switch to Class Teacher';
  } else {
    await renderClassTeacher();
    if (q('portalSwitchBtn')) q('portalSwitchBtn').textContent = 'Switch to Subject Teacher';
  }
}

function assignNavOnload(tabId, handlerName) {
  const navItem = document.querySelector('.nav-item[data-tab="' + tabId + '"]');
  if (navItem) navItem.dataset.onload = handlerName;
}

function buildNav(items, defaultTab) {
  if (!items.some(g => (g.tabs || []).some(t => t.id === 'library'))) items.push({ title: 'Resources', tabs: [{ id: 'library', label: 'e-Library' }] });
  const main = q('main');
  if (main && !main.querySelector('[data-panel="library"]')) main.insertAdjacentHTML('beforeend', `
    <div class="panel" data-panel="library">
      <div class="page-head"><h1>School e-Library</h1><p>Browse learning resources shared by Greater Tomorrow Model Schools.</p></div>
      <div class="card"><div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap"><div><h2>Learning Materials</h2><p class="sub">Books, notes, past questions, videos and other approved learning resources.</p></div><button class="sec sm" onclick="loadLibrary()">Refresh</button></div><div class="grid cols-3" style="margin:12px 0"><div><label>Search</label><input id="libSearch" placeholder="Search title, subject, author…" oninput="renderLibraryRows()"></div><div><label>Resource type</label><select id="libCategory" onchange="renderLibraryRows()"><option value="">All types</option><option>Textbook</option><option>Class Notes</option><option>Past Questions</option><option>Video</option><option>Audio</option><option>Worksheet</option><option>Other</option></select></div><div><label>Class</label><select id="libClassFilter" onchange="renderLibraryRows()"><option value="">All classes</option></select></div></div><div id="libraryRows"><div class="empty">Loading library resources…</div></div></div>
      <div class="card" id="libraryAdminCard" style="display:none"><h2>Manage Library Resources</h2><p class="sub">Add a resource by entering its shareable URL. For Google Drive files, set access so intended readers can open the file.</p><input type="hidden" id="libId"><div class="grid cols-3"><div><label>Title *</label><input id="libTitle" placeholder="Resource title"></div><div><label>Author / Teacher</label><input id="libAuthor" placeholder="Author or teacher"></div><div><label>Subject</label><input id="libSubject" placeholder="e.g. Mathematics"></div><div><label>Class</label><select id="libClass"><option value="ALL">All classes</option></select></div><div><label>Resource type</label><select id="libType"><option>Textbook</option><option>Class Notes</option><option>Past Questions</option><option>Video</option><option>Audio</option><option>Worksheet</option><option>Other</option></select></div><div><label>Resource URL *</label><input id="libUrl" type="url" placeholder="https://…"></div><div style="grid-column:1/-1"><label>Description</label><textarea id="libDescription" rows="2" placeholder="Brief description or instructions"></textarea></div></div><div class="row" style="margin-top:12px"><button class="blue" onclick="saveLibraryResource()">Save Resource</button><button class="sec" onclick="resetLibraryForm()">Clear Form</button></div><div id="libAdminStatus" class="portal-note"></div></div>
    </div>`);
  const sidebar = q('sidebar');
  sidebar.innerHTML = items.map(g => `
    <div class="group">
      ${g.title ? `<div class="group-title">${esc(g.title)}</div>` : ''}
      ${g.tabs.map(t => `<div class="nav-item" data-tab="${t.id}" onclick="setNav('${t.id}')">
        <span class="dot"></span><span>${esc(t.label)}</span>
        ${t.badge ? `<span class="count-badge">${t.badge}</span>` : ''}
      </div>`).join('')}
    </div>`).join('');
  const libNav = document.querySelector('.nav-item[data-tab="library"]');
  if (libNav) libNav.dataset.onload = 'loadLibrary';
  setNav(defaultTab);
}
function setNav(tabId) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tabId));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tabId));
  const nav = document.querySelector('.nav-item[data-tab="' + tabId + '"]');
  if (nav && nav.dataset.onload) try { window[nav.dataset.onload](); } catch (e) {}
}

/* ============================================================
   SHARED: SCHOOL e-LIBRARY
   ============================================================ */
let LIBRARY_CACHE = [];
function libraryIsAdmin(){ return hasRole('admin'); }
async function loadLibrary(){
  const box=q('libraryRows'); if(!box) return;
  const adminCard=q('libraryAdminCard'); if(adminCard) adminCard.style.display=libraryIsAdmin()?'block':'none';
  box.innerHTML='<div class="empty">Loading library resources…</div>';
  try{
    const resources=await api('libraryList');
    LIBRARY_CACHE=Array.isArray(resources)?resources:[];
    const cls=await loadClasses().catch(()=>[]);
    const filter=q('libClassFilter'); if(filter){const old=filter.value;filter.innerHTML='<option value="">All classes</option>'+cls.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(cls.includes(old))filter.value=old;}
    const adminClass=q('libClass');if(adminClass){const old=adminClass.value;adminClass.innerHTML='<option value="ALL">All classes</option>'+cls.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(cls.includes(old))adminClass.value=old;}
    renderLibraryRows();
  }catch(e){box.innerHTML=`<div class="empty">Could not load library: ${esc(e.message)}. If you have just updated the backend, run setupSheets() and redeploy the Apps Script web app.</div>`;}
}
function renderLibraryRows(){
  const box=q('libraryRows');if(!box)return;
  const needle=String(q('libSearch')?.value||'').toLowerCase().trim(),cat=q('libCategory')?.value||'',cls=q('libClassFilter')?.value||'';
  const rows=LIBRARY_CACHE.filter(r=>{
    const text=[r.title,r.author,r.subject,r.description,r.category].join(' ').toLowerCase();
    const target=String(r.class||'ALL');
    return (!needle||text.includes(needle))&&(!cat||r.category===cat)&&(!cls||target==='ALL'||target===cls);
  });
  if(!rows.length){box.innerHTML='<div class="empty">No matching library resources yet.</div>';return;}
  box.innerHTML='<div class="grid cols-2">'+rows.map(r=>`<div class="card" style="border:1px solid var(--line)"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>${esc(r.title||'Untitled resource')}</h3><p class="sub">${esc(r.category||'Other')} · ${esc(r.subject||'General')} · ${esc(r.class||'ALL classes')}</p></div>${libraryIsAdmin()?`<div class="row"><button class="sec sm" onclick="editLibraryResource('${esc(r.id)}')">Edit</button><button class="danger sm" onclick="deleteLibraryResource('${esc(r.id)}')">Remove</button></div>`:''}</div>${r.author?`<p><strong>Author:</strong> ${esc(r.author)}</p>`:''}${r.description?`<p>${esc(r.description)}</p>`:''}<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" class="button blue" style="display:inline-block;text-decoration:none;margin-top:8px">Open Resource ↗</a></div>`).join('')+'</div>';
}
function resetLibraryForm(){['libId','libTitle','libAuthor','libSubject','libUrl','libDescription'].forEach(id=>{if(q(id))q(id).value='';});if(q('libClass'))q('libClass').value='ALL';if(q('libType'))q('libType').value='Textbook';if(q('libAdminStatus'))q('libAdminStatus').textContent='';}
function editLibraryResource(id){const r=LIBRARY_CACHE.find(x=>String(x.id)===String(id));if(!r)return; q('libId').value=r.id||'';q('libTitle').value=r.title||'';q('libAuthor').value=r.author||'';q('libSubject').value=r.subject||'';q('libClass').value=r.class||'ALL';q('libType').value=r.category||'Other';q('libUrl').value=r.url||'';q('libDescription').value=r.description||'';q('libAdminStatus').textContent='Editing resource: '+r.title; q('libraryAdminCard').scrollIntoView({behavior:'smooth',block:'start'});}
async function saveLibraryResource(){
  if(!libraryIsAdmin())return toast('Only administrators can manage library resources.','err');
  const title=q('libTitle').value.trim(),url=q('libUrl').value.trim();if(!title||!url)return toast('Enter a resource title and URL.','err');
  try{const r=await api('librarySave',{id:q('libId').value.trim(),title,author:q('libAuthor').value.trim(),subject:q('libSubject').value.trim(),className:q('libClass').value||'ALL',category:q('libType').value, url,description:q('libDescription').value.trim()});q('libAdminStatus').textContent=r.message||'Resource saved.';toast('Library resource saved.','ok');resetLibraryForm();await loadLibrary();}catch(e){q('libAdminStatus').textContent=e.message;toast(e.message,'err');}
}
async function deleteLibraryResource(id){if(!libraryIsAdmin()||!confirm('Remove this resource from the e-Library?'))return;try{await api('libraryDelete',{id});toast('Resource removed from the library.','ok');await loadLibrary();}catch(e){toast(e.message,'err');}}

    const results = await Promise.allSettled([api('getTeachers'), loadClasses(), api('getSubmissions')]);
    const teachers = results[0].status === 'fulfilled' && Array.isArray(results[0].value) ? results[0].value : null;

    const submissions = results[2].status === 'fulfilled' && Array.isArray(results[2].value) ? results[2].value : null;
    if (q('dashTeachers')) q('dashTeachers').textContent = teachers ? teachers.length : '—';
    if (q('dashClasses')) q('dashClasses').textContent = classes ? classes.length : '—';
    if (q('dashSubmissions')) q('dashSubmissions').textContent = submissions ? submissions.length : '—';
    if (q('dashLocked')) q('dashLocked').textContent = submissions ? submissions.filter(x => String(x.status).toLowerCase() === 'locked').length : '—';
    const issues = [];
    if (!teachers) issues.push('Teacher data unavailable');
    if (!classes) issues.push('Class data unavailable');
    if (!submissions) issues.push('Submission data unavailable');
    if (submissions) {
      const unlocked = submissions.filter(x => String(x.status).toLowerCase() !== 'locked').length;
      overview.innerHTML = `<strong>${submissions.length}</strong> submission records found. <strong>${submissions.filter(x => String(x.status).toLowerCase() === 'locked').length}</strong> locked and <strong>${unlocked}</strong> not locked.${issues.length ? `<div style="margin-top:6px;color:var(--warn)">${esc(issues.join(' · '))}</div>` : ''}`;
    } else {
      overview.innerHTML = `<span style="color:var(--warn)">${esc(issues.join(' · ') || 'Could not load all dashboard data.')}</span>`;

}

async function unlockSubmission(teacherEmail, className, subject, term, assessment, isDomains, academicYear) {
  if (isDomains) { if(!confirm('Unlock domain submission?')) return; try { await api('unlockDomains',{teacherEmail,className,term});toast('Unlocked','ok');loadSubmissions(); } catch(e){toast(e.message,'err');} return; }
  if (!assessment) return toast('This is a legacy term-wide lock. It cannot be unlocked as an assessment; ask the teacher to submit each assessment separately.','err');
  const reason=prompt(`Reason for authorising correction of ${assessment}?`); if(!reason||!reason.trim())return;
  const mins=prompt('Correction window in minutes (1–10080):','60'); if(mins===null)return;
  const duration=Number(mins); if(!Number.isFinite(duration)||duration<1||duration>10080)return toast('Enter a duration from 1 to 10080 minutes.','err');
  try { await api('unlockScores',{teacherEmail,className,subject,term,assessment,academicYear,reason:reason.trim(),correctionMinutes:duration});toast(`${assessment} correction authorised`,'ok');loadSubmissions(); }
  catch(e){toast(e.message,'err');}
}

let DMN_KIND = 'affective';
const AFFECTIVE_ITEMS = [

  ['obedience','Obedience'],['neatness','Neatness'],['responsibility','Responsibility'],['self_control','Self-control']
];
const PSYCHOMOTOR_ITEMS = [
  ['handwriting','Handwriting'],['drawing','Drawing and painting'],
  ['handwork','Handwork / practical'],['sports','Sports & physical'],
  ['coordination','Coordination & dexterity'],['tools','Use of tools & equipment']
];
const DMN_RATINGS = { 5:'Excellent',4:'Very Good',3:'Good',2:'Fair',1:'Needs Improvement' };

function switchDomainKind(kind) {
  DMN_KIND = kind;

async function reloadDomainEditor() {
  const className = hasRole('admin') ? q('dmnClass').value.trim() : getClassTeacherClass();
  const term = q('dmnTerm').value.trim();
  const year = q('dmnYear').value.trim();
  const box = q('domainEditorBox');
  if (!className) { box.innerHTML = '<div class="empty">No class has been assigned to your account. Contact the administrator.</div>'; return; }
  if (!term || !year) { box.innerHTML = '<div class="empty">Fill class, term and year.</div>'; return; }
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const [students, existing] = await Promise.all([
      api('getStudents', { className }),
      api('getDomainAssessments', { kind: DMN_KIND, className, term, academicYear: year })
    ]);
    if (!students.length) { box.innerHTML = '<div class="empty">No students.</div>'; return; }
    const byStudent = {}; (existing || []).forEach(r => { byStudent[r.student_id] = r; });
    const items = DMN_KIND === 'affective' ? AFFECTIVE_ITEMS : PSYCHOMOTOR_ITEMS;
    const head = `<th style="min-width:170px">Student</th>` +
      items.map(([k, l]) => `<th style="text-align:center;min-width:110px">${esc(l)}</th>`).join('');
    const rows = students.map(st => {
      const row = byStudent[st.student_id] || {};
      const cells = items.map(([k]) => {
        const v = row[k];
        const opts = ['',1,2,3,4,5].map(n =>
          `<option value="${n}" ${String(v || '') === String(n) ? 'selected' : ''}>${n === '' ? '—' : n + ' · ' + DMN_RATINGS[n]}</option>`
        ).join('');
        return `<td style="text-align:center"><select class="dmn-select" data-student="${esc(st.student_id)}" data-item="${k}">${opts}</select></td>`;
      }).join('');
      return `<tr><td><strong>${esc(st.name)}</strong><br><small style="color:var(--muted);font-size:11px">${esc(st.student_id)}</small></td>${cells}</tr>`;
    }).join('');
    box.innerHTML = `<div style="overflow-x:auto"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="portal-note" style="margin-top:14px">Each change saves immediately.</p>`;
    box.querySelectorAll('select.dmn-select').forEach(sel => {
      sel.addEventListener('change', () => saveDomainRating(sel, className, term, year));
    });
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function saveDomainRating(sel, className, term, year) {
  const studentId = sel.dataset.student, item = sel.dataset.item, value = sel.value;

    await api('saveDomainAssessment', { kind: DMN_KIND, className, term, academicYear: year, studentId, item, value });

    setTimeout(() => { sel.style.background = ''; }, 800);

const _bulkCache = {};

async function loadBulkForClass(className, term, academicYear) {
  const cacheKey = className + '|' + term + '|' + academicYear;
  if (_bulkCache[cacheKey]) return _bulkCache[cacheKey];
  const [scores, domains, remarks, template] = await Promise.all([
    api('getClassScores', { className, term }),
    api('getClassDomains', { className, term, academicYear }),
    api('getClassTeacherRemarks', { className, term, academicYear }),
    api('adminGetReportTemplate')
  ]);
  const bundle = { scores, domains, remarks, template };
  _bulkCache[cacheKey] = bundle;
  return bundle;
}

async function buildReportPayload(className, studentId, studentName, term, academicYear) {
  const [bundle, pr] = await Promise.all([
    loadBulkForClass(className, term, academicYear),
    api('adminPreviewPrincipalRemark', { className, studentId, term, academicYear }).catch(() => null)
  ]);
  const declaredSubjects = await loadSubjects(className);
  const template = bundle.template;

  const subjectResults = declaredSubjects.map(function (subj) {
    const row = (bundle.scores[studentId] || {})[subj] || {};
    const t1 = Number(row.T1) || 0, t2 = Number(row.T2) || 0, t3 = Number(row.T3) || 0, ex = Number(row.Exam) || 0;
    const complete = [row.T1, row.T2, row.T3, row.Exam].every(v => v !== '' && v !== null && v !== undefined);
    const total = complete ? (t1 + t2 + t3 + ex) : null;
    return {
      subject: subj,
      T1: row.T1, T2: row.T2, T3: row.T3, Exam: row.Exam,
      total, complete,
      grade: total === null ? '' : gradeFor(total, template.gradeScale),
      term1Total: null, term2Total: null, term3Total: null, cumulative: null
    };
  });
  const completeTotals = subjectResults.filter(r => r.total !== null);
  const overallAverage = (completeTotals.length === subjectResults.length && subjectResults.length)
    ? Math.round(completeTotals.reduce((a, r) => a + r.total, 0) / subjectResults.length * 100) / 100
    : null;

  const dom = (bundle.domains[studentId] || { affective: {}, psychomotor: {}, days: {} });

  const termAverages = { Term1: null, Term2: null, Term3: null };
  let enrolledFrom = null;
  for (const t of ['Term1','Term2','Term3']) {
    try {
      const tb = await loadBulkForClass(className, t, academicYear);
      const rowFor = tb.scores[studentId] || {};
      const totalsT = [];
      declaredSubjects.forEach(function (subj) {
        const row = rowFor[subj];
        if (!row) return;
        const nums = [row.T1, row.T2, row.T3, row.Exam].map(v => v === '' || v === null ? null : Number(v));
        if (nums.every(n => n !== null && isFinite(n))) totalsT.push(nums.reduce((a,b)=>a+b,0));
      });
      if (totalsT.length) {
        termAverages[t] = Math.round(totalsT.reduce((a,b)=>a+b,0) / totalsT.length * 100) / 100;
        if (enrolledFrom === null) enrolledFrom = t;
      }
    } catch (e) {}
  }
  const presentTerms = ['Term1','Term2','Term3'].filter(t => termAverages[t] !== null);
  const cumulativeAverage = presentTerms.length
    ? Math.round(presentTerms.reduce((a,t)=>a+termAverages[t],0) / presentTerms.length * 100) / 100
    : null;

  return {
    student: { studentId, name: studentName, className },
    term, academicYear,
    subjects: subjectResults,
    overallAverage,
    complete: completeTotals.length === subjectResults.length,
    domains: {
      days_opened: dom.days ? dom.days.days_opened : null,
      days_present: dom.days ? dom.days.days_present : null,
      affective: dom.days ? dom.days.affective_letter : '',
      psychomotor: dom.days ? dom.days.psychomotor_letter : ''
    },
    principalRemark: pr ? pr.remark : '',
    affective: dom.affective || {},
    psychomotor: dom.psychomotor || {},
    teacherRemark: (bundle.remarks || {})[studentId] || '',
    daysPresent: dom.days ? dom.days.days_present : null,
    calendar: null,
    debtTotal: 0,
    announcements: [],
    term1Average: termAverages.Term1,
    term2Average: termAverages.Term2,
    term3Average: termAverages.Term3,
    cumulativeAverage: cumulativeAverage,
    enrolledFrom: enrolledFrom,
    template
  };
}

function gradeFor(score, scale) {
  if (!Array.isArray(scale)) return '';
  const item = scale.find(g => Number(score) >= Number(g.min) && Number(score) <= Number(g.max));
  return item ? String(item.grade || '') : '';
}

function ratingLabel(data, key) {
  const v = Number(data && data[key]);
  if (!(v >= 1 && v <= 5)) return '—';
  return v + ' (' + DMN_RATINGS[v] + ')';
}
function remarkForGrade(g) {
  return ({ A:'Excellent', B:'Very Good', C:'Good', D:'Fair', E:'Pass', F:'Needs Improvement' })[g] || '';
}

function pdfRenderPage(doc, r) {
  const t = r.template || {};
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 20;
  let y = margin;

  function hasAnyScore(s) {
    return ['T1','T2','T3','Exam'].some(function (f) {
      const v = s[f];
      return v !== '' && v !== null && v !== undefined && isFinite(Number(v));
    });
  }
  const visibleSubjects = (r.subjects || []).filter(hasAnyScore);

  const completeVisible = visibleSubjects.filter(s => s.total !== null);
  const totalObtainedVisible = completeVisible.reduce((a, s) => a + (Number(s.total) || 0), 0);
  const totalObtainableVisible = visibleSubjects.length * 100;
  const overallPctVisible = (completeVisible.length === visibleSubjects.length && visibleSubjects.length)
    ? Math.round(totalObtainedVisible / totalObtainableVisible * 100 * 100) / 100
    : null;

  const showCumulativeColsPdf = (r.term === 'Term2' || r.term === 'Term3');
  const showTerm3ColPdf       = (r.term === 'Term3');

  const primary = t.primaryColor || '#0756a8';
  doc.setFontSize(16); doc.setTextColor(primary);
  doc.text(t.schoolName || 'GREATER TOMORROW MODEL SCHOOLS', pageW/2, y, { align: 'center' });
  y += 16;
  doc.setFontSize(9); doc.setTextColor(60, 60, 60);
  doc.text(t.schoolAddress || 'Embassy Island, Moferere Area, Ado-Ekiti', pageW/2, y, { align: 'center' });
  y += 12;
  doc.setFontSize(11); doc.setTextColor(0,0,0);
  doc.setFont(undefined, 'bold');
  doc.text('TERMINAL REPORT SHEET', pageW/2, y, { align: 'center' });
  y += 12;
  doc.setFontSize(10); doc.setFont(undefined, 'normal');
  doc.text(`${r.term} — ${r.academicYear} SESSION`, pageW/2, y, { align: 'center' });
  y += 8;
  if (t.schoolMotto) {
    doc.setFontSize(9); doc.setTextColor(107,68,35);
    doc.text('Motto: ' + t.schoolMotto, pageW/2, y, { align: 'center' });
    y += 6;
  }

  const bio = [
    ['NAME', r.student.name, 'CLASS', r.student.className],
    ['ADM. NO', r.student.studentId, 'TERM', r.term],
    ['SESSION', r.academicYear, 'OVERALL', overallPctVisible != null ? overallPctVisible + '%' : '—']
  ];
  doc.setFontSize(8.5);
  bio.forEach(row => {
    doc.setTextColor(0,0,0); doc.setFont(undefined, 'bold');
    doc.text(row[0], margin, y); doc.text(row[2], pageW/2 + 10, y);
    doc.setFont(undefined, 'normal');
    doc.text(String(row[1] || ''), margin + 40, y);
    doc.text(String(row[3] || ''), pageW/2 + 50, y);
    y += 12;
  });

  const baseHead = ['SN','Subject','1st','2nd','3rd','Exam','Total','Grade','Remark'];
  const cumHead = [];
  if (showCumulativeColsPdf) {
    cumHead.push('Term1');
    cumHead.push('Term2');
    if (showTerm3ColPdf) cumHead.push('Term3');
    cumHead.push('Cumul.');
  }

  const subjectRows = visibleSubjects.map((s, i) => {
    const row = [
      i + 1, s.subject, s.T1 ?? '—', s.T2 ?? '—', s.T3 ?? '—', s.Exam ?? '—',
      s.total != null ? s.total : '—', s.grade || '—', remarkForGrade(s.grade)
    ];
    if (showCumulativeColsPdf) {
      row.push(s.term1Total != null ? s.term1Total : '—');
      row.push(s.term2Total != null ? s.term2Total : '—');
      if (showTerm3ColPdf) row.push(s.term3Total != null ? s.term3Total : '—');
      row.push(s.cumulative != null ? s.cumulative : '—');
    }
    return row;
  });
  if (subjectRows.length && doc.autoTable) {
    doc.autoTable({
      startY: y,
      head: [baseHead.concat(cumHead)],
      body: subjectRows,
      styles: { fontSize: 7.5, cellPadding: 1.5 },
      headStyles: { fillColor: [45,55,72], textColor: 255, fontSize: 7.5 },
      columnStyles: { 0:{cellWidth:14}, 1:{cellWidth:100}, 7:{cellWidth:20} }
    });
    y = doc.lastAutoTable.finalY + 10;
  } else if (!subjectRows.length) {
    doc.setFontSize(10); doc.setTextColor(150,150,150);
    doc.text('No scores have been entered for any subject this term.', pageW/2, y, { align: 'center' });
    y += 14;
  }

  const affItems = AFFECTIVE_ITEMS.map(([k,l]) => [l, ratingLabel(r.affective, k)]);
  const psyItems = PSYCHOMOTOR_ITEMS.map(([k,l]) => [l, ratingLabel(r.psychomotor, k)]);

  if (doc.autoTable) {
    doc.autoTable({
      startY: y,
      head: [['Affective Domain','Rating','Psychomotor Domain','Rating']],
      body: affItems.map((a, i) => [a[0], a[1], psyItems[i] ? psyItems[i][0] : '', psyItems[i] ? psyItems[i][1] : '']),
      styles: { fontSize: 8, cellPadding: 1.5 },
      headStyles: { fillColor: [45,55,72], textColor: 255, fontSize: 8 },
      columnStyles: { 0:{cellWidth:110}, 1:{cellWidth:40}, 2:{cellWidth:110}, 3:{cellWidth:40} }
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  const cLine = [];
  if (r.term1Average != null) cLine.push('Term 1: ' + r.term1Average + '%');
  if (r.term2Average != null) cLine.push('Term 2: ' + r.term2Average + '%');
  if (r.term3Average != null) cLine.push('Term 3: ' + r.term3Average + '%');
  if (r.cumulativeAverage != null) cLine.push('Cumulative: ' + r.cumulativeAverage + '%');
  if (r.term !== 'Term1' && cLine.length) {
    doc.setFontSize(9); doc.setTextColor(60,60,60);
    doc.text(cLine.join('   ·   '), pageW/2, y, { align: 'center' });
    y += 14;
  }

  doc.setFontSize(9); doc.setTextColor(0,0,0); doc.setFont(undefined, 'bold');
  doc.text("CLASS TEACHER'S REMARK:", margin, y);
  doc.setFont(undefined, 'normal');
  const trLines = doc.splitTextToSize(r.teacherRemark || '—', pageW - margin*2 - 110);
  doc.text(trLines, margin + 105, y);
  y += Math.max(14, trLines.length * 10 + 4);

  doc.setFont(undefined, 'bold');
  doc.text("PRINCIPAL'S REMARK:", margin, y);
  doc.setFont(undefined, 'normal');
  const prLines = doc.splitTextToSize(r.principalRemark || '—', pageW - margin*2 - 110);
  doc.text(prLines, margin + 105, y);
  y += Math.max(14, prLines.length * 10 + 4);

  const baseY = Math.min(y + 20, doc.internal.pageSize.getHeight() - 60);
  const half = pageW / 2;
  doc.setDrawColor(80,80,80); doc.setLineWidth(0.3);
  doc.line(margin, baseY + 30, half - 20, baseY + 30);
  doc.line(half + 20, baseY + 30, pageW - margin, baseY + 30);
  doc.setFontSize(8);
  doc.text('CLASS TEACHER SIGNATURE', (margin + half - 20)/2, baseY + 40, { align:'center' });
  doc.text((t.principalName || 'PRINCIPAL') + ' (SIGNATURE)', (half + 20 + pageW - margin)/2, baseY + 40, { align:'center' });
}

async function exportClassPDF() {
  Object.keys(_bulkCache).forEach(k => delete _bulkCache[k]);
  const className = q('pdfClass').value, term = q('pdfTerm').value, year = q('pdfYear').value.trim();
  if (!className || !term || !year) return toast('Pick class/term/year', 'err');
  const status = q('pdfStatus');
  status.textContent = 'Building…';
  try {
    const students = await api('getStudents', { className });
    if (!students.length) { status.textContent = 'No students.'; return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    for (let i = 0; i < students.length; i++) {
      const st = students[i];
      status.textContent = `Building ${i+1}/${students.length} — ${st.name}`;
      const r = await buildReportPayload(className, st.student_id, st.name, term, year);
      if (i > 0) doc.addPage();
      pdfRenderPage(doc, r);
    }
    doc.save(`${className}_${term}_${year.replace(/[^\w]/g,'_')}.pdf`);
    status.textContent = `Done — ${students.length} student page(s).`;
    toast('PDF saved', 'ok');
  } catch (e) { status.textContent = 'Error: ' + e.message; toast(e.message, 'err'); }
}

async function loadMyAttendance() {

    const linksRes = await attendanceApi('getStaffLinks');
    const myEmail = String(S.user.email || '').toLowerCase();
    const myLink = (linksRes.links || []).find(l => String(l.email || '').toLowerCase() === myEmail);

      box.innerHTML = '<div class="empty">No attendance data available.</div>';
      return;
    }
    const myAid = normAidClient_(myLink.attendanceId);

    /* 2) Pull public data + penalties */
    const [pub, penRes, ratesRes] = await Promise.all([
      attendanceApi('getPublicData'),
      attendanceApi('getPenalties'),
      attendanceApi('getPenaltyRates')
    ]);
    const settings = pub.settings || {};
    const start = Number(settings.start) || 480;
    const grace = Number(settings.grace) || 10;
    const cutoff = Number(settings.halfdayCutoff) || 720;
    const halfSet = new Set((pub.halfDayList || []).map(normAidClient_));
    const isHalf = halfSet.has(myAid);

    const month = q('myAttMonth').value;
    const mine = (pub.records || []).filter(r =>
      normAidClient_(r.id) === myAid && (!month || r.date.slice(0, 7) === month)
    );

    /* 3) Group by day */
    const byDay = {};
    mine.forEach(r => {
      if (!byDay[r.date]) byDay[r.date] = [];
      byDay[r.date].push(r);
    });
    const days = Object.keys(byDay).sort();

    if (!days.length) {
      sum.textContent = 'No clock-ins for ' + (month || 'any month') + '.';
      box.innerHTML = '<div class="empty">Nothing recorded.</div>';
    } else {
      let present = 0, late = 0, half = 0;
      const rows = days.map(d => {
        const times = byDay[d].map(r => r.timeMin).sort((a,b)=>a-b);
        const first = Math.min(...times);
        const last = Math.max(...times);
        let status, lateMin = 0;
        if (isHalf) {
          if (first <= start + grace || last >= cutoff) { status = 'present'; present++; }
          else { status = 'halfday'; half++; }
        } else {
          if (first <= start + grace) { status = 'present'; present++; }
          else { status = 'late'; late++; lateMin = first - (start + grace); }
        }
        const color = status === 'present' ? '#15803d' : status === 'late' ? '#b45309' : '#0756a8';
        const label = status === 'present' ? 'Present' : status === 'late' ? 'Late' : 'Half-day';
        const insStr = byDay[d].map(r => r.timeStr).join(' → ');
        return `<tr>
          <td>${esc(d)}</td>
          <td>${esc(insStr)}</td>
          <td style="color:${color};font-weight:700">${label}</td>
          <td style="text-align:right">${lateMin ? '+' + lateMin + ' min late' : '—'}</td>
        </tr>`;
      }).join('');

      sum.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
          <div class="stat-box" style="background:#f0fdf4"><div class="label" style="color:#166534">Present</div><div class="value" style="color:#15803d">${present}</div></div>
          <div class="stat-box" style="background:#fef3c7"><div class="label" style="color:#92400e">Late</div><div class="value" style="color:#b45309">${late}</div></div>
          <div class="stat-box" style="background:#e0e7ff"><div class="label" style="color:#0756a8">Half-day</div><div class="value" style="color:#0756a8">${half}</div></div>
          <div class="stat-box" style="background:#faf7f2"><div class="label" style="color:#6b4423">ID</div><div class="value" style="color:#6b4423;font-size:16px">${esc(myLink.attendanceId)}</div></div>
        </div>`;
      box.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Clock-ins</th><th>Status</th><th style="text-align:right">Lateness</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        <p class="portal-note" style="margin-top:12px">
          Expected in by <strong>${fmtMin_(start + grace)}</strong> (start ${fmtMin_(start)} + ${grace} min grace).
          ${isHalf ? '<strong>You are flagged as half-day.</strong>' : ''}
        </p>`;
    }

    /* 4) Penalties for this month */
    const penalties = (penRes.penalties || []).filter(p =>
      String(p.email || '').toLowerCase() === myEmail && (!month || String(p.date || '').slice(0, 7) === month)
    );
    if (penCard && penalties.length) {
      penCard.style.display = 'block';
      const rateLate = Number(ratesRes.rates.late) || 0;
      const rateAbs  = Number(ratesRes.rates.absent) || 0;
      const rateHalf = Number(ratesRes.rates.halfday) || 0;
      let total = 0;
      let countLate = 0, countAbs = 0, countHalf = 0;
      const pr = penalties.map(p => {
        const amt = Number(p.amount) || 0;
        total += amt;
        if (p.type === 'late') countLate++;
        else if (p.type === 'absent') countAbs++;
        else if (p.type === 'halfday') countHalf++;
        return `<tr>
          <td>${esc(p.date)}</td>
          <td><span class="badge ${p.type === 'late' ? 'warn' : p.type === 'absent' ? 'err' : 'info'}">${esc(p.type)}</span></td>
          <td>${esc(p.reason || '')}</td>
          <td style="text-align:right"><strong>₦${amt.toLocaleString()}</strong></td>
        </tr>`;
      }).join('');
      q('myPenaltyBox').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
          <div class="stat-box" style="background:#fef2f2"><div class="label" style="color:#991b1b">Late</div><div class="value" style="color:#b91c1c;font-size:16px">${countLate} × ₦${rateLate.toLocaleString()}</div></div>
          <div class="stat-box" style="background:#fef2f2"><div class="label" style="color:#991b1b">Absent</div><div class="value" style="color:#b91c1c;font-size:16px">${countAbs} × ₦${rateAbs.toLocaleString()}</div></div>
          <div class="stat-box" style="background:#e0e7ff"><div class="label" style="color:#0756a8">Half-day</div><div class="value" style="color:#0756a8;font-size:16px">${countHalf} × ₦${rateHalf.toLocaleString()}</div></div>
          <div class="stat-box" style="background:#fef2f2"><div class="label" style="color:#991b1b">Total</div><div class="value" style="color:#7f1d1d">₦${total.toLocaleString()}</div></div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Type</th><th>Reason</th><th style="text-align:right">Amount</th></tr></thead>
          <tbody>${pr}</tbody></table></div>
        <p class="portal-note" style="margin-top:10px">
          This amount will be reflected in your ${esc(month || 'monthly')} salary.
          Contact the admin if you believe a deduction is incorrect.
        </p>`;
    } else if (penCard) {
      penCard.style.display = 'block';
      q('myPenaltyBox').innerHTML = '<div class="empty">No deductions recorded for this month. 🎉</div>';
    }
  } catch (e) {
    sum.textContent = 'Error: ' + e.message;
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* Attendance Summary — whole school (officers + admin) */
async function loadAttendanceSummary() {
  const month = q('sumMonth').value;
  const box = q('sumBox');
  if (!month) return toast('Choose a month', 'err');
  box.innerHTML = 'Loading…';
  try {
    const [pub, linksRes, penRes] = await Promise.all([
      attendanceApi('getPublicData'),
      attendanceApi('getStaffLinks'),
      attendanceApi('getPenalties').catch(() => ({ penalties: [] }))
    ]);
    const linkMap = {};
    (linksRes.links || []).forEach(l => { linkMap[normAidClient_(l.attendanceId)] = l; });

    const settings = pub.settings || {};
    const start = Number(settings.start) || 480;
    const grace = Number(settings.grace) || 10;
    const cutoff = Number(settings.halfdayCutoff) || 720;
    const workDays = String(settings.workDays || '1,2,3,4,5').split(',').map(s => Number(s.trim()));
    const halfSet = new Set((pub.halfDayList || []).map(normAidClient_));
    const hidden = new Set((pub.hidden || []).map(String));

    /* Count working days elapsed */
    const [yr, mo] = month.split('-').map(Number);
    const today = new Date();
    const isCurrent = (today.getFullYear() === yr && today.getMonth() === mo - 1);
    const lastDay = isCurrent ? today.getDate() : new Date(yr, mo, 0).getDate();
    let workingDays = 0;
    for (let d = 1; d <= lastDay; d++) {
      if (workDays.indexOf(new Date(yr, mo - 1, d).getDay()) !== -1) workingDays++;
    }

    /* Group clock-ins */
    const perStaff = {};
    (pub.records || []).forEach(r => {
      if (r.date.slice(0, 7) !== month) return;
      if (hidden.has(String(r.id))) return;
      const aid = normAidClient_(r.id);
      const link = linkMap[aid];
      if (!link) return;
      const key = String(link.email || '').toLowerCase();
      if (!perStaff[key]) perStaff[key] = { name: link.name || '', email: key, days: {} };
      if (!perStaff[key].days[r.date]) perStaff[key].days[r.date] = [];
      perStaff[key].days[r.date].push(r.timeMin);
    });

    /* Penalties by email */
    const penByEmail = {};
    (penRes.penalties || []).forEach(p => {
      if (String(p.date || '').slice(0, 7) !== month) return;
      const email = String(p.email || '').toLowerCase();
      if (!penByEmail[email]) penByEmail[email] = { total: 0, late: 0, absent: 0, halfday: 0 };
      const amt = Number(p.amount) || 0;
      penByEmail[email].total += amt;
      if (p.type === 'late') penByEmail[email].late += amt;
      else if (p.type === 'absent') penByEmail[email].absent += amt;
      else if (p.type === 'halfday') penByEmail[email].halfday += amt;
    });

    /* Build per-teacher rows */
    const rows = Object.keys(perStaff).map(email => {
      const s = perStaff[email];
      const aid = Object.keys(linkMap).find(k => String(linkMap[k].email).toLowerCase() === email);
      const isHalf = halfSet.has(aid);
      let present = 0, late = 0, half = 0;
      Object.keys(s.days).forEach(date => {
        const d = new Date(date + 'T00:00:00');
        if (workDays.indexOf(d.getDay()) === -1) return;
        const times = s.days[date];
        const first = Math.min(...times);
        const last = Math.max(...times);
        if (isHalf) {
          if (first <= start + grace || last >= cutoff) present++;
          else half++;
        } else {
          if (first <= start + grace) present++;
          else late++;
        }
      });
      const absent = Math.max(0, workingDays - (present + late + half));
      const pen = penByEmail[email] || { total: 0 };
      return { email, name: s.name, present, late, halfDay: half, absent, workingDays, penTotal: pen.total };
    }).sort((a, b) => a.name.localeCompare(b.name));

    if (!rows.length) {
      box.innerHTML = '<div class="empty">No linked staff clock-ins for this month.</div>';
      return;
    }

    const totals = rows.reduce((a, r) => ({
      present: a.present + r.present, late: a.late + r.late, half: a.half + r.halfDay,
      absent: a.absent + r.absent, pen: a.pen + r.penTotal
    }), { present: 0, late: 0, half: 0, absent: 0, pen: 0 });

    box.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px">
        <div class="stat-box" style="background:#f0fdf4"><div class="label" style="color:#166534">Present</div><div class="value" style="color:#15803d">${totals.present}</div></div>
        <div class="stat-box" style="background:#fef3c7"><div class="label" style="color:#92400e">Late</div><div class="value" style="color:#b45309">${totals.late}</div></div>
        <div class="stat-box" style="background:#e0e7ff"><div class="label" style="color:#0756a8">Half-day</div><div class="value" style="color:#0756a8">${totals.half}</div></div>
        <div class="stat-box" style="background:#fee2e2"><div class="label" style="color:#991b1b">Absent</div><div class="value" style="color:#b91c1c">${totals.absent}</div></div>
        <div class="stat-box" style="background:#faf7f2"><div class="label" style="color:#6b4423">Working Days</div><div class="value" style="color:#6b4423">${workingDays}</div></div>
        <div class="stat-box" style="background:#fef2f2"><div class="label" style="color:#991b1b">Penalties</div><div class="value" style="color:#7f1d1d;font-size:16px">₦${totals.pen.toLocaleString()}</div></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Staff</th>
          <th style="text-align:center">Present</th>
          <th style="text-align:center">Late</th>
          <th style="text-align:center">Half-day</th>
          <th style="text-align:center">Absent</th>
          <th style="text-align:center">Attendance %</th>
          <th style="text-align:right">Penalty</th>
        </tr></thead>
        <tbody>${rows.map(r => {
          const attended = r.present + r.late + r.halfDay;
          const pct = r.workingDays ? Math.round(attended / r.workingDays * 100) : 0;
          const color = pct >= 90 ? '#15803d' : pct >= 75 ? '#0756a8' : pct >= 60 ? '#b45309' : '#b91c1c';
          return `<tr>
            <td><strong>${esc(r.name || r.email)}</strong><br><small style="color:var(--muted)">${esc(r.email)}</small></td>
            <td style="text-align:center;color:#15803d;font-weight:700">${r.present}</td>
            <td style="text-align:center;color:#b45309;font-weight:700">${r.late}</td>
            <td style="text-align:center;color:#0756a8;font-weight:700">${r.halfDay}</td>
            <td style="text-align:center;color:#b91c1c;font-weight:700">${r.absent}</td>
            <td style="text-align:center;font-weight:800;color:${color}">${pct}%</td>
            <td style="text-align:right">₦${r.penTotal.toLocaleString()}</td>
          </tr>`;
        }).join('')}</tbody></table></div>
      <p class="portal-note" style="margin-top:10px">
        ${rows.length} staff · ${workingDays} working days in ${esc(month)}.
        Absence = working days − recorded attendance. Verify against approved leave before acting.
      </p>`;
  } catch (e) {
    box.innerHTML = `<span style="color:#991b1b">${esc(e.message)}</span>`;
  }
}

/* Staff Attendance — full grid (admin only) */
async function loadStaffAttendanceGrid() {
  const box = q('attRecords');
  const sum = q('attSummary');
  if (!box) return;
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const [pub, linksRes] = await Promise.all([
      attendanceApi('getPublicData'),
      attendanceApi('getStaffLinks')
    ]);
    const settings = pub.settings || {};
    const start = Number(settings.start) || 480;
    const grace = Number(settings.grace) || 10;
    const cutoff = Number(settings.halfdayCutoff) || 720;
    const halfSet = new Set((pub.halfDayList || []).map(normAidClient_));
    const hidden = new Set((pub.hidden || []).map(String));
    const linkMap = {};
    (linksRes.links || []).forEach(l => { linkMap[normAidClient_(l.attendanceId)] = l; });

    const month = q('attMonth').value;
    const date  = q('attDate').value;
    const filter = q('attStaffFilter').value.trim().toLowerCase();

    /* Announcement banner */
    q('attAnnouncement').innerHTML = (pub.announcement && pub.announcement.enabled === 'yes' && pub.announcement.text)
      ? `<div class="ann-card"><div class="msg">📣 ${esc(pub.announcement.text)}</div></div>` : '';

    /* Filter records */
    const recs = (pub.records || []).filter(r => {
      if (date && r.date !== date) return false;
      if (month && r.date.slice(0, 7) !== month) return false;
      if (hidden.has(String(r.id))) return false;
      const aid = normAidClient_(r.id);
      const link = linkMap[aid];
      if (filter) {
        const text = ((link && (link.name + ' ' + link.email)) || '') + ' ' + String(r.id);
        if (text.toLowerCase().indexOf(filter) === -1) return false;
      }
      return true;
    });

    if (!recs.length) {
      sum.textContent = 'No records for the chosen filters.';
      box.innerHTML = '<div class="empty">Nothing to show.</div>';
    } else {
      /* Group per (staff,date) */
      const perKey = {};
      recs.forEach(r => {
        const aid = normAidClient_(r.id);
        const link = linkMap[aid];
        const key = (link ? link.email : 'unknown:' + aid) + '|' + r.date;
        if (!perKey[key]) perKey[key] = {
          email: link ? link.email : '', name: link ? link.name : r.name,
          aid: r.id, date: r.date, times: []
        };
        perKey[key].times.push(r.timeMin);
      });

      const dates = Array.from(new Set(recs.map(r => r.date))).sort();
      const staffKeys = Array.from(new Set(recs.map(r => {
        const aid = normAidClient_(r.id);
        return linkMap[aid] ? String(linkMap[aid].email).toLowerCase() : 'unknown:' + r.id;
      })));

      let present = 0, late = 0, absent = 0, half = 0;
      const staffMap = {};
      perKey && Object.values(perKey).forEach(row => {
        const sid = row.email || ('unknown:' + row.aid);
        if (!staffMap[sid]) staffMap[sid] = { name: row.name, email: row.email, aid: row.aid, days: {} };
        staffMap[sid].days[row.date] = row.times;
      });

      const staffRows = Object.keys(staffMap).sort().map(sid => {
        const s = staffMap[sid];
        const cells = dates.map(d => {
          const times = s.days[d];
          if (!times || !times.length) { absent++; return `<td style="text-align:center;color:#b91c1c;font-weight:700">✗</td>`; }
          const first = Math.min(...times);
          const last = Math.max(...times);
          if (halfSet.has(normAidClient_(s.aid))) {
            if (first <= start + grace || last >= cutoff) { present++; return `<td style="text-align:center;color:#15803d;font-weight:700">✓</td>`; }
            half++; return `<td style="text-align:center;color:#0756a8;font-weight:700">½</td>`;
          }
          if (first <= start + grace) { present++; return `<td style="text-align:center;color:#15803d;font-weight:700">✓</td>`; }
          late++; return `<td style="text-align:center;color:#b45309;font-weight:700">L</td>`;
        }).join('');
        return `<tr>
          <td><strong>${esc(s.name || '—')}</strong><br><small style="color:var(--muted)">${esc(s.email || 'unknown:' + s.aid)}</small></td>
          ${cells}
        </tr>`;
      }).join('');

      sum.innerHTML = `Present <strong style="color:#15803d">${present}</strong> · Late <strong style="color:#b45309">${late}</strong> · Half-day <strong style="color:#0756a8">${half}</strong> · Absent <strong style="color:#b91c1c">${absent}</strong>`;
      box.innerHTML = `<div style="overflow-x:auto"><table>
        <thead><tr>
          <th style="min-width:170px">Staff</th>
          ${dates.map(d => `<th style="text-align:center;font-size:10px;min-width:44px">${d.slice(5)}</th>`).join('')}
        </tr></thead>
        <tbody>${staffRows}</tbody></table></div>
        <p class="portal-note" style="margin-top:12px">✓ on time · <strong>L</strong> late · ½ half-day · ✗ absent. Tolerance: ${grace} min after ${fmtMin_(start)}.</p>`;
    }

    /* Unlinked clock-ins */
    const unmapped = (pub.records || []).filter(r => {
      const aid = normAidClient_(r.id);
      return !linkMap[aid] && !hidden.has(String(r.id));
    }).slice(0, 100);
    if (unmapped.length) {
      q('attUnmapped').innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>Machine ID</th><th>Name</th><th>Date</th><th>Time</th></tr></thead>
        <tbody>${unmapped.map(u => `<tr><td><strong>${esc(u.id)}</strong></td><td>${esc(u.name)}</td><td>${esc(u.date)}</td><td>${esc(u.timeStr)}</td></tr>`).join('')}</tbody></table></div>`;
    } else {
      q('attUnmapped').innerHTML = '<div class="empty">No unlinked clock-ins.</div>';
    }
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    if (sum) sum.textContent = 'Error: ' + e.message;
  }
}

  }

async function loadMyMessages() {
  const box = q('msgHistory'); if (!box) return;
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    /* Admin sees all; teachers see their own — getStaffMessages is admin-only so use adminGetStaffMessages for admin,
       and for teachers we filter by fromEmail on the admin endpoint (blocked) → fallback: use staffSendMessage? 
       Actually the backend's adminGetStaffMessages is admin-only. Teachers can only see their own via the send history list
       we maintain client-side. For simplicity: teachers get a friendly note; admins see everything in "Staff Messages" tab. */
    if (hasRole('admin')) {
      const rows = await api('adminGetStaffMessages');
      if (!rows.length) { box.innerHTML = '<div class="empty">No messages yet.</div>'; return; }
      box.innerHTML = rows.slice(0, 10).map(r => `
        <div class="ann-card">
          <div class="msg">${esc(r.message)}</div>
          <div class="meta">${esc(r.fromEmail)} · ${esc(r.subject || 'No subject')} · ${r.createdAt ? new Date(r.createdAt).toLocaleString() : ''}

async function loadTeacherAcademicSummary(){
 const cls=getClassTeacherClass(),term=q('ctPerfTerm')?.value,assessment=q('ctPerfAssessment')?.value,stats=q('ctPerfStats'),sb=q('ctPerfSubjects'),pb=q('ctPerfStudents');if(!cls||!stats||!sb||!pb)return;
 sb.innerHTML=pb.innerHTML='<div class="empty">Loading class scores…</div>';
 try{
  const [students,subjects,scoreMap]=await Promise.all([api('getStudents',{className:cls}),loadSubjects(cls),api('getClassScores',{className:cls,term})]);
  const val=r=>{if(assessment==='total'){const k=['T1','T2','T3','Exam'];return k.every(x=>r[x]!==''&&r[x]!==null&&r[x]!==undefined&&Number.isFinite(Number(r[x])))?k.reduce((a,x)=>a+Number(r[x]),0):null;}const v=r[assessment];return v===''||v===null||v===undefined||!Number.isFinite(Number(v))?null:Number(v);};
  const subRows=subjects.map(sub=>{const values=students.map(st=>val((scoreMap[st.student_id]||{})[sub]||{})).filter(v=>v!==null);return {sub,values,avg:values.length?values.reduce((a,b)=>a+b,0)/values.length:null,hi:values.length?Math.max(...values):null,lo:values.length?Math.min(...values):null,missing:students.length-values.length};});
  const studRows=students.map(st=>{const vs=subjects.map(sub=>val((scoreMap[st.student_id]||{})[sub]||{}));const good=vs.filter(v=>v!==null);return {...st,avg:good.length===subjects.length&&subjects.length?good.reduce((a,b)=>a+b,0)/good.length:null,entered:good.length};}).sort((a,b)=>a.avg===null?1:b.avg===null?-1:b.avg-a.avg);
  stats.innerHTML=[['Students',students.length],['Subjects',subjects.length],['Entered scores',subRows.reduce((a,r)=>a+r.values.length,0)],['Missing cells',students.length*subjects.length-subRows.reduce((a,r)=>a+r.values.length,0)]].map(([l,v])=>`<div class="card stat-card"><div class="sub">${l}</div><div class="stat-number">${v}</div></div>`).join('');
  sb.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Subject</th><th>Average</th><th>Highest</th><th>Lowest</th><th>Entered</th><th>Missing</th></tr></thead><tbody>${subRows.map(r=>`<tr><td><strong>${esc(r.sub)}</strong></td><td>${fmtScore(r.avg)}</td><td>${fmtScore(r.hi)}</td><td>${fmtScore(r.lo)}</td><td>${r.values.length}/${students.length}</td><td>${r.missing}</td></tr>`).join('')}</tbody></table></div>`;
  pb.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Rank*</th><th>Student</th><th>Average</th><th>Subjects entered</th><th>Status</th></tr></thead><tbody>${studRows.map((r,i)=>`<tr><td>${r.avg===null?'—':i+1}</td><td class="br-name">${esc(r.name||'')}</td><td>${fmtScore(r.avg)}</td><td>${r.entered}/${subjects.length}</td><td><span class="status-pill ${r.entered===subjects.length?'status-ok':'status-warn'}">${r.entered===subjects.length?'Complete':'Incomplete'}</span></td></tr>`).join('')}</tbody></table></div><p class="sub">*This is a selected-assessment snapshot, not the official published class position.</p>`;
 }catch(e){stats.innerHTML='';sb.innerHTML=pb.innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
