async function addStudentsWithDetection(className, lines) {
  const preChecks = [];
  for (const line of lines) {
    const parts = line.split(',');
    const typedId = parts.length > 1 ? parts[0].trim() : '';
    const typedName = parts.length > 1 ? parts.slice(1).join(',').trim() : line.trim();
    if (!typedName) continue;
    try {
      const check = await api('checkNewStudent', { className, studentId: typedId, name: typedName });
      preChecks.push({ line, typedId, typedName, check });
    } catch (e) {
      toast('Pre-check failed: ' + e.message, 'err');
      return;
    }
  }

  const warnings = [];
  for (const p of preChecks) {
    if (p.check.idInThisClass) {
      warnings.push(`ID "${p.typedId}" already exists in ${className}. Skipped.`);
    }
    if (p.check.sameNameInOtherClasses && p.check.sameNameInOtherClasses.length) {
      const m = p.check.sameNameInOtherClasses[0];
      const ok = confirm(
        `"${p.typedName}" matches "${m.name}" (${m.studentId}) in ${m.className}.\n\n` +
        `Same student? Click OK to copy their previous scores into ${className}. ` +
        `Click Cancel to add as a NEW student with no previous scores.`
      );
      p.willCopyFrom = ok ? m : null;
    }
  }

  if (warnings.length) {
    const proceed = confirm(warnings.join('\n\n') + '\n\nContinue adding the rest?');
    if (!proceed) return;
  }

  const filtered = preChecks.filter(p => !p.check.idInThisClass).map(p => p.line);
  if (!filtered.length) {
    toast('Nothing to add — all had duplicate IDs', 'err');
    return;
  }

  const r = await api('addStudentsBulk', { className, lines: filtered });
  toast(`Added ${r.count}${r.skipped && r.skipped.length ? ' · skipped ' + r.skipped.length : ''}`, 'ok');

  const toCopy = preChecks.filter(p => p.willCopyFrom && !p.check.idInThisClass);
  if (toCopy.length) {
    const students = await api('getStudents', { className });
    for (const c of toCopy) {
      const row = students.find(s => s.name.trim().toLowerCase() === c.typedName.toLowerCase());
      if (!row) continue;
      try {
        await api('copyStudentFromClass', {
          fromClass: c.willCopyFrom.className,
          fromId: c.willCopyFrom.studentId,
          toClass: className,
          toId: row.student_id
        });
      } catch (e) { toast('Copy failed for ' + c.typedName + ': ' + e.message, 'err'); }
    }
    toast(`Copied previous scores for ${toCopy.length} student(s)`, 'ok');
  }

  if (hasRole('admin')) loadTeachers();
  else if (typeof ctLoadStudents === 'function') ctLoadStudents();
}

async function ctLoadScores() {

    ]);
    if (!students.length) { box.innerHTML = '<div class="empty">No students.</div>'; return; }
    const map = {}; scores.forEach(s => map[s.student_id] = s);
    box.innerHTML = `<h2>${esc(subject)} · ${esc(term)}</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Student</th><th>CA 1</th><th>CA 2</th><th>CA 3</th><th>Exam</th><th>Total</th></tr></thead>
        <tbody>${students.map(st => {
          const sc = map[st.student_id] || {};
          const total = (Number(sc.T1)||0)+(Number(sc.T2)||0)+(Number(sc.T3)||0)+(Number(sc.Exam)||0);
          return `<tr data-student="${esc(st.student_id)}">
            <td><strong>${esc(st.name)}</strong></td>
            ${['T1','T2','T3','Exam'].map(f => `<td><input class="score-input" type="number" min="0" max="${f==='Exam'?70:10}" data-f="${f}" value="${sc[f] ?? ''}"></td>`).join('')}
            <td style="font-weight:700;color:var(--blue)" class="total">${total || ''}</td>
          </tr>`;
        }).join('')}</tbody></table></div>
      <div class="row" style="margin-top:12px;align-items:flex-end"><div><label>Assessment to submit and lock</label><select id="ctSubmitAssessment"><option value="T1">T1 · CA 1</option><option value="T2">T2 · CA 2</option><option value="T3">T3 · CA 3</option><option value="Exam">Exam</option></select></div><button class="ok" onclick="ctSubmit('${esc(subject)}','${esc(term)}',q('ctSubmitAssessment').value)">Submit &amp; Lock Selected Assessment</button></div><p class="sub">Each assessment is locked independently. Other assessment columns remain editable until submitted.</p>`;
    box.querySelectorAll('input.score-input').forEach(inp => {
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === 'ArrowDown') { ev.preventDefault(); const all=[...box.querySelectorAll('input.score-input')]; const i=all.indexOf(inp); if(all[i+1]) all[i+1].focus(); } else if(ev.key === 'ArrowUp') { ev.preventDefault(); const all=[...box.querySelectorAll('input.score-input')]; const i=all.indexOf(inp); if(all[i-1]) all[i-1].focus(); } });
      inp.addEventListener('change', () => ctSaveCell(inp, subject, term));
    });
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }

async function ctSaveCell(inp, subject, term) {
  const tr = inp.closest('tr');
  const max = inp.dataset.f === 'Exam' ? 70 : 10, value = Number(inp.value);
  if (inp.value !== '' && (!Number.isFinite(value) || value < 0 || value > max)) { inp.classList.add('score-invalid'); toast(`Enter a score between 0 and ${max}.`, 'err'); inp.focus(); return; }
  inp.classList.remove('score-invalid');
  try {
    await api('saveScore', { className: getClassTeacherClass(), subject, term, field: inp.dataset.f, studentId: tr.dataset.student, value: inp.value });
    inp.classList.add('score-saved'); setTimeout(() => { inp.classList.remove('score-saved'); }, 1000);
    const total = Array.from(tr.querySelectorAll('input')).reduce((a,i)=>a+(Number(i.value)||0),0);
    tr.querySelector('.total').textContent = total || '';
  } catch (e) { toast(e.message, 'err'); inp.style.background = '#fef2f2'; }
}
async function ctSubmit(subject, term, assessment) {
  if (!assessment) return toast('Choose an assessment to submit.','err');
  if (!confirm(`Submit & lock ${assessment} for ${subject} / ${term}? Only this assessment will be locked.`)) return;
  try { await api('submitScores', { className: getClassTeacherClass(), subject, term, assessment, academicYear: q('ctYear')?.value || q('ctPerfYear')?.value || '2026/2027' }); toast(`${assessment} locked`, 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}

async function stSaveCell(inp, className, subject, term) {
  const tr = inp.closest('tr');
  const max = inp.dataset.f === 'Exam' ? 70 : 10, value = Number(inp.value);
  if (inp.value !== '' && (!Number.isFinite(value) || value < 0 || value > max)) { inp.classList.add('score-invalid'); toast(`Enter a score between 0 and ${max}.`, 'err'); inp.focus(); return; }
  inp.classList.remove('score-invalid');
  try {
    await api('saveScore', { className, subject, term, field: inp.dataset.f, studentId: tr.dataset.student, value: inp.value });
    inp.classList.add('score-saved'); setTimeout(() => { inp.classList.remove('score-saved'); }, 1000);
    const total = Array.from(tr.querySelectorAll('input')).reduce((a,i)=>a+(Number(i.value)||0),0);
    tr.querySelector('.total').textContent = total || '';
  } catch (e) { toast(e.message, 'err'); inp.style.background = '#fef2f2'; }
}
async function stSubmit(className, subject, term, assessment) {
  if (!assessment) return toast('Choose an assessment to submit.','err');
  if (!confirm(`Submit & lock ${assessment} for ${subject} / ${className} / ${term}? Only this assessment will be locked.`)) return;
  try { await api('submitScores', { className, subject, term, assessment, academicYear: q('stYear')?.value || '2026/2027' }); toast(`${assessment} locked`, 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}
async function stLoadHistory() {
  const box = q('stHistory'); if (!box) return;
  try {
    const rows = await api('getSubmissions');
    if (!rows.length) { box.innerHTML = '<div class="empty">No submissions.</div>'; return; }
    box.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Class</th><th>Subject</th><th>Term</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.class)}</td><td>${esc(r.subject)}</td><td>${esc(r.term)}</td><td><span class="badge">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table></div>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function filterTableRows(containerId, query) {
  const root = q(containerId); if (!root) return;
  const needle = String(query || '').trim().toLowerCase();
  root.querySelectorAll('tbody tr').forEach(tr => {
    tr.style.display = !needle || tr.textContent.toLowerCase().includes(needle) ? '' : 'none';
  });
}

function renderParentReport(r) {
  const t = r.template || {};

  const schoolName = esc(t.schoolName || 'GREATER TOMORROW MODEL COLLEGE');

  const logo = t.logoUrl
    ? `<img src="${esc(t.logoUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:6px" alt="">`
    : `<div style="font-family:Georgia,serif;font-size:30px;color:#0756a8;font-weight:900">G</div>`;

  function hasAnyScoreInCurrentTerm(s) {
    return ['T1','T2','T3','Exam'].some(function (f) {
      const v = s[f];
      return v !== '' && v !== null && v !== undefined && isFinite(Number(v));
    });
  }
  const visibleSubjects = (r.subjects || []).filter(hasAnyScoreInCurrentTerm);

  const completeVisible = visibleSubjects.filter(s => s.total !== null);
  const totalObtainedVisible = completeVisible.reduce((a, s) => a + (Number(s.total) || 0), 0);
  const totalObtainableVisible = visibleSubjects.length * 100;
  const overallPctVisible = (completeVisible.length === visibleSubjects.length && visibleSubjects.length)
    ? Math.round(totalObtainedVisible / totalObtainableVisible * 100 * 100) / 100
    : null;

  const showTests = t.showTests !== false;
  const showExam  = t.showExam !== false;
  const showTotals = t.showSubjectTotals !== false;
  const showGrade  = t.showGrade !== false;
  const showCumulativeCols = (r.term === 'Term2' || r.term === 'Term3');
  const showTerm3Col       = (r.term === 'Term3');

  const cols = ['<th>Subject</th>'];
  if (showTests) cols.push('<th style="text-align:center">CA 1</th><th style="text-align:center">CA 2</th><th style="text-align:center">CA 3</th>');

  if (showExam) cols.push('<th style="text-align:center">Exam</th>');
  if (showTotals) cols.push('<th style="text-align:center">Total</th>');
  if (showCumulativeCols) cols.push('<th style="text-align:center">T1 Total</th>');
  if (showTerm3Col) cols.push('<th style="text-align:center">T2 Total</th>');
  if (showGrade) cols.push('<th style="text-align:center">Grade</th>');

function printCurrentResult() {
  const report = q('reportCard');
  if (!report) { toast('Load a result before printing.', 'err'); return; }
  const oldZoom = report.style.zoom;
  // Fit the report to the A4 portrait printable area before opening print preview.
  const width = Math.max(report.scrollWidth || 0, report.getBoundingClientRect().width || 0);
  const height = Math.max(report.scrollHeight || 0, report.getBoundingClientRect().height || 0);
  const scale = Math.min(1, 760 / Math.max(width, 1), 1050 / Math.max(height, 1));
  report.style.zoom = String(Math.max(0.42, scale));
  const restore = () => { report.style.zoom = oldZoom; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
  setTimeout(restore, 1200);
}

async function downloadCurrentReportPDF() {
  const report = q('reportCard');
  if (!report || !window.__CURRENT_RESULT) {
    toast('Load a student result before downloading the PDF.', 'err');
    return;
  }
  if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
    toast('PDF tools did not load. Check your internet connection and try again.', 'err');
    return;
  }
  const btn = document.querySelector('button[onclick="downloadCurrentReportPDF()"]');
  const oldText = btn ? btn.textContent : '';
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Preparing PDF…'; }
    const canvas = await window.html2canvas(report, {
      scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false,
      windowWidth: Math.max(report.scrollWidth, report.clientWidth),
      onclone: clonedDoc => {
        const cloned = clonedDoc.getElementById('reportCard');
        if (cloned) {
          cloned.style.width = '1200px';
          cloned.style.maxWidth = 'none';
          cloned.style.boxShadow = 'none';
          cloned.style.borderRadius = '0';
        }
      }
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4', compress: true });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 14;
    const availableW = pageW - margin * 2;
    const availableH = pageH - margin * 2;
    const ratio = Math.min(availableW / canvas.width, availableH / canvas.height);
    const imageW = canvas.width * ratio;
    const imageH = canvas.height * ratio;
    const x = (pageW - imageW) / 2;
    const y = (pageH - imageH) / 2;
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', x, y, imageW, imageH, undefined, 'FAST');
    const ward = window.__CURRENT_WARD || {};
    const studentName = (ward.studentName || window.__CURRENT_RESULT.student?.name || 'Student').replace(/[^\w-]+/g, '_');
    const term = (q('pTerm')?.value || window.__CURRENT_RESULT.term || 'Term').replace(/[^\w-]+/g, '_');
    const year = (q('pYear')?.value || window.__CURRENT_RESULT.academicYear || '').replace(/[^\w-]+/g, '_');
    pdf.save(`${studentName}_${term}_${year}_Result.pdf`);
    toast('Result PDF downloaded (single A4 landscape page).', 'ok');
  } catch (e) {
    console.error(e);
    toast('Could not create the PDF. Try again or use Print > Save as PDF.', 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = oldText || '⬇ Download Result PDF (A4)'; }
  }
}

}

  const annual=`<div class="card"><h2>Year-to-Date Subject Performance</h2><div class="table-wrap"><table id="parentAnnualTable"><thead><tr><th>Subject</th><th>Terms with Scores</th><th>Year Average</th><th>Best</th><th>Lowest</th></tr></thead><tbody>${(data.subjectYearSummary||[]).map(r=>`<tr><td><strong>${esc(r.subject)}</strong></td><td>${r.termsWithScores}</td><td>${fmtScore(r.yearAverage)}</td><td>${fmtScore(r.best)}</td><td>${fmtScore(r.weakest)}</td></tr>`).join('')}</tbody></table></div><button class="sec" onclick="exportTableCSV('parentAnnualTable','GTMC_Year_Performance.csv')">Export Annual Summary</button></div>`;

 }catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;}

/* ---------- 2. Report card (template layout, your scoring logic) ---------- */
function gtmcCardHTML(r, withId) {
  const t = r.template || {}, cal = r.calendar || {}, d = r.domains || {};
  const n = v => (v === '' || v == null || !isFinite(Number(v))) ? null : Number(v);
  const f = v => v == null ? '—' : v;
  const subs = (r.subjects || []).filter(s => ['T1', 'T2', 'T3', 'Exam'].some(k => n(s[k]) !== null));
  const caOf = s => {
    const a = [s.T1, s.T2, s.T3].map(n);
    return s.caTotal ?? s.testsTotal ?? (a.some(x => x !== null) ? a.reduce((x, y) => x + (y || 0), 0) : null);
  };
  const pos = s => s.position ?? s.rank;
  const has = fn => subs.some(s => fn(s) != null);

  const cols = [['S/N', (s, i) => i + 1], ['Subject', s => `<b>${esc(s.subject)}</b>`, 'l']];
  if (t.showTests !== false) cols.push(['CA1<br>(10)', s => s.T1], ['CA2<br>(10)', s => s.T2], ['CA3<br>(10)', s => s.T3], ['CA<br>(30)', caOf]);
  if (t.showExam !== false) cols.push(['Exam<br>(70)', s => s.Exam]);
  if (r.term !== 'Term1' && has(s => s.term1Total)) cols.push(['T1<br>Total', s => s.term1Total]);
  if (r.term === 'Term3' && has(s => s.term2Total)) cols.push(['T2<br>Total', s => s.term2Total]);
  if (t.showSubjectTotals !== false) cols.push(['Total<br>(100)', s => s.total == null ? null : `<b>${s.total}</b>`]);
  if (r.term !== 'Term1' && has(s => s.cumulative)) cols.push(['Cumul.<br>Avg', s => s.cumulative]);
  if (has(pos)) cols.push(['Position', s => pos(s) == null ? null : esc(pos(s))]);
  if (t.showGrade !== false) cols.push(['Grade', s => s.grade ? `<b>${esc(s.grade)}</b>` : null]);

  const body = subs.map((s, i) => '<tr>' + cols.map(c => `<td${c[2] ? ' class="' + c[2] + '"' : ''}>${f(c[1](s, i))}</td>`).join('') + '</tr>').join('')
    || `<tr><td colspan="${cols.length}" style="padding:14px;font-style:italic;color:#6b7280">No scores have been entered for any subject this term.</td></tr>`;

  const done = subs.filter(s => s.total != null);
  const got = done.reduce((a, s) => a + Number(s.total), 0), max = subs.length * 100;
  const avg = (done.length === subs.length && subs.length) ? Math.round(got / max * 10000) / 100 : null;
  const size = r.classSize ?? r.totalStudents ?? r.numberInClass;

  const rate = (o, k) => { const v = Number(o && o[k]); return v >= 1 && v <= 5 ? v : '—'; };
  const dom = (h, items, o) => `<tr><th colspan="2" class="rc-sub">${h}</th></tr>` +
    items.map(([k, l]) => `<tr><td class="l" style="text-transform:none;text-align:left">${esc(l)}</td><td class="c">${rate(o, k)}</td></tr>`).join('');
  const domRows = (t.showAffective !== false ? dom('Affective', AFFECTIVE_ITEMS, r.affective) : '') +
    (t.showPsychomotor !== false ? dom('Psychomotor', PSYCHOMOTOR_ITEMS, r.psychomotor) : '');

  const sc = (t.gradeScale || []).slice().sort((a, b) => Number(b.min) - Number(a.min));
  const opened = cal.days_school_opened || d.days_opened;
  const present = r.daysPresent ?? d.days_present;
  const absent = (Number(opened) && Number(present) >= 0 && present !== '' && present != null) ? Number(opened) - Number(present) : null;

  const sum = [['Marks<br>Obtainable', max || '—'], ['Marks<br>Obtained', done.length ? got : '—'], ['Average', avg == null ? '—' : avg + '%']];
  if (size) sum.push(['No. in<br>Class', size]);
  if (r.term !== 'Term1') [['Term 1', r.term1Average], ['Term 2', r.term2Average], ['Term 3', r.term3Average], ['Cumulative', r.cumulativeAverage]]
    .forEach(([l, v]) => { if (v != null) sum.push([l + '<br>Avg', v + '%']); });

  const P = t.primaryColor || '#0756a8';
  const logo = t.logoUrl ? `<img src="${esc(t.logoUrl)}" alt="" onerror="this.remove()">` : 'G';
  const sig = t.principalSignatureUrl ? `<div><img src="${esc(t.principalSignatureUrl)}" alt="" onerror="this.remove()"><br>${esc(t.principalName || 'Principal')}</div>` : '';
  const stamp = t.schoolStampUrl ? `<div><img src="${esc(t.schoolStampUrl)}" alt="" onerror="this.remove()"></div>` : '';
  const rem = (label, txt) => `<div class="rc-rem"><b>${label}:</b> ${esc(txt || '—')}</div>`;
  const rd = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

  return `<div ${withId ? 'id="reportCard" ' : ''}class="rc" style="--rcp:${esc(P)}">
  <div class="rc-head">
    <div class="rc-logo">${logo}</div>
    <div class="rc-ctr">
      <div class="rc-name">${esc(t.schoolName || 'GREATER TOMORROW MODEL COLLEGE')}</div>
      <div>${esc(t.schoolAddress || 'Embassy Island, Moferere Area, Ado-Ekiti')}</div>
      <div><i>${esc(t.schoolMotto || 'Jesus, Our Teacher')}</i></div>
      <div class="rc-title">TERMINAL REPORT SHEET &mdash; ${esc(r.term)} &middot; ${esc(r.academicYear)} SESSION</div>
    </div>
    <div class="rc-logo" style="visibility:hidden"></div>
  </div>
  <table class="rc-info"><tr>
    <td class="k">Name</td><td class="v">${esc(r.student.name)}</td>
    <td class="k">Adm. No</td><td class="v">${esc(r.student.studentId)}</td>
    <td class="k">Class</td><td class="v">${esc(r.student.className)}</td></tr><tr>
    <td class="k">Session</td><td class="v">${esc(r.academicYear)}</td>
    <td class="k">Term</td><td class="v">${esc(r.term)}</td>
    <td class="k">Subjects</td><td class="v">${subs.length}</td></tr></table>
  <div class="rc-main">
    <div>
      <div class="rc-bar">Cognitive Domain</div>
      <div class="rc-scroll"><table class="rc-t"><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    </div>
    <div class="rc-side">
      ${domRows ? `<div><div class="rc-bar">Affective / Psychomotor Domain</div><table class="rc-t"><tbody>${domRows}</tbody></table><div class="rc-legend">5 = Excellent &middot; 4 = Very Good &middot; 3 = Good &middot; 2 = Fair &middot; 1 = Needs Improvement</div></div>` : ''}
      ${t.showAttendance !== false ? `<div><div class="rc-bar">Attendance Summary</div><table class="rc-t"><tbody>
        <tr><td class="l" style="text-transform:none">No. of days school opened</td><td class="c">${f(opened)}</td></tr>
        <tr><td class="l" style="text-transform:none">No. of times present</td><td class="c">${f(present)}</td></tr>
        <tr><td class="l" style="text-transform:none">No. of times absent</td><td class="c">${f(absent)}</td></tr></tbody></table></div>` : ''}
      ${t.showTermDates !== false ? `<div><div class="rc-bar">Term Schedule</div><table class="rc-t"><tbody>
        <tr><td class="l" style="text-transform:none">School close</td><td class="c">${esc(cal.school_vacates || '—')}</td></tr>
        <tr><td class="l" style="text-transform:none">Next term resumes</td><td class="c">${esc(cal.next_term_begins || '—')}</td></tr></tbody></table></div>` : ''}
      ${(sig || stamp) ? `<div class="rc-sig">${sig}${stamp}</div>` : ''}
    </div>
  </div>
  ${sc.length ? `<div class="rc-bar">Grade Scale</div><table class="rc-t rc-grades"><tbody><tr>${sc.map(g => `<td>${esc(g.grade)}<br><small>${Number(g.min)}&ndash;${Number(g.max)}</small></td>`).join('')}</tr></tbody></table>` : ''}
  <div class="rc-bar">Performance Summary</div>
  <table class="rc-t" style="margin-bottom:6px"><thead><tr>${sum.map(s => `<th>${s[0]}</th>`).join('')}</tr></thead><tbody><tr>${sum.map(s => `<td class="c" style="font-size:13px">${s[1]}</td>`).join('')}</tr></tbody></table>
  ${t.showTeacherRemark !== false ? rem('Form Master/Mistress', r.teacherRemark) : ''}
  ${t.showPrincipalRemark !== false ? rem('Head Teacher', r.principalRemark) : ''}
  ${(t.showAIComment !== false && r.aiComment) ? rem('Comment', r.aiComment) : ''}
  <div class="rc-foot">Report generated on ${rd}. Please contact the school if you notice any discrepancy.</div>
</div>`;
}

/* ---------- 3. PDFs use the same design as the screen ---------- */
async function gtmcAddCardPage(doc, r, first) {
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff';
  host.innerHTML = gtmcCardHTML(r, false);
  document.body.appendChild(host);
  try {
    const c = await window.html2canvas(host, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: 900 });
    if (!first) doc.addPage();
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), m = 18;
    const k = Math.min((W - 2 * m) / c.width, (H - 2 * m) / c.height);
    doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', (W - c.width * k) / 2, m, c.width * k, c.height * k, undefined, 'FAST');
  } finally { host.remove(); }
}

async function gtmcExport(each) {
  Object.keys(_bulkCache).forEach(k => delete _bulkCache[k]);
  const className = q('pdfClass').value, term = q('pdfTerm').value, year = q('pdfYear').value.trim();
  if (!className || !term || !year) return toast('Pick class/term/year', 'err');
  if (!window.html2canvas || !window.jspdf) return toast('PDF tools did not load. Check your internet connection.', 'err');
  const status = q('pdfStatus');
  status.textContent = 'Building…';
  try {
    const students = await api('getStudents', { className });
    if (!students.length) { status.textContent = 'No students.'; return; }
    const { jsPDF } = window.jspdf;
    let doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
    for (let i = 0; i < students.length; i++) {
      const st = students[i];
      status.textContent = `Building ${i + 1}/${students.length} — ${st.name}`;
      const r = await buildReportPayload(className, st.student_id, st.name, term, year);
      r.classSize = students.length;
      if (each) {
        doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
        await gtmcAddCardPage(doc, r, true);
        doc.save(`${className}_${term}_${st.student_id}_${String(st.name).replace(/[^\w]+/g, '_')}.pdf`);
        await new Promise(res => setTimeout(res, 250));
      } else {
        await gtmcAddCardPage(doc, r, i === 0);
      }
    }
    if (!each) doc.save(`${className}_${term}_${year.replace(/[^\w]/g, '_')}.pdf`);
    status.textContent = each ? `Done — ${students.length} files downloaded.` : `Done — ${students.length} student page(s).`;
    toast('PDF saved', 'ok');
  } catch (e) { status.textContent = 'Error: ' + e.message; toast(e.message, 'err'); }
}
exportClassPDF = () => gtmcExport(false);
exportEachStudentPDF = () => gtmcExport(true);

  try {
    const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4', compress: true });
    await gtmcAddCardPage(doc, r, true);
    const clean = v => String(v || '').replace(/[^\w-]+/g, '_');
    doc.save(`${clean((window.__CURRENT_WARD || {}).studentName || r.student?.name || 'Student')}_${clean(r.term)}_${clean(r.academicYear)}_Result.pdf`);
    toast('Result PDF downloaded (A4).', 'ok');
  } catch (e) { console.error(e); toast('Could not create the PDF. Try Print > Save as PDF.', 'err'); }
};

/* ---------- 4. Class teacher: add the missing Test Performance tab ---------- */
const _gtmcRenderClassTeacher = renderClassTeacher;
renderClassTeacher = async function () {
  await _gtmcRenderClassTeacher();
  const m = q('main');
  if (!m || m.querySelector('[data-panel="performance"]') || !getClassTeacherClass()) return;
  m.insertAdjacentHTML('beforeend', `
  <div class="panel" data-panel="performance">
    <div class="page-head"><h1>Test Performance</h1><p>Analysis of ${esc(getClassTeacherClass())} from existing score records. Missing scores are not treated as zero.</p></div>
    <div class="card"><div class="grid cols-3">
      <div><label>Term</label><select id="ctPerfTerm"><option>Term1</option><option>Term2</option><option>Term3</option></select></div>
      <div><label>Assessment</label><select id="ctPerfAssessment"><option value="total">Subject Total /100</option><option value="T1">CA 1 /10</option><option value="T2">CA 2 /10</option><option value="T3">CA 3 /10</option><option value="Exam">Exam /70</option></select></div>
      <div style="display:flex;align-items:flex-end"><button class="blue" onclick="loadTeacherAcademicSummary()">Analyse</button></div>
    </div></div>
    <div class="grid cols-4" id="ctPerfStats"></div>
    <div class="card"><h2>Subject Performance</h2><div id="ctPerfSubjects" class="empty">Choose a term and analyse.</div></div>
    <div class="card"><h2>Student Performance</h2><div id="ctPerfStudents" class="empty">Analysis will appear here.</div></div>
  </div>`);
  const dom = document.querySelector('.nav-item[data-tab="domains"]');
  if (dom) {
    const it = document.createElement('div');
    it.className = 'nav-item';
    it.dataset.tab = 'performance';
    it.dataset.onload = 'loadTeacherAcademicSummary';
    it.onclick = () => setNav('performance');
    it.innerHTML = '<span class="dot"></span><span>Test Performance</span>';
    dom.after(it);
  }
};
</script>
